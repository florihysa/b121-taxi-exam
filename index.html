{"c":"C","art":"Art. 22 cpv. 3","it":{"q":"Il tachigrafo del taxi è difettoso. Il conducente può ripararlo da sé?","a":["No, deve annunciare il difetto al datore di lavoro","Sì, se è stato istruito e annuncia la riparazione","Sì, purché torni a funzionare entro la giornata"]},"en":{"q":"The taxi's tachograph is defective. May the driver repair it themselves?","a":["No, they must report the defect to the employer","Yes, if trained for it and they report the repair","Yes, provided it works again by the end of the day"]},"x":{"it":"Il tachigrafo è sigillato e può essere riparato solo da un'officina autorizzata. Il conducente non lo tocca: segnala il difetto al datore di lavoro il più presto possibile.","en":"The tachograph is sealed and may be repaired only by an authorised workshop. The driver does not touch it: they report the defect to the employer as soon as possible."},"src":"add75"},
{"c":"O","art":"Art. 11 cpv. 1","it":{"q":"Come deve collocarsi il riposo quotidiano rispetto al giorno di riposo settimanale di un lavoratore?","a":["Subito prima o subito dopo il giorno di riposo","Sempre subito prima del giorno di riposo","Sempre subito dopo il giorno di riposo"]},"en":{"q":"How must the daily rest be placed in relation to an employee's weekly rest day?","a":["Immediately before or after the rest day","Always immediately before the rest day","Always immediately after the rest day"]},"x":{"it":"Il riposo quotidiano va attaccato al giorno di riposo, ma può stare sia prima sia dopo. Così il lavoratore ha almeno 24 + 11 = 35 ore libere di seguito (33 con il riposo ridotto).","en":"The daily rest must be attached to the rest day, but it can come either before or after. That gives the employee at least 24 + 11 = 35 hours off in a row (33 with reduced rest)."},"src":"add76"},
{"c":"T","art":"Art. 2 cpv. 2 lett. c","it":{"q":"Chi è considerato «lavoratore» secondo l'OLR 2?","a":["Chi non è conducente indipendente","Chi guida un veicolo di sua proprietà","Chi guida meno di 48 ore alla settimana"]},"en":{"q":"Who is considered an “employee” under the OLR 2?","a":["Anyone who is not a self-employed driver","Anyone who drives a vehicle they own","Anyone who drives less than 48 hours a week"]},"x":{"it":"Lavoratore è semplicemente chi non è indipendente, in pratica chi guida per conto di un datore di lavoro. Il numero di ore lavorate non c'entra.","en":"An employee is simply anyone who is not self-employed, in practice someone who drives for an employer. The number of hours worked has nothing to do with it."},"src":"add77"},
{"c":"O","art":"Art. 7 cpv. 2","it":{"q":"Qual è il tempo di guida settimanale massimo per un tassista indipendente?","a":["45 ore, come per ogni conducente","53 ore, come il lavoro nelle imprese di tassì","Non è regolato, come il suo tempo di lavoro"]},"en":{"q":"What is the maximum weekly driving time for a self-employed taxi driver?","a":["45 hours, as for every driver","53 hours, like working time in taxi businesses","It is not regulated, like their working time"]},"x":{"it":"Il limite di guida di 45 ore a settimana vale per tutti, anche per l'indipendente. Per lui non è limitato solo il tempo di LAVORO; le 53 ore riguardano il lavoro dei dipendenti.","en":"The driving limit of 45 hours a week applies to everyone, including the self-employed. For them only WORKING time is unlimited; the 53 hours concern employees' working time."},"src":"add78"},
{"c":"T","art":"Art. 2 cpv. 2 lett. a","it":{"q":"Chi è considerato «conducente» ai sensi dell'OLR 2?","a":["Chi guida un veicolo OLR 2, anche per breve tempo","Chi guida un veicolo OLR 2 almeno un'ora al giorno","Chi guida un veicolo OLR 2 e ha un libretto di lavoro"]},"en":{"q":"Who is considered a “driver” within the meaning of the OLR 2?","a":["Anyone driving an OLR 2 vehicle, even briefly","Anyone driving an OLR 2 vehicle at least 1 hour a day","Anyone driving an OLR 2 vehicle with a work record book"]},"x":{"it":"Conducente è chiunque guidi uno di questi veicoli, anche solo per pochi minuti. Non serve un numero minimo di ore, né avere già un libretto di lavoro.","en":"A driver is anyone who drives one of these vehicles, even for just a few minutes. No minimum number of hours is needed, nor already having a work record book."},"src":"add79"},
{"c":"O","art":"Art. 6 cpv. 3","it":{"q":"Datore di lavoro e lavoratore concordano un termine più lungo per compensare lo straordinario. Qual è il limite massimo?","a":["12 mesi","6 mesi","Nessun limite"]},"en":{"q":"Employer and employee agree a longer period to compensate overtime. What is the maximum limit?","a":["12 months","6 months","No limit"]},"x":{"it":"Di regola lo straordinario si compensa entro 3 mesi. Datore di lavoro e lavoratore possono concordare un termine più lungo, ma mai oltre 12 mesi.","en":"As a rule overtime is compensated within 3 months. Employer and employee may agree on a longer period, but never more than 12 months."},"src":"add80"},
{"c":"C","art":"Art. 14","it":{"q":"Su quali mezzi di controllo ci si basa per verificare il rispetto della durata del lavoro, della guida e del riposo?","a":["Tachigrafo, libretto di lavoro e registro del datore","Tassametro, contratto di lavoro e registro del datore","Tachigrafo, ricevute dei clienti ed elenco conducenti"]},"en":{"q":"Which control documents are used to check compliance with working, driving and rest times?","a":["Tachograph, work record book and employer's register","Taximeter, employment contract and employer's register","Tachograph, customer receipts and list of drivers"]},"x":{"it":"I tre mezzi di controllo sono: ciò che registra il tachigrafo, ciò che il conducente scrive nel libretto di lavoro e il registro tenuto dal datore di lavoro. Tassametro, contratti e ricevute non lo sono.","en":"The three means of control are: what the tachograph records, what the driver writes in the work record book, and the register kept by the employer. Taximeters, contracts and receipts are not."},"src":"add81"},
{"c":"C","art":"Art. 19 cpv. 1","it":{"q":"Per quanto tempo è valida la dispensa dal foglio settimanale concessa a chi tiene rapporti giornalieri interni all'azienda?","a":["Due anni, a nome del conducente","Un anno, a nome del conducente","Cinque anni, a nome dell'azienda"]},"en":{"q":"How long is the exemption from the weekly sheet valid for drivers who keep company-internal daily reports?","a":["Two years, in the driver's name","One year, in the driver's name","Five years, in the business's name"]},"x":{"it":"La dispensa per chi usa i rapporti giornalieri dell'azienda vale 2 anni ed è intestata al singolo conducente. Quella di 1 anno riguarda invece chi ha un orario sempre uguale.","en":"The exemption for those using the business's daily reports is valid for 2 years and is made out to the individual driver. The 1-year one is for those whose schedule is always the same."},"src":"add82"},
{"c":"C","art":"Art. 21 cpv. 3","it":{"q":"Cosa deve contenere il registro per i conducenti indipendenti?","a":["Solo la guida giornaliera e il riposo settimanale","Tutto ciò che è previsto per i lavoratori","Nulla: gli indipendenti non tengono alcun registro"]},"en":{"q":"What must the register contain for self-employed drivers?","a":["Only the daily driving time and the weekly rest","Everything that is required for employees","Nothing: the self-employed keep no register"]},"x":{"it":"Per l'indipendente l'OLR 2 limita solo guida e riposo, non il lavoro. Nel registro bastano quindi la guida giornaliera e il riposo settimanale; straordinari e semigiornate riguardano solo i lavoratori.","en":"For the self-employed, OLR 2 limits only driving and rest, not work. So the register needs only the daily driving time and the weekly rest; overtime and half-days concern employees only."},"src":"add83"},
{"c":"C","art":"Art. 22 cpv. 4","it":{"q":"Quale elenco deve tenere il datore di lavoro riguardo ai conducenti?","a":["Nome, indirizzo, data di nascita e numero del libretto","Nome, salario, ore straordinarie e multe ricevute","Targa, chilometraggio e incassi di ogni veicolo"]},"en":{"q":"Which list must the employer keep regarding the drivers?","a":["Name, address, date of birth and book number","Name, wage, overtime hours and fines received","Registration number, mileage and takings per vehicle"]},"x":{"it":"L'elenco serve all'autorità per sapere chi guida per l'azienda e con quale libretto: nome, indirizzo, data di nascita e numero del libretto di lavoro. Salari, multe e incassi non ci vanno.","en":"The list lets the authority know who drives for the business and with which book: name, address, date of birth and work record book number. Wages, fines and takings do not belong in it."},"src":"add84"},
{"c":"C","art":"Art. 28 cpv. 2","it":{"q":"Chi non mantiene il tachigrafo in funzione o fa iscrizioni inveritiere nel libretto di lavoro è punito...","a":["Con la multa prevista per queste violazioni","Con un semplice avvertimento scritto","Con la revoca automatica dell'autorizzazione"]},"en":{"q":"Anyone who does not keep the tachograph running or makes untrue entries in the work record book is punished...","a":["With a fine, as for any such violation","With a simple written warning","With automatic withdrawal of the authorisation"]},"x":{"it":"Spegnere il tachigrafo o scrivere dati falsi nel libretto è una violazione delle regole sul controllo ed è punita con la multa. Non basta un avvertimento, ma non c'è nemmeno una revoca automatica.","en":"Switching off the tachograph or writing false data in the book is a breach of the control rules and is punished with a fine. A warning is not enough, but there is no automatic withdrawal either."},"src":"add85"},
{"c":"O","art":"Art. 8 cpv. 3","it":{"q":"Una persona ha lavorato 8 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 35 minuti","Almeno 40 minuti"]},"en":{"q":"A person has worked 8 hours. How long must the work break be?","a":["At least 30 minutes","At least 35 minutes","At least 40 minutes"]},"x":{"it":"8 ore stanno nella fascia «oltre 7 e fino a 9 ore» di lavoro, e in questa fascia la pausa è di almeno 30 minuti. Sarebbero 20 minuti fino a 7 ore e 1 ora oltre le 9 ore.","en":"8 hours falls in the band “more than 7 and up to 9 hours” of work, and in that band the break is at least 30 minutes. It would be 20 minutes up to 7 hours and 1 hour above 9 hours."},"vars":[{"it":{"q":"Una persona ha lavorato 8 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 35 minuti","Almeno 40 minuti"]},"en":{"q":"A person has worked 8 hours. How long must the work break be?","a":["At least 30 minutes","At least 35 minutes","At least 40 minutes"]},"x":{"it":"8 ore stanno nella fascia «oltre 7 e fino a 9 ore» di lavoro, e in questa fascia la pausa è di almeno 30 minuti. Sarebbero 20 minuti fino a 7 ore e 1 ora oltre le 9 ore.","en":"8 hours falls in the band “more than 7 and up to 9 hours” of work, and in that band the break is at least 30 minutes. It would be 20 minutes up to 7 hours and 1 hour above 9 hours."}},{"it":{"q":"Una persona ha lavorato 7 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 20 minuti","Almeno 30 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 7 hours. How long must the work break be?","a":["At least 20 minutes","At least 30 minutes","At least 45 minutes"]},"x":{"it":"7 ore esatte sono ancora nella fascia «fino a 7 ore», quindi bastano 20 minuti. I 30 minuti servono solo quando si superano le 7 ore.","en":"Exactly 7 hours is still in the band “up to 7 hours”, so 20 minutes is enough. The 30 minutes are needed only once you go over 7 hours."}},{"it":{"q":"Una persona ha lavorato 9 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 45 minuti","Almeno 60 minuti"]},"en":{"q":"A person has worked 9 hours. How long must the work break be?","a":["At least 30 minutes","At least 45 minutes","At least 60 minutes"]},"x":{"it":"9 ore esatte sono ancora nella fascia «oltre 7 e fino a 9 ore», quindi bastano 30 minuti. L'ora intera (60 minuti) serve solo quando si superano le 9 ore.","en":"Exactly 9 hours is still in the band “more than 7 and up to 9 hours”, so 30 minutes is enough. The full hour (60 minutes) is needed only once you go over 9 hours."}},{"it":{"q":"Una persona ha lavorato 6 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 20 minuti","Almeno 15 minuti","Almeno 30 minuti"]},"en":{"q":"A person has worked 6 hours. How long must the work break be?","a":["At least 20 minutes","At least 15 minutes","At least 30 minutes"]},"x":{"it":"6 ore rientrano nella fascia «fino a 7 ore»: la pausa è di almeno 20 minuti. 15 minuti non valgono come pausa, e 30 minuti servono solo oltre le 7 ore.","en":"6 hours falls in the band “up to 7 hours”: the break is at least 20 minutes. 15 minutes does not count as a break, and 30 minutes is needed only above 7 hours."}},{"it":{"q":"Una persona ha lavorato 10 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 60 minuti","Almeno 30 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 10 hours. How long must the work break be?","a":["At least 60 minutes","At least 30 minutes","At least 45 minutes"]},"x":{"it":"10 ore superano le 9 ore, quindi la pausa è di almeno 1 ora (60 minuti), anche divisa in 2×30 o 3×20 minuti. 30 minuti bastano solo fino a 9 ore.","en":"10 hours is over 9 hours, so the break is at least 1 hour (60 minutes), which may be split into 2×30 or 3×20 minutes. 30 minutes is enough only up to 9 hours."}},{"it":{"q":"Una persona ha lavorato 7 ore e mezza. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 20 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 7½ hours. How long must the work break be?","a":["At least 30 minutes","At least 20 minutes","At least 45 minutes"]},"x":{"it":"7 ore e mezza superano le 7 ore, quindi si è già nella fascia «oltre 7 e fino a 9 ore»: almeno 30 minuti. 20 minuti bastano solo fino a 7 ore esatte.","en":"7½ hours is over 7 hours, so you are already in the band “more than 7 and up to 9 hours”: at least 30 minutes. 20 minutes is enough only up to exactly 7 hours."}},{"it":{"q":"Una persona ha lavorato 9 ore e mezza. Quanto deve durare la pausa di lavoro?","a":["Almeno 60 minuti","Almeno 30 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 9½ hours. How long must the work break be?","a":["At least 60 minutes","At least 30 minutes","At least 45 minutes"]},"x":{"it":"9 ore e mezza superano le 9 ore, quindi serve almeno 1 ora (60 minuti) di pausa. 30 minuti bastano solo fino a 9 ore esatte.","en":"9½ hours is over 9 hours, so a break of at least 1 hour (60 minutes) is needed. 30 minutes is enough only up to exactly 9 hours."}}],"src":"add86"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Un conducente ha guidato 4 ore e mezza senza pausa. Quanto deve durare la pausa?","a":["Almeno 45 minuti","Almeno 30 minuti","Almeno 60 minuti"]},"en":{"q":"A driver has driven 4½ hours without a break. How long must the break be?","a":["At least 45 minutes","At least 30 minutes","At least 60 minutes"]},"x":{"it":"Dopo 4 ore e mezza di guida la pausa deve essere di almeno 45 minuti. 30 minuti bastano solo se la pausa viene presa prima di arrivare a 4 ore e mezza.","en":"After 4½ hours of driving the break must be at least 45 minutes. 30 minutes is enough only if the break is taken before reaching 4½ hours."},"vars":[{"it":{"q":"Un conducente ha guidato 4 ore e mezza senza pausa. Quanto deve durare la pausa?","a":["Almeno 45 minuti","Almeno 30 minuti","Almeno 60 minuti"]},"en":{"q":"A driver has driven 4½ hours without a break. How long must the break be?","a":["At least 45 minutes","At least 30 minutes","At least 60 minutes"]},"x":{"it":"Dopo 4 ore e mezza di guida la pausa deve essere di almeno 45 minuti. 30 minuti bastano solo se la pausa viene presa prima di arrivare a 4 ore e mezza.","en":"After 4½ hours of driving the break must be at least 45 minutes. 30 minutes is enough only if the break is taken before reaching 4½ hours."}},{"it":{"q":"Un conducente fa un'unica pausa dopo 3 ore di guida. Quanto deve durare almeno?","a":["Almeno 30 minuti","Almeno 20 minuti","Almeno 45 minuti"]},"en":{"q":"A driver takes a single break after 3 hours of driving. How long must it be at least?","a":["At least 30 minutes","At least 20 minutes","At least 45 minutes"]},"x":{"it":"La pausa è presa prima di arrivare a 4 ore e mezza di guida, quindi come pausa unica bastano 30 minuti. 20 minuti bastano solo se le pause sono due.","en":"The break is taken before reaching 4½ hours of driving, so as a single break 30 minutes is enough. 20 minutes is enough only if there are two breaks."}},{"it":{"q":"Un conducente fa un'unica pausa dopo 4 ore di guida. Quanto deve durare almeno?","a":["Almeno 30 minuti","Almeno 45 minuti","Almeno 20 minuti"]},"en":{"q":"A driver takes a single break after 4 hours of driving. How long must it be at least?","a":["At least 30 minutes","At least 45 minutes","At least 20 minutes"]},"x":{"it":"4 ore sono ancora meno di 4 ore e mezza, quindi come pausa unica bastano 30 minuti. I 45 minuti servono solo dopo 4 ore e mezza di guida piene.","en":"4 hours is still less than 4½ hours, so as a single break 30 minutes is enough. The 45 minutes are needed only after a full 4½ hours of driving."}},{"it":{"q":"Dopo 2 ore di guida un conducente ha fatto una pausa di 20 minuti. Quanto deve durare la seconda pausa, presa prima di raggiungere 4 ore e mezza di guida?","a":["Almeno 20 minuti","Almeno 10 minuti","Almeno 30 minuti"]},"en":{"q":"After 2 hours of driving a driver took a 20-minute break. How long must the second break be, taken before reaching 4½ hours of driving?","a":["At least 20 minutes","At least 10 minutes","At least 30 minutes"]},"x":{"it":"Prima delle 4 ore e mezza la pausa può essere fatta in due parti da 20 minuti ciascuna. La prima è già stata fatta, quindi anche la seconda deve durare almeno 20 minuti.","en":"Before the 4½ hours the break may be taken in two parts of 20 minutes each. The first has already been taken, so the second must also last at least 20 minutes."}}],"src":"add89"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Anche il conducente indipendente deve fare una pausa di guida dopo 4 ore e mezza di guida?","a":["Sì, la pausa di guida vale per tutti i conducenti","No, la pausa di guida vale solo per i lavoratori","Sì, ma solo quando trasporta dei passeggeri"]},"en":{"q":"Must a self-employed driver also take a driving break after 4½ hours of driving?","a":["Yes, the driving break applies to all drivers","No, the driving break applies only to employees","Yes, but only when carrying passengers"]},"x":{"it":"La pausa di guida protegge dalla stanchezza al volante, quindi vale per ogni conducente, anche indipendente e anche senza passeggeri. Solo le pause di LAVORO riguardano soltanto i lavoratori dipendenti.","en":"The driving break protects against tiredness at the wheel, so it applies to every driver, including the self-employed and even without passengers. Only WORK breaks are for employees alone."},"src":"add90"},
{"c":"O","art":"Art. 8 cpv. 4","it":{"q":"Un lavoratore divide la pausa di lavoro in due parti. Quante ore di lavoro possono trascorrere al massimo tra le due parti?","a":["5 ore e mezza","4 ore e mezza","6 ore e mezza"]},"en":{"q":"An employee splits the work break into two parts. How many hours of work may there be at most between the two parts?","a":["5½ hours","4½ hours","6½ hours"]},"x":{"it":"Tra una pausa di lavoro e l'altra (o tra una pausa e il riposo) non si può lavorare più di 5 ore e mezza. Le 4 ore e mezza sono invece il limite di guida prima della pausa di guida.","en":"Between one work break and the next (or between a break and the rest) you may not work more than 5½ hours. The 4½ hours are instead the driving limit before the driving break."},"src":"add91"},
{"c":"C","art":"Art. 22 cpv. 3","it":{"q":"Quando il conducente deve annunciare al datore di lavoro un difetto del tachigrafo?","a":["Al più presto possibile","Entro la fine della settimana","Al prossimo servizio del veicolo"]},"en":{"q":"When must the driver report a tachograph defect to the employer?","a":["As soon as possible","By the end of the week","At the next vehicle service"]},"x":{"it":"Un tachigrafo guasto non registra più i tempi, quindi il datore di lavoro deve saperlo subito per farlo riparare: il difetto va annunciato al più presto possibile, non a fine settimana.","en":"A broken tachograph no longer records the times, so the employer must know at once to have it repaired: the defect is reported as soon as possible, not at the end of the week."},"src":"add92"},
{"c":"V","art":"ONC (regola dei manuali)","it":{"q":"Quante ore prima dell'inizio del lavoro il conducente non può più consumare bevande alcoliche?","a":["6 ore","4 ore","8 ore"]},"en":{"q":"How many hours before starting work may the driver no longer drink alcohol?","a":["6 hours","4 hours","8 hours"]},"x":{"it":"Secondo la regola insegnata per l'esame, il conducente non beve alcol durante il lavoro e nelle 6 ore prima di iniziare. Oggi vale inoltre il limite di 0,10 per mille alla guida.","en":"According to the rule taught for the exam, the driver does not drink alcohol during work or in the 6 hours before starting. Today the 0.10 per mille limit at the wheel also applies."},"vars":[{"it":{"q":"Quante ore prima dell'inizio del lavoro il conducente non può più consumare bevande alcoliche?","a":["6 ore","4 ore","8 ore"]},"en":{"q":"How many hours before starting work may the driver no longer drink alcohol?","a":["6 hours","4 hours","8 hours"]},"x":{"it":"Secondo la regola insegnata per l'esame, il conducente non beve alcol durante il lavoro e nelle 6 ore prima di iniziare. Oggi vale inoltre il limite di 0,10 per mille alla guida.","en":"According to the rule taught for the exam, the driver does not drink alcohol during work or in the 6 hours before starting. Today the 0.10 per mille limit at the wheel also applies."}},{"it":{"q":"Un conducente inizia il lavoro alle 14:00. Fino a che ora può ancora consumare bevande alcoliche?","a":["Fino alle 08:00","Fino alle 10:00","Fino alle 12:00"]},"en":{"q":"A driver starts work at 14:00. Until what time may they still drink alcohol?","a":["Until 08:00","Until 10:00","Until 12:00"]},"x":{"it":"La regola d'esame è: niente alcol nelle 6 ore prima di iniziare il lavoro. 14:00 − 6 ore = 08:00, quindi dopo le 08:00 non si beve più.","en":"The exam rule is: no alcohol in the 6 hours before starting work. 14:00 − 6 hours = 08:00, so after 08:00 there is no more drinking."}},{"it":{"q":"Un conducente inizia il lavoro alle 18:00. Fino a che ora può ancora consumare bevande alcoliche?","a":["Fino alle 12:00","Fino alle 14:00","Fino alle 16:00"]},"en":{"q":"A driver starts work at 18:00. Until what time may they still drink alcohol?","a":["Until 12:00","Until 14:00","Until 16:00"]},"x":{"it":"La regola d'esame è: niente alcol nelle 6 ore prima di iniziare il lavoro. 18:00 − 6 ore = 12:00, quindi dopo le 12:00 non si beve più.","en":"The exam rule is: no alcohol in the 6 hours before starting work. 18:00 − 6 hours = 12:00, so after 12:00 there is no more drinking."}}],"src":"add93"},
{"c":"V","art":"ONC art. 2a","it":{"q":"Da quale tasso alcolemico chi effettua trasporti professionali di persone è considerato sotto l'influsso dell'alcol?","a":["Da 0,10 per mille","Da 0,25 per mille","Da 0,50 per mille"]},"en":{"q":"From which blood alcohol level is a driver in professional passenger transport considered under the influence of alcohol?","a":["From 0.10 per mille","From 0.25 per mille","From 0.50 per mille"]},"x":{"it":"Nel trasporto professionale di persone vale in pratica «zero alcol»: si è considerati sotto l'influsso dell'alcol già da 0,10 per mille. Lo 0,50 per mille è il limite dei normali conducenti privati.","en":"In professional passenger transport it is “zero alcohol” in practice: you count as under the influence from as little as 0.10 per mille. 0.50 per mille is the limit for ordinary private drivers."},"src":"add94"},

. Non c'è tempo fino a fine mese.","en":"The quarterly report must be submitted within 14 days of the end of the quarter: 31 December + 14 days = 14 January. You do not have until the end of the month."}}],"src":"add109"},

{"c":"C","art":"OLR 1 art. 14c cpv. 2 (via art. 16a)","it":{"q":"A un controllo stradale, cosa deve poter presentare il conducente di un taxi con tachigrafo digitale?","a":["La carta del conducente","Il libretto di lavoro","I dischi dei 28 giorni precedenti"]},"en":{"q":"At a roadside check, what must the driver of a taxi with a digital tachograph be able to present?","a":["The driver card","The work record book","The sheets of the previous 28 days"]},"x":{"it":"Il tachigrafo digitale salva i dati sulla carta del conducente, quindi al controllo basta mostrare la carta. I dischi dei 28 giorni precedenti esistono solo con il tachigrafo analogico.","en":"The digital tachograph stores the data on the driver card, so at a check it is enough to show the card. The sheets of the previous 28 days exist only with the analogue tachograph."},"src":"add111"},
{"c":"C","art":"OLR 1 art. 18 cpv. 3 (via art. 16a)","it":{"q":"Il taxi ha un tachigrafo UE. Per quanto tempo il datore di lavoro deve conservare i dischi e i dati del tachigrafo?","a":["3 anni, ordinati per conducente","2 anni, ordinati per veicolo","5 anni, ordinati per data"]},"en":{"q":"The taxi has an EU tachograph. How long must the employer keep the tachograph sheets and data?","a":["3 years, sorted by driver","2 years, sorted by vehicle","5 years, sorted by date"]},"x":{"it":"Con il tachigrafo UE i dischi sono personali, perciò si conservano 3 anni e ordinati per conducente. I 2 anni ordinati per veicolo valgono per il tachigrafo CH.","en":"With the EU tachograph the sheets are personal, so they are kept for 3 years and sorted by driver. The 2 years sorted by vehicle apply to the CH tachograph."},"src":"add112"},
{"c":"O","art":"Art. 11 cpv. 4","it":{"q":"Due giorni di riposo settimanale possono essere cumulati nell'arco di due settimane?","a":["Sì, per i conducenti indipendenti","Sì, per i lavoratori dipendenti","No, questo è sempre vietato"]},"en":{"q":"May two weekly rest days be combined within a period of two weeks?","a":["Yes, for self-employed drivers","Yes, for employed drivers","No, this is always forbidden"]},"x":{"it":"Solo l'indipendente può organizzarsi su due settimane: in questo periodo fa due giorni di riposo di almeno 24 ore ciascuno. Il lavoratore dipendente ha invece un giorno di riposo ogni settimana.","en":"Only the self-employed can plan over two weeks: in that period they take two rest days of at least 24 hours each. An employee, by contrast, has one rest day every week."},"src":"add113"},
{"c":"C","art":"Art. 18 cpv. 7-8","it":{"q":"A chi si deve consegnare il libretto di lavoro compilato?","a":["Al datore di lavoro","Alla polizia cantonale","Resta al lavoratore"]},"en":{"q":"To whom must the completed work record book be handed?","a":["To the employer","To the cantonal police","It stays with the employee"]},"x":{"it":"I fogli compilati e il libretto pieno vanno al datore di lavoro, che deve conservarli in azienda per i controlli. Non li ritira la polizia e non restano al lavoratore.","en":"The completed sheets and the full book go to the employer, who must keep them at the business for checks. The police do not collect them and they do not stay with the employee."},"src":"add114"},
{"c":"O","art":"Art. 7 cpv. 1-2","it":{"q":"Qual è la durata massima giornaliera e settimanale della guida per un conducente indipendente?","a":["9 ore al giorno, 45 ore alla settimana","10 ore al giorno, 50 ore alla settimana","11 ore al giorno, 55 ore alla settimana"]},"en":{"q":"What is the maximum daily and weekly driving time for a self-employed driver?","a":["9 hours a day, 45 hours a week","10 hours a day, 50 hours a week","11 hours a day, 55 hours a week"]},"x":{"it":"I limiti di guida sono uguali per tutti, anche per l'indipendente: 9 ore tra due riposi giornalieri e 45 ore per settimana.","en":"The driving limits are the same for everyone, including the self-employed: 9 hours between two daily rests and 45 hours a week."},"src":"add115"},
{"c":"C","art":"Art. 18 cpv. 2-3","it":{"q":"Il conducente deve compilare il foglio settimanale del libretto di lavoro?","a":["Sì, ogni giorno, all'inizio dell'attività","No, il disco del tachigrafo è sufficiente","Solo il lavoratore dipendente lo deve compilare"]},"en":{"q":"Must the driver fill in the weekly sheet of the work record book?","a":["Yes, every day, when starting the activity","No, the tachograph sheet is enough","Only employed drivers have to fill it in"]},"x":{"it":"Sia il lavoratore sia l'indipendente compilano il foglio settimanale ogni giorno, quando iniziano l'attività. Il disco del tachigrafo non lo sostituisce.","en":"Both employees and the self-employed fill in the weekly sheet every day, when they start their activity. The tachograph sheet does not replace it."},"src":"add116"},
{"c":"O","art":"Art. 6 cpv. 1","it":{"q":"Quante ore di lavoro straordinario sono ammesse all'anno per un lavoratore?","a":["208 ore all'anno","204 ore all'anno","202 ore all'anno"]},"en":{"q":"How many hours of overtime are allowed per year for an employee?","a":["208 hours per year","204 hours per year","202 hours per year"]},"x":{"it":"Il massimo è di 208 ore per anno civile, cioè 4 ore di straordinario per ognuna delle 52 settimane (52 × 4 = 208).","en":"The maximum is 208 hours per calendar year, that is 4 hours of overtime for each of the 52 weeks (52 × 4 = 208)."},"src":"add117"},
{"c":"O","art":"Art. 11 cpv. 1","it":{"q":"Di quante ore consecutive deve essere il riposo settimanale, senza contare il riposo quotidiano che lo precede o lo segue?","a":["24 ore","18 ore","11 ore"]},"en":{"q":"How many consecutive hours must the weekly rest be, not counting the daily rest that precedes or follows it?","a":["24 hours","18 hours","11 hours"]},"x":{"it":"Il giorno di riposo settimanale è di almeno 24 ore di seguito. Le 11 ore sono il riposo quotidiano che si aggiunge prima o dopo, e 18 sono le ore che devono cadere di domenica.","en":"The weekly rest day is at least 24 hours in a row. The 11 hours are the daily rest added before or after it, and 18 is the number of hours that must fall on the Sunday."},"src":"add118"},
{"c":"T","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Come va considerata una pausa inferiore a 15 minuti?","a":["Come attività professionale","Come pausa obbligatoria","Come parte del riposo quotidiano"]},"en":{"q":"How is a break of less than 15 minutes to be treated?","a":["As professional activity","As a compulsory break","As part of the daily rest"]},"x":{"it":"Un'interruzione di meno di 15 minuti è troppo corta per valere come pausa: viene contata come tempo di lavoro, cioè come attività professionale.","en":"An interruption of less than 15 minutes is too short to count as a break: it is counted as working time, i.e. as professional activity."},"src":"add119"},
{"c":"O","art":"Art. 5 cpv. 1","it":{"q":"Qual è la durata massima della settimana lavorativa del lavoratore?","a":["48 ore, 53 ore nelle imprese di tassì","55 ore, 50 ore nelle imprese di tassì","52 ore per tutti i lavoratori"]},"en":{"q":"What is the maximum working week of an employee?","a":["48 hours, 53 hours in taxi businesses","55 hours, 50 hours in taxi businesses","52 hours for all employees"]},"x":{"it":"La settimana lavorativa massima è di 48 ore; solo nelle imprese di tassì sale a 53 ore. Le 52 ore sono 48 + 4 di straordinario, non il massimo normale.","en":"The maximum working week is 48 hours; only in taxi businesses does it rise to 53 hours. 52 hours is 48 + 4 of overtime, not the normal maximum."},"src":"add120"},
{"c":"O","art":"Art. 20 cpv. 1","it":{"q":"Si può derogare alle disposizioni sulla durata del lavoro, della guida e del riposo?","a":["Solo per necessità: forza maggiore o soccorso","No, in nessun caso, nemmeno per portare soccorso","Sì, se il superamento non dura più di mezz'ora"]},"en":{"q":"May one deviate from the rules on working, driving and rest time?","a":["Only in necessity: force majeure or giving help","No, in no case, not even to give help","Yes, if it is exceeded by no more than half an hour"]},"x":{"it":"Le regole si possono superare solo in una vera necessità, come forza maggiore o soccorso, e solo se la sicurezza lo permette. La deroga va poi annotata nel libretto di lavoro e nel registro.","en":"The rules may be exceeded only in real necessity, such as force majeure or giving help, and only if safety allows it. The deviation must then be noted in the work record book and in the register."},"src":"add121"},
{"c":"C","art":"OETV art. 101 cpv. 5","it":{"q":"Cosa si deve controllare dopo un servizio o una riparazione effettuati al tachigrafo?","a":["I sigilli (piombi) nei punti di chiusura","La chiave e i dischi presenti nel veicolo","La precisione delle misure, a cura del conducente"]},"en":{"q":"What must be checked after a service or repair carried out on the tachograph?","a":["The seals at the closure points","The key and the sheets in the vehicle","The accuracy of the measurements, by the driver"]},"x":{"it":"Il tachigrafo è protetto da sigilli (piombi) contro le manomissioni. Dopo ogni servizio o riparazione bisogna assicurarsi che i sigilli siano al loro posto e intatti.","en":"The tachograph is protected against tampering by seals. After every service or repair you must make sure the seals are in place and intact."},"src":"add122"},
{"c":"P","art":"Art. 4 cpv. 1 lett. a","it":{"q":"I conducenti di veicoli equipaggiati come ambulanze sottostanno all'OLR 2?","a":["No, non sottostanno all'OLR 2","Sì, come tutti i conducenti professionali","Solo durante le corse urgenti"]},"en":{"q":"Are drivers of vehicles equipped as ambulances subject to the OLR 2?","a":["No, they are not subject to the OLR 2","Yes, like all professional drivers","Only during urgent trips"]},"x":{"it":"Le ambulanze sono un'eccezione espressa: i trasporti con veicoli equipaggiati per compiti sanitari non rientrano nell'OLR 2, né nelle corse urgenti né nelle altre.","en":"Ambulances are an express exception: transport with vehicles equipped for medical tasks does not fall under OLR 2, whether on urgent trips or on others."},"src":"add123"},
{"c":"O","art":"Art. 12 cpv. 2","it":{"q":"Le semigiornate libere settimanali di quattro settimane consecutive di lavoro possono essere prese in blocco?","a":["Sì, per il lavoratore","Sì, ma soltanto per gli indipendenti","No, vanno prese ogni settimana"]},"en":{"q":"May the weekly free half-days of four consecutive working weeks be taken together?","a":["Yes, for the employee","Yes, but only for the self-employed","No, they must be taken every week"]},"x":{"it":"Solo il lavoratore dipendente ha diritto alla semigiornata libera. D'accordo con il datore di lavoro può prendere in una sola volta le semigiornate di quattro settimane consecutive.","en":"Only an employee is entitled to the free half-day. By agreement with the employer they may take the half-days of four consecutive weeks all at once."},"src":"add124"},
{"c":"C","art":"Art. 16 cpv. 5","it":{"q":"Si può usare un disco giornaliero in un tachigrafo settimanale?","a":["Sì, un disco giornaliero speciale","Sì, qualsiasi disco giornaliero","No, in nessun caso è permesso"]},"en":{"q":"May a daily sheet be used in a weekly tachograph?","a":["Yes, a special daily sheet","Yes, any daily sheet","No, it is never permitted"]},"x":{"it":"In un tachigrafo settimanale non va un disco giornaliero qualsiasi: serve il disco giornaliero speciale, fatto apposta per questi apparecchi.","en":"An ordinary daily sheet does not go in a weekly tachograph: you need the special daily sheet made for these devices."},"src":"add125"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"La guida interrotta da una pausa di meno di 15 minuti è considerata ininterrotta?","a":["Sì, una pausa così breve non conta come pausa","No, ogni pausa interrompe la durata della guida","No, bastano 10 minuti per interrompere la guida"]},"en":{"q":"Is driving that is interrupted by a break of less than 15 minutes considered uninterrupted?","a":["Yes, such a short break does not count as a break","No, every break interrupts the driving time","No, 10 minutes are enough to interrupt the driving"]},"x":{"it":"Una sosta di meno di 15 minuti non vale come pausa, quindi la guida continua a contare come ininterrotta. Per interromperla servono almeno 20 minuti per volta.","en":"A stop of less than 15 minutes does not count as a break, so the driving still counts as uninterrupted. To interrupt it you need at least 20 minutes at a time."},"src":"add126"},
{"c":"T","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Quale periodo conta come durata del lavoro?","a":["Il tempo a disposizione del datore di lavoro","Soltanto il tempo in cui si guida il veicolo","Tutta la guida dalle 06:00 alle 18:00"]},"en":{"q":"Which period counts as working time?","a":["The time at the employer's disposal","Only the time spent driving the vehicle","The whole driving time from 06:00 to 18:00"]},"x":{"it":"È tempo di lavoro tutto il tempo in cui il lavoratore deve restare a disposizione del datore di lavoro, anche se aspetta soltanto. Non conta solo la guida.","en":"Working time is all the time during which the employee must remain at the employer's disposal, even if they are only waiting. It is not just the driving."},"src":"add127"},
{"c":"O","art":"Art. 9 cpv. 2","it":{"q":"Se il conducente suddivide il riposo quotidiano in 3 periodi, quanto deve durare in totale?","a":["12 ore","11 ore","9 ore"]},"en":{"q":"If the driver splits the daily rest into 3 periods, how long must it be in total?","a":["12 hours","11 hours","9 hours"]},"x":{"it":"Quando il riposo è suddiviso, il totale sale ad almeno 12 ore. Le 11 ore valgono per il riposo preso in una volta sola, e le 9 ore per il riposo ridotto.","en":"When the rest is split, the total rises to at least 12 hours. 11 hours applies to rest taken in one go, and 9 hours to the reduced rest."},"src":"add128"},
{"c":"O","art":"Art. 9 cpv. 1","it":{"q":"Di quante ore deve essere il riposo quotidiano di cui il conducente deve beneficiare in un periodo di 24 ore?","a":["11 ore consecutive","12 ore consecutive","13 ore consecutive"]},"en":{"q":"How many hours of daily rest must the driver have within a period of 24 hours?","a":["11 consecutive hours","12 consecutive hours","13 consecutive hours"]},"x":{"it":"Nelle 24 ore il conducente deve avere 11 ore di riposo di seguito (riducibili a 9 ore tre volte per settimana). Le 12 ore valgono solo per il riposo suddiviso.","en":"Within 24 hours the driver must have 11 hours of rest in a row (which may be reduced to 9 hours three times a week). The 12 hours apply only to split rest."},"src":"add129"},
{"c":"O","art":"Art. 12 cpv. 3","it":{"q":"Un giorno libero formato da 2 semigiornate libere deve comprendere l'intervallo completo...","a":["Dalle 07:00 alle 18:00","Dalle 07:00 alle 17:00","Dalle 06:00 alle 18:00"]},"en":{"q":"A free day made up of 2 free half-days must cover the complete interval...","a":["From 07:00 to 18:00","From 07:00 to 17:00","From 06:00 to 18:00"]},"x":{"it":"Un giorno libero formato da due semigiornate deve coprire tutta la fascia diurna, dalle 07:00 alle 18:00 complete. È la stessa fascia in cui deve cadere ogni semigiornata.","en":"A free day made up of two half-days must cover the whole daytime period, the full 07:00 to 18:00. It is the same period in which every half-day must fall."},"src":"add130"},
{"c":"C","art":"Art. 18 cpv. 4","it":{"q":"Si può circolare se il tachigrafo è in panne?","a":["Sì, con il foglio quotidiano oltre al settimanale","Sì, compilando soltanto il foglio quotidiano","Sì, dopo aver avvisato polizia e datore di lavoro"]},"en":{"q":"May one drive if the tachograph has broken down?","a":["Yes, with the daily sheet as well as the weekly one","Yes, filling in only the daily sheet","Yes, after informing the police and the employer"]},"x":{"it":"Si può circolare, ma il foglio quotidiano si AGGIUNGE a quello settimanale, non lo sostituisce. Chi compila soltanto il foglio quotidiano dimentica quello settimanale.","en":"You may drive, but the daily sheet is filled in IN ADDITION to the weekly sheet, not instead of it. Filling in only the daily sheet leaves out the weekly one."},"src":"add131"},
{"c":"C","art":"Art. 22 cpv. 2","it":{"q":"Chi deve vegliare a che il conducente osservi le disposizioni sulla durata del lavoro, della guida e del riposo?","a":["Il datore di lavoro","Le autorità di controllo del Cantone","L'ufficio della circolazione"]},"en":{"q":"Who must make sure that the driver observes the rules on working, driving and rest time?","a":["The driver's employer","The cantonal control authorities","The road traffic office"]},"x":{"it":"È il datore di lavoro che deve vegliare in modo continuo sul rispetto delle regole da parte dei suoi conducenti. L'autorità cantonale fa i controlli, ma la sorveglianza di ogni giorno spetta a lui.","en":"It is the employer who must continuously make sure their drivers keep to the rules. The cantonal authority carries out checks, but the day-to-day supervision is the employer's job."},"src":"add132"},
{"c":"O","art":"Art. 7 cpv. 3","it":{"q":"Di quante ore al massimo si può superare la durata settimanale di 45 ore di guida?","a":["Nessun superamento è ammesso","Di 4 ore alla settimana","Di 6 ore alla settimana"]},"en":{"q":"By how many hours at most may the weekly driving time of 45 hours be exceeded?","a":["No exceeding is allowed","By 4 hours per week","By 6 hours per week"]},"x":{"it":"Le 45 ore di guida non si possono superare in nessun caso. Le 4 e le 6 ore sono i limiti dello straordinario, che allunga solo il tempo di LAVORO.","en":"The 45 hours of driving may not be exceeded under any circumstances. 4 and 6 hours are the overtime limits, and overtime only extends WORKING time."},"src":"add133"},
{"c":"C","art":"Art. 17 cpv. 1","it":{"q":"Il conducente deve avere con sé il libretto di lavoro a ogni corsa?","a":["Sì, in tutti i casi","No, se il tachigrafo funziona","No, se beneficia di una dispensa"]},"en":{"q":"Must the driver carry the work record book on every trip?","a":["Yes, in all cases","No, if the tachograph works","No, if they have an exemption"]},"x":{"it":"Il libretto di lavoro va portato con sé a ogni corsa, senza eccezioni. Serve anche se il tachigrafo funziona e anche con una dispensa (in quel caso si porta anche la decisione).","en":"The work record book must be carried on every trip, without exception. It is needed even if the tachograph works and even with an exemption (in which case you carry the decision as well)."},"src":"add134"},
{"c":"P","art":"Art. 3 cpv. 2","it":{"q":"Un conducente circola all'estero con un taxi immatricolato in Svizzera. Deve rispettare la durata giornaliera della guida valida in Svizzera?","a":["Sì, salvo accordi internazionali più severi","Sì, ma soltanto nei Paesi confinanti","No, vale sempre la legge del Paese in cui circola"]},"en":{"q":"A driver is abroad with a taxi registered in Switzerland. Must they respect the daily driving time that applies in Switzerland?","a":["Yes, unless international agreements are stricter","Yes, but only in neighbouring countries","No, the local law of the country always applies"]},"x":{"it":"Con un taxi svizzero l'OLR 2 vale anche all'estero, quindi anche il limite di 9 ore di guida al giorno. Solo se un accordo internazionale è più severo si applica quello.","en":"With a Swiss taxi OLR 2 applies abroad as well, and so does the limit of 9 hours of driving a day. Only if an international agreement is stricter does that apply instead."},"src":"add135"},
{"c":"P","art":"Art. 3 cpv. 2","it":{"q":"Un conducente circola all'estero con un veicolo immatricolato in Svizzera (al massimo 8 posti oltre al conducente). L'OLR 2 si applica?","a":["Sì, occorre rispettarla, salvo accordi più severi","Sì, sempre e senza alcuna eccezione","Sì, ma soltanto in parte: guida, pause e riposo"]},"en":{"q":"A driver is abroad with a vehicle registered in Switzerland (at most 8 seats besides the driver). Does the OLR 2 apply?","a":["Yes, in full, unless agreements are stricter","Yes, always and without any exception","Yes, but only in part: driving, breaks and rest"]},"x":{"it":"Con un veicolo svizzero fino a 8 posti oltre al conducente l'OLR 2 vale per intero anche all'estero. Non «sempre e senza eccezioni», però: se un accordo internazionale ratificato dalla Svizzera è più severo, vale quello.","en":"With a Swiss vehicle of up to 8 seats besides the driver, the whole OLR 2 applies abroad too. Not “always and without exception”, though: if an international agreement ratified by Switzerland is stricter, that applies instead."},"src":"add138"},
{"c":"P","art":"Art. 3 cpv. 3","it":{"q":"Un conducente circola in Svizzera con un veicolo immatricolato all'estero. Deve rispettare l'OLR 2?","a":["Sì, ma soltanto in parte: guida, pause e riposo","Sì, interamente, libretto di lavoro compreso","No, valgono solo le regole del suo Paese"]},"en":{"q":"A driver is in Switzerland with a vehicle registered abroad. Must they comply with the OLR 2?","a":["Yes, but only in part: driving, breaks and rest","Yes, in full, work record book included","No, only their own country's rules apply"]},"x":{"it":"Chi viene dall'estero rispetta in Svizzera solo una parte dell'OLR 2: durata della guida, pause, riposo giornaliero e settimanale. Il resto, come il libretto di lavoro svizzero, non lo riguarda.","en":"A driver from abroad follows only part of OLR 2 in Switzerland: driving time, breaks, daily and weekly rest. The rest, such as the Swiss work record book, does not concern them."},"src":"add139"},
{"c":"O","art":"Art. 8 cpv. 3","it":{"q":"Un lavoratore deve osservare una pausa di almeno 30 minuti quando il periodo di lavoro giornaliero supera…","a":["7 ore","6 ore","8 ore"]},"en":{"q":"An employee must take a break of at least 30 minutes when the daily working time exceeds…","a":["7 hours","6 hours","8 hours"]},"x":{"it":"Fino a 7 ore di lavoro basta una pausa di 20 minuti. Appena il lavoro giornaliero supera le 7 ore (e fino a 9) la pausa deve essere di almeno 30 minuti. Oltre le 9 ore serve 1 ora.","en":"Up to 7 hours of work a 20-minute break is enough. As soon as the daily work exceeds 7 hours (and up to 9), the break must be at least 30 minutes. Above 9 hours it is 1 hour."},"vars":[{"it":{"q":"Un lavoratore deve osservare una pausa di almeno 30 minuti quando il periodo di lavoro giornaliero supera…","a":["7 ore","6 ore","8 ore"]},"en":{"q":"An employee must take a break of at least 30 minutes when the daily working time exceeds…","a":["7 hours","6 hours","8 hours"]},"x":{"it":"Fino a 7 ore di lavoro basta una pausa di 20 minuti. Appena il lavoro giornaliero supera le 7 ore (e fino a 9) la pausa deve essere di almeno 30 minuti. Oltre le 9 ore serve 1 ora.","en":"Up to 7 hours of work a 20-minute break is enough. As soon as the daily work exceeds 7 hours (and up to 9), the break must be at least 30 minutes. Above 9 hours it is 1 hour."}},{"it":{"q":"Per un lavoratore basta una pausa di almeno 20 minuti se il periodo di lavoro giornaliero è al massimo di…","a":["7 ore","6 ore","8 ore"]},"en":{"q":"For an employee a break of at least 20 minutes is enough if the daily working time is at most…","a":["7 hours","6 hours","8 hours"]},"x":{"it":"La pausa di 20 minuti basta fino a 7 ore di lavoro al giorno comprese. Con 8 ore si è già nella fascia successiva (più di 7 e fino a 9 ore), dove servono almeno 30 minuti.","en":"The 20-minute break is enough up to and including 7 hours of work a day. With 8 hours you are already in the next band (more than 7 and up to 9 hours), where at least 30 minutes are needed."}},{"it":{"q":"Un lavoratore deve osservare una pausa di almeno 1 ora quando il periodo di lavoro giornaliero supera…","a":["9 ore","7 ore","8 ore"]},"en":{"q":"An employee must take a break of at least 1 hour when the daily working time exceeds…","a":["9 hours","7 hours","8 hours"]},"x":{"it":"La pausa di 1 ora è prescritta solo quando il lavoro giornaliero supera le 9 ore. Tra più di 7 e 9 ore bastano 30 minuti, e fino a 7 ore bastano 20 minuti.","en":"The 1-hour break is required only when the daily work exceeds 9 hours. Between more than 7 and 9 hours 30 minutes are enough, and up to 7 hours 20 minutes are enough."}}],"src":"add140"},
{"c":"O","art":"Art. 8 cpv. 2","it":{"q":"Un lavoratore deve osservare una pausa al più tardi dopo una durata del lavoro di…","a":["5 ore e mezza","4 ore e mezza","6 ore e mezza"]},"en":{"q":"An employee must take a break at the latest after a working time of…","a":["5½ hours","4½ hours","6½ hours"]},"x":{"it":"Un lavoratore non può lavorare più di 5 ore e mezza di fila senza pausa. Le 4 ore e mezza sono invece il limite della guida, dopo il quale serve la pausa di guida di 45 minuti.","en":"An employee may not work more than 5½ hours in a row without a break. The 4½ hours are the driving limit instead, after which the 45-minute driving break is needed."},"src":"add141"},
{"c":"O","art":"Art. 9 cpv. 2","it":{"q":"Un conducente suddivide il riposo quotidiano in più parti. Una delle parti deve durare almeno…","a":["8 ore","6 ore","7 ore"]},"en":{"q":"A driver splits the daily rest into several parts. One of the parts must last at least…","a":["8 hours","6 hours","7 hours"]},"x":{"it":"Quando il riposo è suddiviso, una delle parti deve durare almeno 8 ore di fila. Inoltre nessuna parte può essere più corta di 1 ora e il totale deve arrivare ad almeno 12 ore.","en":"When the rest is split, one of the parts must last at least 8 hours in a row. In addition, no part may be shorter than 1 hour and the total must reach at least 12 hours."},"src":"add142"},

l matters."}},{"it":{"q":"Un conducente suddivide il riposo quotidiano in due parti. La prima dura 10 ore. Quanto deve durare almeno la seconda?","a":["2 ore","1 ora","3 ore"]},"en":{"q":"A driver splits the daily rest into two parts. The first lasts 10 hours. How long must the second be at least?","a":["2 hours","1 hour","3 hours"]},"x":{"it":"Il riposo suddiviso deve arrivare in totale ad almeno 12 ore: 12 − 10 = 2 ore. Con 1 ora sola la parte sarebbe abbastanza lunga, ma il totale sarebbe di 11 ore: troppo poco.","en":"A split rest must reach at least 12 hours in total: 12 − 10 = 2 hours. With only 1 hour the part itself would be long enough, but the total would be 11 hours: too little."}},{"it":{"q":"Un conducente suddivide il riposo quotidiano in due parti di 6 ore ciascuna. È valido?","a":["No, una parte deve durare almeno 8 ore","Sì, il totale raggiunge le 12 ore","Sì, nessuna parte dura meno di 1 ora"]},"en":{"q":"A driver splits the daily rest into two parts of 6 hours each. Is this valid?","a":["No, one part must last at least 8 hours","Yes, the total reaches 12 hours","Yes, no part is shorter than 1 hour"]},"x":{"it":"Il totale è 12 ore e nessuna parte è sotto 1 ora, ma manca una condizione: una delle parti deve durare almeno 8 ore. Due parti da 6 ore non bastano; va bene per esempio 8 + 4.","en":"The total is 12 hours and no part is under 1 hour, but one condition is missing: one of the parts must last at least 8 hours. Two parts of 6 hours are not enough; 8 + 4, for example, is fine."}}],"src":"add143"},

/* ================= STATE ================= */

let view = lang ? 'start' : 'lang';   // lang | start | exam | overview | result | train | trainresult
let exam = null;

const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Case questions: a pool entry may carry several concrete cases (vars); one is drawn per exam and stored with the question.
function QV(qq){ const P=POOL[qq.p]; return (P.vars && Number.isInteger(qq.v) && P.vars[qq.v]) ? P.vars[qq.v] : P; }
// Legal-basis label: the pool stores it in Italian; show English abbreviations in the English version.
function artL(a){
  if(lang!=='en') return a;
  return a.replace(/cpv\./g,'para.').replace(/lett\./g,'let.').replace(/ e /g,' and ').replace(/^RS /,'SR ')
    .replace('OAC / licenza di circolazione','OAC / vehicle registration document').replace('Diritto cantonale','Cantonal law')
    .replace('Uso del tachigrafo','Using the tachograph').replace('Simboli del tachigrafo','Tachograph symbols').replace(/^Tachigrafo$/,'Tachograph')
    .replace('ONC (regola dei manuali)','ONC (textbook rule)').replace(/\bart\. /g,'Art. ');
}
function pickVar(p){ const P=POOL[p]; return P.vars ? Math.floor(Math.random()*P.vars.length) : null; }
const T = ()=>UI[lang||'en'];
const catName = c => (T().cat[c]||(c==='V'?'Varie':c));

}

/* ===== exam persistence ===== */
function saveExam(){
  if(!exam) return;
  try{ localStorage.setItem('b121exam', JSON.stringify({qs:exam.qs, answers:exam.answers, marked:exam.marked, cur:exam.cur, total:exam.total, left:exam.left, fb:exam.fb, ver:VERSION, savedAt:Date.now()})); }catch(e){}
}
function clearSaved(){ try{ localStorage.removeItem('b121exam'); }catch(e){} }
function resumeExam(){
  try{
    const s=JSON.parse(localStorage.getItem('b121exam')||'null');
    if(!s || !Array.isArray(s.qs) || s.qs.length!==EXAM_N || !Array.isArray(s.answers)) return false;
    if(s.ver!==VERSION){ clearSaved(); return false; }   // the pool changed: an old saved exam would point at other questions
    if(s.qs.some(q=>!POOL[q.p] || !Array.isArray(q.perm) || q.perm.length!==3)) { clearSaved(); return false; }
    const elapsed=Math.floor((Date.now()-(s.savedAt||Date.now()))/1000);
    exam={qs:s.qs, answers:s.answers, marked:s.marked, cur:s.cur||0, total:s.total, left:Math.max(0, s.left-elapsed), fb:true, timerId:null};
    view='exam';
    if(exam.left<=0){ exam.left=0; render(); finish(); return true; }
    exam.timerId=setInterval(tick, 1000);
    return true;
  }catch(e){ return false; }
}

/* ===== stratified random draw: every topic is represented, proportionally to the pool ===== */
function pickExam(){
  const byCat={}; POOL.forEach((p,i)=>{(byCat[p.c]=byCat[p.c]||[]).push(i);});
  const cats=Object.keys(byCat), total=POOL.length;
  const counts={}; let sum=0;
  cats.forEach(c=>{ counts[c]=Math.min(byCat[c].length, Math.max(CAT_MIN[c]||1, Math.round(EXAM_N*byCat[c].length/total))); sum+=counts[c]; });
  while(sum>EXAM_N){ const c=cats.reduce((a,b)=>counts[a]>=counts[b]?a:b); counts[c]--; sum--; }
  while(sum<EXAM_N){ const c=cats.filter(k=>counts[k]<byCat[k].length).reduce((a,b)=>counts[a]/byCat[a].length<=counts[b]/byCat[b].length?a:b); counts[c]++; sum++; }
  let picks=[]; cats.forEach(c=>{ picks=picks.concat(shuffled(byCat[c]).slice(0,counts[c])); });
  // enough concrete-case questions: swap within the same topic so the topic mix stays unchanged
  let nCase=picks.filter(i=>POOL[i].vars).length;
  const spare=shuffled(POOL.map((p,i)=>i).filter(i=>POOL[i].vars && !picks.includes(i)));
  for(const sp of spare){ if(nCase>=CASE_MIN) break; const k=picks.findIndex(i=>!POOL[i].vars && POOL[i].c===POOL[sp].c); if(k>=0){ picks[k]=sp; nCase++; } }
  return shuffled(picks);
}
function startExam(){
  clearSaved();
  if(exam && exam.timerId) clearInterval(exam.timerId);
  const picks = pickExam();
  exam = {
    qs: picks.map(p=>({p, perm: shuffled([0,1,2]), v: pickVar(p)})),
    answers: Array(EXAM_N).fill(null),
    marked: Array(EXAM_N).fill(false),
    cur: 0,
    total: EXAM_MIN*60,
    left: EXAM_MIN*60,
    fb: true,
    timerId: null
  };
  exam.timerId = setInterval(tick, 1000);
  view='exam'; render();
}

function tick(){
  if(!exam) return;
  exam.left--;
  if(exam.left<=0){
    clearInterval(exam.timerId);
    exam.left=0;
    showDialog(`<p>${T().timeUp}</p>`, [[T().ok, ()=>{closeDialog(); finish();}, true]]);
    return;
  }
  saveExam();
  const el=$('timelabel'), fill=$('timefill');
  if(el){ el.innerHTML = timeHTML(); el.classList.toggle('critical', exam.left<=CRITICAL_S); }
  if(fill){ fill.style.width = (exam.left/exam.total*100)+'%'; }
}
function timeHTML(){
  const m=Math.floor(exam.left/60), s=exam.left%60;
  return `${T().remaining}&nbsp;<b>${m}:${String(s).padStart(2,'0')}</b>`;
}

/* ===== answer row renderers ===== */
function answerRowPlain(text, sel, onclick){
  return `<div class="answer ${sel?'checked selected':''}" onclick="${onclick}">
    <span class="pcheck"></span>
    <span class="atext">${esc(text)}</span>
  </div>`;
}
function answerRowGraded(text, isC, sel, anim){
  let cls='answer'; if(sel) cls+=' checked selected';
  if(sel && anim) cls += isC ? ' flashgood' : ' flashbad';
  let ring=''; if(isC) ring='correct'; else if(sel) ring='incorrect';
  return `<div class="${cls}" style="cursor:default">
    <span class="${ring}"><span class="ring${ring&&anim?' anim':''}"><span class="pcheck"></span></span></span>
    <span class="atext">${esc(text)}</span>
  </div>`;
}

function renderExam(){
  const t=T(), e=exam, qq=e.qs[e.cur], P=POOL[qq.p], V=QV(qq), q=V[lang];
  const answeredCount = e.answers.filter(a=>a!==null).length;
  const markedCount = e.marked.filter(Boolean).length;
  const answered = e.answers[e.cur]!==null;
  const graded = e.fb && answered;
  $('app').innerHTML = `
    <div class="header justified">
      <div>
        <button class="pbtn" onclick="view='overview';render()">${IC.menu} <span>${t.overview}</span></button>
      </div>
      <div style="display:flex; align-items:center;">
        <div class="hstack">
          <div class="row questionBookmarked">${IC.bookmark}<span>${t.marked(markedCount)}</span></div>
          <div class="row questionAnswered">${IC.check}<span>${answeredCount} / ${EXAM_N}</span></div>
        </div>
        <div class="timewrap">
          <div class="cut-time">
            <div class="fill" id="timefill" style="width:${e.left/e.total*100}%"></div>
            <div class="label ${e.left<=CRITICAL_S?'critical':''}" id="timelabel">${timeHTML()}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="scrollpanel">
      <div class="examcontainer">
        <div class="self-center">
          <button class="navbtn back" onclick="nav(-1)" ${e.cur===0?'disabled':''}>${IC.chevL}</button>
        </div>
        <div class="exampage">
          <div class="content">
            <div class="title">
              <span class="titleText">${t.question} ${e.cur+1} ${t.of} ${EXAM_N}</span>
              <div class="flexspacer"></div>
              <button class="pbtn bookmarkbtn" onclick="toggleMark()">
                ${IC.bookmark} <span>${e.marked[e.cur]?t.removeBookmark:t.bookmark}</span>
              </button>
            </div>
            <div class="qcols">
              <div class="contentLeft">
                <span class="questionTitle">${esc(q.q)}</span>
              </div>
              <div class="contentRight">
                ${qq.perm.map(orig=>{
                  const sel = e.answers[e.cur]===orig;
                  if(!graded) return answerRowPlain(q.a[orig], sel, `choose(${orig})`);
                  return answerRowGraded(q.a[orig], orig===0, sel, e.justAnswered);
                }).join('')}
                ${graded && (V.x||P.x) ? `<div class="explain"><ul><li>${esc((V.x||P.x)[lang])}</li></ul></div>` : ''}
              </div>
            </div>
          </div>
        </div>
        <div class="self-center">
          <button class="navbtn forward" onclick="nav(1)" ${e.cur===EXAM_N-1?'disabled':''}>${IC.chevR}</button>
        </div>
      </div>
    </div>

    <div class="footer justified">
      <button class="pbtn" onclick="showHelp()">${IC.help} ${t.help}</button>
      <button class="pbtn" onclick="askFinish()">${IC.check} ${t.closeExam}</button>
      <span class="fgroup">${themeBtn()}<button class="pbtn" onclick="switchLangInline()">${IC.lang} ${lang==='en'?'English':'Italiano'}</button></span>
    </div>
    <div class="backdrop" id="dlgback"><div class="pdialog" id="dlg"></div></div>`;
}

let keepScroll=false;
// On small screens the explanation can end up below the visible area: scroll just enough to show the whole box
// (never so far that its first line leaves the screen).
function showExplain(){
  const sp=document.querySelector('.scrollpanel'), ex=document.querySelector('.contentRight .explain');
  if(!sp||!ex) return;
  const pr=sp.getBoundingClientRect(), er=ex.getBoundingClientRect();
  const over=er.bottom+12-pr.bottom;
  if(over>0) sp.scrollTop+=Math.max(0, Math.min(over, er.top-pr.top-8));
}
function choose(orig){
  if(exam.answers[exam.cur]!==null) return;   // locked after the first answer; the correct answer is shown immediately
  exam.answers[exam.cur] = orig;
  exam.justAnswered = true;
  saveExam();
  keepScroll=true; render();
  exam.justAnswered = false;
  showExplain();
}
function nav(d){
  exam.cur=Math.min(EXAM_N-1,Math.max(0,exam.cur+d));
  saveExam();
  render();
}
function toggleMark(){ exam.marked[exam.cur]=!exam.marked[exam.cur]; saveExam(); keepScroll=true; render(); }
function gotoQ(i){ exam.cur=i; view='exam'; saveExam(); render(); }
function switchLangInline(){ lang = lang==='en'?'it':'en'; localStorage.setItem('b121lang2',lang); render(); }

function renderOverview(){
  const t=T(), e=exam;
  const answeredCount=e.answers.filter(a=>a!==null).length;
  const markedCount=e.marked.filter(Boolean).length;
  $('app').innerHTML = `
    <div class="header justified">
      <div>
        <button class="pbtn" onclick="view='exam';render()">${IC.menu} <span>${t.closeOverview}</span></button>
      </div>
      <div class="hstack">
        <div class="row questionBookmarked">${IC.bookmark}<span>${t.marked(markedCount)}</span></div>
        <div class="row questionAnswered">${IC.check}<span>${t.answered(answeredCount)}</span></div>
      </div>
    </div>
    <div class="scrollpanel">
      <div class="ovwrap">
        ${e.qs.map((_,i)=>`
          <div class="list-item">
            <span class="flag ${e.marked[i]?'':'hiddenflag'}">${IC.flag}</span>
            <button class="pbtn ovbtn ${e.answers[i]!==null?'invert answered':''}" onclick="gotoQ(${i})">
              <span class="button-text">${i+1}</span>
            </button>
          </div>`).join('')}
      </div>
    </div>
    <div class="footer justified">
      <button class="pbtn" onclick="showHelp()">${IC.help} ${t.help}</button>
      <button class="pbtn" onclick="askFinish()">${IC.check} ${t.closeExam}</button>
      ${themeBtn()}
    </div>
    <div class="backdrop" id="dlgback"><div class="pdialog" id="dlg"></div></div>`;
}

/* ===== dialogs ===== */
function showDialog(html, buttons){
  const back=$('dlgback');
  if(!back) return;
  $('dlg').innerHTML = html + `<div class="dlgbuttons">${buttons.map((b,i)=>
    `<button class="pbtn ${b[2]?'invert':''}" id="dlgbtn${i}">${esc(b[0])}</button>`).join('')}</div>`;
  buttons.forEach((b,i)=>{ $('dlgbtn'+i).onclick=b[1]; });
  back.classList.add('open');
}
function closeDialog(){ const b=$('dlgback'); if(b) b.classList.remove('open'); }
function showHelp(){
  const t=T();
  showDialog(t.helpTexts.map(h=>`<p><b>${esc(h[0])}</b><br>${esc(h[1])}</p>`).join(''), [[t.ok, closeDialog, true]]);
}
function askFinish(){
  const t=T();
  const missing = exam.answers.some(a=>a===null);
  showDialog(`<p>${missing?t.confirmMissing:t.confirmAll}</p>`,
    [[t.doNotClose, closeDialog, false],[t.closeNow, ()=>{closeDialog();finish();}, true]]);
}

function finish(){
  clearInterval(exam.timerId);
  clearSaved();
  exam.usedS = exam.total - exam.left;
  view='result'; render();
  window.scrollTo(0,0);
}

function topicTable(items){ // items: [{p, ok}]
  const t=T(); const st={};
  items.forEach(it=>{ const c=POOL[it.p].c; st[c]=st[c]||{n:0,ok:0}; st[c].n++; if(it.ok) st[c].ok++; });
  return `<table class="cattable">${CATS.filter(c=>st[c]).map(c=>`<tr><td>${esc(catName(c))}</td><td><b>${st[c].ok} / ${st[c].n}</b></td></tr>`).join('')}</table>`;
}

function reviewBlock(qs, answers, marked){
  const t=T();
  return qs.map((qq,i)=>{
    const P=POOL[qq.p], V=QV(qq), q=V[lang], user=answers[i];
    return `<div>
      <div class="rquestion"><span class="qnum">${i+1}.</span> ${esc(q.q)} <span class="artref">${esc(artL(P.art))}</span> ${marked&&marked[i]?`<span class="rmarkedflag">⚑</span>`:''} ${user===null||user===undefined?`<span style="color:var(--error-color); font-weight:400; font-size:13px;">— ${t.notAnswered}</span>`:''}</div>
      ${qq.perm.map(orig=>answerRowGraded(q.a[orig], orig===0, user===orig, false)).join('')}
      ${(V.x||P.x)?`<div class="explain"><ul><li>${esc((V.x||P.x)[lang])}</li></ul></div>`:''}
    </div>`;
  }).join('');
}

function renderResult(){
  const t=T(), e=exam;
  const correct=e.answers.filter(a=>a===0).length;
  const mistakes=EXAM_N-correct;
  const pass=mistakes<=MAX_MISTAKES;
  const mm=Math.floor(e.usedS/60), ss=e.usedS%60;
  $('app').innerHTML = `
    <div class="header"></div>
    ${loginInfoBlock()}
    <div class="scrollpanel scrollpanel-noheader" style="top:80px;">
    <div class="resultpage">
      <h1>${t.examResult}</h1>
      <div class="verdict ${pass?'pass':'fail'}">${pass?t.passed:t.failed}</div>
      <div class="examtable">
        <table>
          <tr><td>${t.score}</td><td>${correct} / ${EXAM_N}</td></tr>
          <tr><td>${t.mistakes}</td><td>${mistakes} (max. ${MAX_MISTAKES})</td></tr>
          <tr><td>${t.time}</td><td>${mm}:${String(ss).padStart(2,'0')}</td></tr>
        </table>
      </div>
      <button class="pbtn invert" style="margin-top:26px;" onclick="startExam()">${t.newExam}</button>
      <button class="pbtn" style="margin-top:26px;" onclick="view='start';render()">${t.exit}</button>

      <div class="reviewwrap">
        <h2>${t.review}</h2><div style="font-size:13px; color:var(--night-rider); margin:8px 0 2px; line-height:1.6;">${t.legend}</div>
        ${reviewBlock(e.qs, e.answers, e.marked)}
      </div>
    </div>
    </div>
    <div class="footer justified">
      <span></span>
      <span class="fgroup">${themeBtn()}<button class="pbtn" onclick="switchLangInline()">${IC.lang} ${lang==='en'?'English':'Italiano'}</button></span>
    </div>`;
}

/* ================= TRAINING MODE ================= */
function startTrain(cat){
  const idx = POOL.map((p,i)=>i).filter(i=>!cat || POOL[i].c===cat);
  train = { cat, qs: shuffled(idx).map(p=>({p, perm: shuffled([0,1,2])})), answers: [], cur: 0 };
  train.answers = Array(train.qs.length).fill(null);
  view='train'; render(); window.scrollTo(0,0);
}
function trainChoose(orig){
  if(train.answers[train.cur]!==null) return;
  train.answers[train.cur]=orig; train.justAnswered=true; render(); train.justAnswered=false;
}
function trainNav(d){ train.cur=Math.min(train.qs.length-1, Math.max(0, train.cur+d)); render(); window.scrollTo(0,0); }
function renderTrain(){
  const t=T(), e=train, qq=e.qs[e.cur], P=POOL[qq.p], q=P[lang], N=e.qs.length;
  const done=e.answers.filter(a=>a!==null).length, ok=e.answers.filter(a=>a===0).length;
  const answered=e.answers[e.cur]!==null;
  $('app').innerHTML = `
    <div class="header justified">
      <div><button class="pbtn" onclick="view='start';render()">${IC.close} <span>${t.exit}</span></button></div>
      <div class="hstack">
        <div class="row" style="color:var(--night-rider)"><b>${t.training}:</b>&nbsp;${esc(e.cat?catName(e.cat):t.allTopics)}</div>
        <div class="row questionAnswered">${IC.check}<span>${ok} / ${done} ${t.correctLbl} · ${N} ${t.questionsLbl}</span></div>
      </div>
    </div>
    <div class="scrollpanel">
      <div class="examcontainer">
        <div class="self-center"><button class="navbtn back" onclick="trainNav(-1)" ${e.cur===0?'disabled':''}>${IC.chevL}</button></div>
        <div class="exampage"><div class="content">
          <div class="title">
            <span class="titleText">${t.question} ${e.cur+1} ${t.of} ${N}</span>
            <div class="flexspacer"></div>
            <span class="artref">${esc(catName(P.c))} · ${esc(P.art)}</span>
          </div>
          <div class="qcols">
            <div class="contentLeft"><span class="questionTitle">${esc(q.q)}</span><span class="qhint">${t.oneAnswer}</span></div>
            <div class="contentRight">
              ${qq.perm.map(orig=>{
                const sel=e.answers[e.cur]===orig;
                if(!answered) return answerRowPlain(q.a[orig], sel, `trainChoose(${orig})`);
                return answerRowGraded(q.a[orig], orig===0, sel, e.justAnswered);
              }).join('')}
              ${answered && P.x ? `<div class="explain"><ul><li>${esc(P.x[lang])}</li></ul></div>` : ''}
              ${answered ? `<div style="margin-top:14px;text-align:right"><button class="pbtn invert" onclick="${e.cur===N-1?'finishTrain()':'trainNav(1)'}">${e.cur===N-1?t.finishTraining:t.next} ${IC.chevR}</button></div>` : ''}
            </div>
          </div>
        </div></div>
        <div class="self-center"><button class="navbtn forward" onclick="trainNav(1)" ${e.cur===N-1?'disabled':''}>${IC.chevR}</button></div>
      </div>
    </div>
    <div class="footer justified">
      <button class="pbtn" onclick="finishTrain()">${IC.check} ${t.finishTraining}</button>
      <span class="fgroup">${themeBtn()}<button class="pbtn" onclick="switchLangInline()">${IC.lang} ${lang==='en'?'English':'Italiano'}</button></span>
    </div>`;
}
function finishTrain(){ view='trainresult'; render(); window.scrollTo(0,0); }
function renderTrainResult(){
  const t=T(), e=train;
  const done=e.qs.map((qq,i)=>({qq,i})).filter(x=>e.answers[x.i]!==null);
  const ok=done.filter(x=>e.answers[x.i]===0).length;
  const wrong=done.filter(x=>e.answers[x.i]!==0);
  $('app').innerHTML = `
    <div class="header"></div>
    ${loginInfoBlock()}
    <div class="scrollpanel scrollpanel-noheader" style="top:80px;">
    <div class="resultpage">
      <h1>${t.trainingResult}</h1>
      <div class="verdict ${wrong.length===0?'pass':''}">${ok} / ${done.length}</div>
      <div class="examtable"><table>
        <tr><td>${t.correctCount}</td><td>${ok}</td></tr>
        <tr><td>${t.wrongCount}</td><td>${wrong.length}</td></tr>
        <tr><td>${t.byTopic}</td><td>${topicTable(done.map(x=>({p:x.qq.p, ok:e.answers[x.i]===0})))}</td></tr>
      </table></div>
      <button class="pbtn invert" style="margin-top:26px;" onclick="startTrain(${e.cat?`'${e.cat}'`:'null'})">${t.restart}</button>
      <button class="pbtn" style="margin-top:26px;" onclick="view='start';render()">${t.exit}</button>
      ${wrong.length?`<div class="reviewwrap"><h2>${t.wrongCount}</h2>${reviewBlock(wrong.map(x=>x.qq), wrong.map(x=>e.answers[x.i]), null)}</div>`:''}
    </div>
    </div>
    <div class="footer justified">
      <span></span>
      <span class="fgroup">${themeBtn()}<button class="pbtn" onclick="switchLangInline()">${IC.lang} ${lang==='en'?'English':'Italiano'}</button></span>
    </div>`;
}

/* ================= RENDER ROOT ================= */
function render(){
  const sp=document.querySelector('.scrollpanel'); const st=(keepScroll&&sp)?sp.scrollTop:0; keepScroll=false;
  if(view==='lang') renderLang();
  else if(view==='start') renderStart();
  else if(view==='exam') renderExam();
  else if(view==='overview') renderOverview();
  else if(view==='result') renderResult();
  else if(view==='train') renderTrain();
  else if(view==='trainresult') renderTrainResult();
  const sp2=document.querySelector('.scrollpanel'); if(sp2) sp2.scrollTop=st;
  if(view==='exam'||view==='train') showExplain();   // an answered question always opens with its explanation in view
}
applyTheme();
if(lang) resumeExam();
render();
</script>
