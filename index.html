{"c":"C","art":"Art. 16 cpv. 8","it":{"q":"Entro quando il conducente deve consegnare al datore di lavoro i dischi usati?","a":["Al più tardi il primo giorno di lavoro della settimana successiva; dall'estero, al ritorno","Al più tardi alla fine della giornata in cui sono stati usati; dall'estero, al ritorno","Al più tardi il primo giorno di lavoro del mese successivo, ordinati per veicolo"]},"en":{"q":"By when must the driver hand the used sheets to the employer?","a":["At the latest on the first working day of the following week; after trips abroad, on return","At the latest at the end of the day they were used; after trips abroad, on return","At the latest on the first working day of the following month, sorted by vehicle"]},"x":{"it":"I dischi usati si consegnano al datore di lavoro al più tardi il primo giorno di lavoro della settimana successiva; chi è all'estero li consegna al ritorno. Non serve farlo ogni sera.","en":"Used sheets are handed to the employer at the latest on the first working day of the following week; anyone abroad hands them in on return. It does not have to be done every evening."},"src":"add39"},
{"c":"C","art":"Art. 15 cpv. 3","it":{"q":"Quante volte al giorno il conducente può aprire il tachigrafo durante la corsa per controllarne il funzionamento?","a":["Al massimo una volta al giorno","Al massimo due volte al giorno","Tutte le volte che lo ritiene necessario"]},"en":{"q":"How many times a day may the driver open the tachograph during the trip to check that it is working?","a":["At most once a day","At most twice a day","As often as they consider necessary"]},"x":{"it":"Durante la corsa il tachigrafo deve registrare senza interruzioni. Per questo il conducente può aprirlo solo una volta al giorno per controllare che funzioni.","en":"During a trip the tachograph must record without interruption. That is why the driver may open it only once a day to check that it is working."},"src":"add41"},
{"c":"C","art":"Art. 15 cpv. 1","it":{"q":"Un tassista fa una pausa di 10 minuti al bar lasciando il selettore del tachigrafo su «guida». Cosa viene registrato?","a":["Tempo di lavoro, perché con il veicolo fermo l'apparecchio registra «altri lavori»","Una pausa, perché il veicolo è fermo e il tachigrafo lo riconosce","Nulla, perché senza movimento il tachigrafo non registra"]},"en":{"q":"A taxi driver takes a 10-minute coffee break leaving the tachograph selector on “driving”. What is recorded?","a":["Working time, because with the vehicle stationary the device records “other work”","A break, because the vehicle is stationary and the tachograph recognises it","Nothing, because without movement the tachograph does not record"]},"x":{"it":"Il tachigrafo non «capisce» da solo che sei in pausa. Se il selettore resta su guida e il veicolo è fermo, registra «altri lavori», cioè tempo di lavoro. Per la pausa devi scegliere tu la posizione «Pausa».","en":"The tachograph cannot tell by itself that you are on a break. If the selector stays on driving and the vehicle is stationary, it records “other work”, i.e. working time. For a break you must select the “Break” position yourself."},"src":"add42"},
{"c":"C","art":"OLR 1 art. 14a cpv. 2","it":{"q":"Il conducente è lontano dal veicolo e non può azionare il tachigrafo. Cosa deve fare con i tempi di quel periodo?","a":["Annotarli a mano sul disco, in modo leggibile, man mano che prosegue l'attività","Annotarli nel registro del datore di lavoro alla fine del mese","Non annotarli: conta solo ciò che il tachigrafo registra"]},"en":{"q":"The driver is away from the vehicle and cannot operate the tachograph. What must they do with the times of that period?","a":["Enter them by hand on the sheet, legibly and as the activity goes on","Enter them in the employer's register at the end of the month","Not enter them: only what the tachograph records counts"]},"x":{"it":"Quando sei lontano dal veicolo il tachigrafo non può registrare per te. Quei tempi li annoti tu a mano sul disco, in modo leggibile, senza aspettare la fine del mese.","en":"When you are away from the vehicle the tachograph cannot record for you. You note those times by hand on the sheet, legibly, without waiting until the end of the month."},"src":"add43"},
{"c":"C","art":"Art. 18 cpv. 4","it":{"q":"Si può circolare con il taxi mentre il tachigrafo è guasto?","a":["Sì, compilando i fogli quotidiani del libretto di lavoro finché non è riparato","Sì, avvisando la polizia e compilando il foglio settimanale finché non è riparato","No, il taxi deve restare fermo finché il tachigrafo non è stato riparato"]},"en":{"q":"May the taxi be driven while the tachograph is broken?","a":["Yes, filling in the daily sheets of the work record book until it is repaired","Yes, informing the police and filling in the weekly sheet until it is repaired","No, the taxi must stay off the road until the tachograph has been repaired"]},"x":{"it":"Un tachigrafo guasto non ferma il taxi. Si può continuare a circolare, ma i tempi vanno registrati a mano nei fogli quotidiani del libretto di lavoro finché l'apparecchio non è riparato.","en":"A broken tachograph does not take the taxi off the road. You may keep driving, but the times must be recorded by hand in the daily sheets of the work record book until the device is repaired."},"src":"add47"},
{"c":"C","art":"Art. 17 cpv. 4","it":{"q":"Una persona non prevista come conducente deve guidare all'improvviso un taxi, senza avere un libretto di lavoro. Cosa deve fare?","a":["Annunciarlo subito all'autorità d'esecuzione e compilare in seguito il libretto di lavoro","Annunciarlo al datore di lavoro e guidare senza registrare nulla fino a fine giornata","Rifiutare di guidare finché non ha ricevuto un libretto di lavoro dall'autorità"]},"en":{"q":"Someone who was not planned as a driver suddenly has to drive a taxi and has no work record book. What must they do?","a":["Report it immediately to the enforcement authority and fill in the work record book afterwards","Report it to the employer and drive without recording anything until the end of the day","Refuse to drive until they have received a work record book from the authority"]},"x":{"it":"In un caso imprevisto si può guidare anche senza libretto di lavoro, ma bisogna annunciarlo subito all'autorità d'esecuzione e compilare il libretto in seguito. Guidare senza registrare nulla non è ammesso.","en":"In an unforeseen case you may drive even without a work record book, but you must report it to the enforcement authority straight away and fill in the book afterwards. Driving without recording anything is not allowed."},"src":"add52"},
{"c":"C","art":"Art. 17 cpv. 5","it":{"q":"Chi procura il libretto di lavoro e chi lo consegna al conducente dipendente?","a":["Il datore di lavoro lo procura presso l'autorità e lo consegna gratuitamente al conducente","Il datore di lavoro lo procura presso l'autorità e lo vende al conducente al prezzo di costo","Il conducente lo acquista direttamente presso l'USTRA a proprie spese"]},"en":{"q":"Who obtains the work record book and who hands it to the employed driver?","a":["The employer obtains it from the authority and hands it to the driver free of charge","The employer obtains it from the authority and sells it to the driver at cost price","The driver buys it directly from the Federal Roads Office at their own expense"]},"x":{"it":"Il libretto di lavoro non costa nulla al dipendente: il datore di lavoro lo ritira presso l'autorità d'esecuzione e glielo consegna gratuitamente.","en":"The work record book costs the employee nothing: the employer collects it from the enforcement authority and hands it over free of charge."},"src":"add53"},
{"c":"C","art":"Art. 18 cpv. 1","it":{"q":"Appena ricevuto il libretto di lavoro, cosa deve compilare subito il conducente?","a":["La prima pagina della copertina","Il primo foglio quotidiano","Il primo foglio settimanale"]},"en":{"q":"As soon as the driver receives the work record book, what must they fill in immediately?","a":["The first page of the cover","The first daily sheet","The first weekly sheet"]},"x":{"it":"Per prima cosa si compila la prima pagina della copertina con i propri dati, così il libretto è subito attribuito a un conducente. I fogli quotidiani e settimanali si compilano dopo, lavorando.","en":"The first thing to fill in is the first page of the cover with your details, so the book is tied to one driver from the start. The daily and weekly sheets are filled in later, as you work."},"src":"add54"},
{"c":"C","art":"Art. 18 cpv. 2","it":{"q":"Se il tachigrafo funziona correttamente, cosa deve iscrivere il conducente nel libretto di lavoro?","a":["Soltanto il foglio settimanale: riposo precedente, inizio e fine del lavoro, numero di targa","Il foglio settimanale e il foglio quotidiano con il grafico di tutte le attività","Nulla: il disco del tachigrafo sostituisce completamente il libretto di lavoro"]},"en":{"q":"If the tachograph works correctly, what must the driver enter in the work record book?","a":["Only the weekly sheet: previous rest, start and end of work, registration number","The weekly sheet and the daily sheet with the graph of all activities","Nothing: the tachograph sheet completely replaces the work record book"]},"x":{"it":"Se il tachigrafo funziona, i tempi della giornata li registra lui. Il conducente compila solo il foglio settimanale (riposo precedente, inizio e fine del lavoro, targa); il foglio quotidiano serve solo se il tachigrafo è guasto.","en":"If the tachograph is working, it records the day's times. The driver fills in only the weekly sheet (previous rest, start and end of work, registration number); the daily sheet is needed only if the tachograph is broken."},"src":"add55"},
{"c":"C","art":"Art. 18 cpv. 8","it":{"q":"Quando il libretto di lavoro deve essere restituito al datore di lavoro?","a":["Quando tutti i fogli sono riempiti o quando termina il rapporto di lavoro","Alla fine di ogni mese di lavoro, anche se non è ancora pieno","Alla fine di ogni anno civile, anche se non è ancora pieno"]},"en":{"q":"When must the work record book be returned to the employer?","a":["When all sheets are filled or when the employment relationship ends","At the end of every working month, even if it is not yet full","At the end of every calendar year, even if it is not yet full"]},"x":{"it":"Il libretto torna al datore di lavoro quando è pieno o quando finisce il rapporto di lavoro, perché deve essere conservato in azienda. Non c'è una scadenza mensile o annuale.","en":"The book goes back to the employer when it is full or when the employment ends, because it has to be kept at the business. There is no monthly or yearly deadline."},"src":"add56"},
{"c":"C","art":"Art. 19 cpv. 3","it":{"q":"Un conducente lavora secondo un orario quotidiano invariabile. Può essere dispensato dai fogli quotidiani e settimanali?","a":["Sì, per un anno; la dispensa non è prorogata se ha fatto più di 20 corse fuori orario","Sì, per cinque anni; la dispensa è sempre prorogata automaticamente","No, la dispensa è possibile solo con i rapporti giornalieri interni all'azienda"]},"en":{"q":"A driver works according to an unchanging daily schedule. Can they be exempted from the daily and weekly sheets?","a":["Yes, for one year; no renewal if they made more than 20 trips outside the schedule","Yes, for five years; it is always renewed automatically, without any check","No, an exemption is possible only where company-internal daily reports are kept"]},"x":{"it":"Chi ha un orario sempre uguale può essere dispensato dai fogli, ma solo per un anno alla volta. La dispensa non viene rinnovata se nell'anno ha fatto più di 20 corse fuori dall'orario.","en":"Someone whose schedule is always the same can be exempted from the sheets, but only for one year at a time. The exemption is not renewed if they made more than 20 trips outside the schedule during the year."},"src":"add57"},
{"c":"C","art":"Art. 19 cpv. 6","it":{"q":"La dispensa dalla compilazione del libretto di lavoro vale anche all'estero?","a":["No, è valevole soltanto in Svizzera; all'estero il libretto va sempre compilato","Sì, è valevole anche all'estero, purché il conducente la porti con sé","Sì, ma soltanto nei Paesi dell'Unione europea"]},"en":{"q":"Is the exemption from filling in the work record book also valid abroad?","a":["No, it is valid only in Switzerland; abroad the book must always be filled in","Yes, it is also valid abroad, provided the driver carries it","Yes, but only in the countries of the European Union"]},"x":{"it":"La dispensa è una decisione di un'autorità svizzera e vale solo in Svizzera. Appena si va all'estero, il libretto di lavoro va compilato normalmente.","en":"The exemption is a decision by a Swiss authority and is valid only in Switzerland. As soon as you go abroad, the work record book must be filled in as normal."},"src":"add58"},
{"c":"C","art":"Art. 19 cpv. 6","it":{"q":"Un conducente dispensato dalla compilazione del libretto di lavoro effettua una corsa all'estero. Deve compilare il libretto?","a":["Sì, occorresse compilarlo sempre","No, la dispensa vale anche all'estero","No, basta portare con sé la dispensa"]},"en":{"q":"A driver exempted from filling in the work record book makes a trip abroad. Must they fill in the book?","a":["Yes, abroad it must always be filled in","No, the exemption is also valid abroad","No, carrying the exemption is enough"]},"x":{"it":"La dispensa vale solo in Svizzera. All'estero il libretto di lavoro va sempre compilato, anche se si porta con sé la dispensa. «Occorresse» viene da «occorrere»: essere necessario.","en":"The exemption is valid only in Switzerland. Abroad the work record book must always be filled in, even if you carry the exemption. Italian “occorresse” comes from “occorrere”: to be necessary."},"src":"add137"},
{"c":"C","art":"Art. 19 cpv. 2 e 4","it":{"q":"Cosa deve portare con sé un conducente che ha ottenuto una dispensa?","a":["La decisione di dispensa e, se del caso, i rapporti giornalieri della settimana in corso","Soltanto la licenza di condurre con il codice 121; la dispensa è registrata dall'autorità","Nulla di particolare: decisione e rapporti giornalieri restano presso l'azienda"]},"en":{"q":"What must a driver who has obtained an exemption carry with them?","a":["The exemption decision and, where applicable, the daily reports of the current week","Only the driving licence with code 121; the exemption is registered by the authority","Nothing in particular: decision and daily reports stay at the business premises"]},"x":{"it":"Al controllo devi poter provare la dispensa: porti con te la decisione e, se la dispensa si basa sui rapporti giornalieri dell'azienda, anche quelli della settimana in corso.","en":"At a check you must be able to prove the exemption: you carry the decision and, if it is based on the business's daily reports, also those of the current week."},"src":"add59"},
{"c":"C","art":"Art. 21 cpv. 2","it":{"q":"Un lavoratore guida chiaramente meno di 7 ore al giorno. Il datore di lavoro deve iscrivere la durata della guida nel registro?","a":["No, basta includerla nella durata totale del lavoro quotidiano","Sì, la durata della guida va sempre iscritta separatamente","Solo se la guida è inferiore a 5 ore al giorno"]},"en":{"q":"An employee clearly drives less than 7 hours a day. Must the employer enter the driving time in the register?","a":["No, it is enough to include it in the total daily working time","Yes, driving time must always be entered separately","Only if they drive less than 5 hours a day"]},"x":{"it":"Se è evidente che il lavoratore guida meno di 7 ore al giorno, il limite di 9 ore non è in pericolo. Allora la guida non va scritta a parte: basta includerla nel tempo di lavoro totale del giorno.","en":"If it is clear that the employee drives less than 7 hours a day, the 9-hour limit is not at risk. Then driving need not be entered separately: it is enough to include it in the day's total working time."},"src":"add60"},
{"c":"C","art":"Art. 21 cpv. 5","it":{"q":"Entro quando il registro del datore di lavoro deve contenere tutte le iscrizioni?","a":["Al più tardi alla fine del mese, per il penultimo mese","Al più tardi alla fine del mese, per il mese in corso","Al più tardi alla fine dell'anno, per l'anno precedente"]},"en":{"q":"By when must the employer's register contain all entries?","a":["At the latest by the end of the month, for the month before last","At the latest by the end of the month, for the current month","At the latest by the end of the year, for the previous year"]},"x":{"it":"Il datore di lavoro ha un po' di margine: alla fine di ogni mese il registro deve essere completo fino al penultimo mese. Per esempio, a fine marzo devono esserci tutte le iscrizioni di gennaio.","en":"The employer has some leeway: at the end of each month the register must be complete up to the month before last. For example, at the end of March all the January entries must be there."},"src":"add61"},
{"c":"C","art":"Art. 21 cpv. 6","it":{"q":"Il datore di lavoro fa tenere il registro da una fiduciaria. Chi risponde dell'esattezza delle iscrizioni?","a":["Il datore di lavoro","La fiduciaria incaricata","Il conducente"]},"en":{"q":"The employer has an outside accounting firm keep the register. Who is responsible for the accuracy of the entries?","a":["The employer","The accounting firm","The driver"]},"x":{"it":"Il datore di lavoro può far tenere il registro da qualcun altro, ma la responsabilità resta sua: se le iscrizioni sono sbagliate, ne risponde lui.","en":"The employer may have someone else keep the register, but the responsibility stays with them: if the entries are wrong, the employer answers for it."},"src":"add62"},
{"c":"C","art":"Art. 22 cpv. 3-4","it":{"q":"Cosa deve mettere a disposizione del conducente il datore di lavoro?","a":["Il libretto di lavoro e le chiavi e i dischi necessari all'uso del tachigrafo","Il libretto di lavoro e un tachigrafo di riserva per i casi di guasto","Le chiavi e i dischi del tachigrafo; il libretto di lavoro lo compra il conducente"]},"en":{"q":"What must the employer make available to the driver?","a":["The work record book and the keys and sheets needed to use the tachograph","The work record book and a spare tachograph for cases of breakdown","The tachograph keys and sheets; the driver buys the work record book"]},"x":{"it":"Il datore di lavoro deve fornire al conducente tutto ciò che serve per registrare i tempi: il libretto di lavoro, le chiavi del tachigrafo e i dischi. Il conducente non deve comprarli.","en":"The employer must give the driver everything needed to record the times: the work record book, the tachograph keys and the sheets. The driver does not have to buy them."},"src":"add63"},
{"c":"C","art":"Art. 23 cpv. 1-2","it":{"q":"L'autorità d'esecuzione chiede informazioni e vuole accedere all'azienda per un controllo. Il datore di lavoro può rifiutare?","a":["No, deve fornire tutte le informazioni necessarie e permettere l'accesso all'azienda","Sì, se l'autorità non presenta un mandato scritto del giudice per l'accesso all'azienda","Sì, se i conducenti dell'azienda sono tutti indipendenti e tengono il proprio registro"]},"en":{"q":"The enforcement authority asks for information and wants access to the business for a check. May the employer refuse?","a":["No, they must provide all necessary information and allow access to the business","Yes, if the authority does not present a written court warrant for access to the business","Yes, if all the drivers of the business are self-employed and keep their own register"]},"x":{"it":"Il datore di lavoro è obbligato a collaborare ai controlli: deve dare all'autorità tutte le informazioni necessarie e lasciarla entrare in azienda. Non serve un mandato del giudice.","en":"The employer is obliged to cooperate with checks: they must give the authority all necessary information and let it enter the business. No court warrant is needed."},"src":"add64"},
{"c":"C","art":"Art. 28 cpv. 4","it":{"q":"Un datore di lavoro induce un conducente a violare l'OLR 2, oppure non lo impedisce pur potendolo. Quale pena rischia?","a":["La stessa pena prevista per il conducente","Nessuna pena: risponde soltanto il conducente","Una pena più lieve di quella del conducente"]},"en":{"q":"An employer induces a driver to violate the OLR 2, or fails to prevent it although they could. What penalty do they risk?","a":["The same penalty as the driver","No penalty: only the driver is liable","A lighter penalty than the driver's"]},"x":{"it":"Chi spinge un conducente a violare le regole, o non lo impedisce pur potendo, è responsabile quanto lui e riceve la stessa pena. Per il lavoratore il giudice può invece ridurre la pena.","en":"Anyone who pushes a driver to break the rules, or fails to prevent it when they could, is as responsible as the driver and gets the same penalty. For the employee, by contrast, the judge may reduce the penalty."},"src":"add65"},
{"c":"C","art":"Art. 29-32","it":{"q":"Chi è competente per il perseguimento penale delle violazioni dell'OLR 2 e chi vigila sull'applicazione dell'ordinanza?","a":["I Cantoni perseguono le violazioni; l'USTRA esercita la sovrintendenza","L'USTRA persegue le violazioni; i Cantoni esercitano la sovrintendenza","I Comuni perseguono le violazioni; il DATEC esercita la sovrintendenza"]},"en":{"q":"Who prosecutes OLR 2 violations and who supervises the enforcement of the ordinance?","a":["The cantons prosecute violations; the Federal Roads Office supervises","The Federal Roads Office prosecutes violations; the cantons supervise","The municipalities prosecute violations; DETEC supervises"]},"x":{"it":"I Cantoni fanno i controlli e perseguono le violazioni. L'USTRA (Ufficio federale delle strade) esercita la sovrintendenza, cioè sorveglia dall'alto come viene applicata l'ordinanza.","en":"The cantons carry out the checks and prosecute violations. The Federal Roads Office supervises, meaning it oversees from above how the ordinance is applied."},"src":"add66"},
{"c":"P","art":"Art. 3 cpv. 2","it":{"q":"Esegui un trasporto all'estero con un taxi immatricolato in Svizzera che ha al massimo 8 posti oltre al conducente. Quale ordinanza vale per te?","a":["L'OLR 2, se gli accordi internazionali ratificati dalla Svizzera non sono più severi","L'OLR 1, se gli accordi internazionali ratificati dalla Svizzera non sono più severi","Soltanto gli accordi internazionali ratificati dalla Svizzera, mai un'ordinanza svizzera"]},"en":{"q":"You carry out a trip abroad with a Swiss-registered taxi that has at most 8 seats besides the driver. Which ordinance applies to you?","a":["The OLR 2, unless international agreements ratified by Switzerland are stricter","The OLR 1, unless international agreements ratified by Switzerland are stricter","Only the international agreements ratified by Switzerland, never a Swiss ordinance"]},"x":{"it":"Con al massimo 8 posti oltre al conducente l'OLR 2 ti segue anche all'estero. Solo se un accordo internazionale ratificato dalla Svizzera è più severo, vale quello.","en":"With at most 8 seats besides the driver, OLR 2 follows you abroad too. Only if an international agreement ratified by Switzerland is stricter does that apply instead."},"src":"add74"},
{"c":"C","art":"Art. 22 cpv. 3","it":{"q":"Il tachigrafo del taxi è difettoso. Il conducente può ripararlo da sé?","a":["No, non è consentito; deve annunciare il difetto al datore di lavoro al più presto possibile","Sì, se è stato istruito a questi lavori e annuncia la riparazione al datore di lavoro","Sì, in ogni caso, purché il tachigrafo torni a funzionare entro la giornata"]},"en":{"q":"The taxi's tachograph is defective. May the driver repair it themselves?","a":["No, it is not allowed; they must report the defect to the employer as soon as possible","Yes, if they have been trained for this work and report the repair to the employer","Yes, in any case, provided the tachograph works again by the end of the day"]},"x":{"it":"Il tachigrafo è sigillato e può essere riparato solo da un'officina autorizzata. Il conducente non lo tocca: segnala il difetto al datore di lavoro il più presto possibile.","en":"The tachograph is sealed and may be repaired only by an authorised workshop. The driver does not touch it: they report the defect to the employer as soon as possible."},"src":"add75"},
{"c":"O","art":"Art. 11 cpv. 1","it":{"q":"Come deve collocarsi il riposo quotidiano rispetto al giorno di riposo settimanale di un lavoratore?","a":["Deve precedere o seguire immediatamente il giorno di riposo settimanale","Deve sempre precedere immediatamente il giorno di riposo settimanale","Deve sempre seguire immediatamente il giorno di riposo settimanale"]},"en":{"q":"How must the daily rest be placed in relation to an employee's weekly rest day?","a":["It must immediately precede or follow the weekly rest day","It must always immediately precede the weekly rest day","It must always immediately follow the weekly rest day"]},"x":{"it":"Il riposo quotidiano va attaccato al giorno di riposo, ma può stare sia prima sia dopo. Così il lavoratore ha almeno 24 + 11 = 35 ore libere di seguito (33 con il riposo ridotto).","en":"The daily rest must be attached to the rest day, but it can come either before or after. That gives the employee at least 24 + 11 = 35 hours off in a row (33 with reduced rest)."},"src":"add76"},
{"c":"T","art":"Art. 2 cpv. 2 lett. c","it":{"q":"Chi è considerato «lavoratore» secondo l'OLR 2?","a":["Chi non è conducente indipendente, in particolare chi guida al servizio di un datore di lavoro","Chi è conducente indipendente, in particolare chi guida un veicolo di sua proprietà","Chi non è conducente indipendente e guida per meno di 48 ore alla settimana"]},"en":{"q":"Who is considered an “employee” under the OLR 2?","a":["Anyone who is not a self-employed driver, in particular anyone driving in an employer's service","Anyone who is a self-employed driver, in particular anyone driving a vehicle they own","Anyone who is not a self-employed driver and drives less than 48 hours a week"]},"x":{"it":"Lavoratore è semplicemente chi non è indipendente, in pratica chi guida per conto di un datore di lavoro. Il numero di ore lavorate non c'entra.","en":"An employee is simply anyone who is not self-employed, in practice someone who drives for an employer. The number of hours worked has nothing to do with it."},"src":"add77"},
{"c":"O","art":"Art. 7 cpv. 2","it":{"q":"Qual è il tempo di guida settimanale massimo per un tassista indipendente?","a":["45 ore, come per ogni conducente","53 ore, come il tempo di lavoro nelle imprese di tassì","Non è regolato, come il suo tempo di lavoro"]},"en":{"q":"What is the maximum weekly driving time for a self-employed taxi driver?","a":["45 hours, as for every driver","53 hours, like the working time in taxi businesses","It is not regulated, like their working time"]},"x":{"it":"Il limite di guida di 45 ore a settimana vale per tutti, anche per l'indipendente. Per lui non è limitato solo il tempo di LAVORO; le 53 ore riguardano il lavoro dei dipendenti.","en":"The driving limit of 45 hours a week applies to everyone, including the self-employed. For them only WORKING time is unlimited; the 53 hours concern employees' working time."},"src":"add78"},
{"c":"T","art":"Art. 2 cpv. 2 lett. a","it":{"q":"Chi è considerato «conducente» ai sensi dell'OLR 2?","a":["Chiunque guidi un veicolo di cui all'art. 3, anche soltanto per breve tempo","Chiunque guidi un veicolo di cui all'art. 3 per almeno un'ora al giorno","Chiunque guidi un veicolo di cui all'art. 3 e sia titolare di un libretto di lavoro"]},"en":{"q":"Who is considered a “driver” within the meaning of the OLR 2?","a":["Anyone who drives a vehicle under Art. 3, even only for a short time","Anyone who drives a vehicle under Art. 3 for at least one hour a day","Anyone who drives a vehicle under Art. 3 and holds a work record book"]},"x":{"it":"Conducente è chiunque guidi uno di questi veicoli, anche solo per pochi minuti. Non serve un numero minimo di ore, né avere già un libretto di lavoro.","en":"A driver is anyone who drives one of these vehicles, even for just a few minutes. No minimum number of hours is needed, nor already having a work record book."},"src":"add79"},
{"c":"O","art":"Art. 6 cpv. 3","it":{"q":"Datore di lavoro e lavoratore concordano un termine più lungo per compensare lo straordinario. Qual è il limite massimo?","a":["12 mesi: il termine convenuto non può in nessun caso superare un anno","6 mesi: il termine convenuto non può in nessun caso superare mezzo anno","Nessun limite: datore di lavoro e lavoratore possono convenire qualsiasi termine"]},"en":{"q":"Employer and employee agree a longer period to compensate overtime. What is the maximum limit?","a":["12 months: the agreed period may in no case exceed one year","6 months: the agreed period may in no case exceed half a year","No limit: employer and employee may agree any period"]},"x":{"it":"Di regola lo straordinario si compensa entro 3 mesi. Datore di lavoro e lavoratore possono concordare un termine più lungo, ma mai oltre 12 mesi.","en":"As a rule overtime is compensated within 3 months. Employer and employee may agree on a longer period, but never more than 12 months."},"src":"add80"},
{"c":"C","art":"Art. 14","it":{"q":"Su quali mezzi di controllo ci si basa per verificare il rispetto della durata del lavoro, della guida e del riposo?","a":["Registrazioni del tachigrafo, iscrizioni nel libretto di lavoro e registro del datore di lavoro","Registrazioni del tassametro, iscrizioni nel contratto di lavoro e registro del datore di lavoro","Registrazioni del tachigrafo, ricevute rilasciate ai clienti ed elenco dei conducenti"]},"en":{"q":"Which control documents are used to check compliance with working, driving and rest times?","a":["Tachograph records, entries in the work record book and the employer's register","Taximeter records, entries in the employment contract and the employer's register","Tachograph records, receipts issued to customers and the list of drivers"]},"x":{"it":"I tre mezzi di controllo sono: ciò che registra il tachigrafo, ciò che il conducente scrive nel libretto di lavoro e il registro tenuto dal datore di lavoro. Tassametro, contratti e ricevute non lo sono.","en":"The three means of control are: what the tachograph records, what the driver writes in the work record book, and the register kept by the employer. Taximeters, contracts and receipts are not."},"src":"add81"},
{"c":"C","art":"Art. 19 cpv. 1","it":{"q":"Per quanto tempo è valida la dispensa dal foglio settimanale concessa a chi tiene rapporti giornalieri interni all'azienda?","a":["Due anni, a nome del conducente; prorogabile se i rapporti garantiscono un controllo ineccepibile","Un anno, a nome del conducente; prorogabile se i rapporti garantiscono un controllo ineccepibile","Cinque anni, a nome dell'azienda; vale automaticamente per tutti i conducenti"]},"en":{"q":"How long is the exemption from the weekly sheet valid for drivers who keep company-internal daily reports?","a":["Two years, in the driver's name; renewable if the reports allow proper checks","One year, in the driver's name; renewable if the reports allow proper checks","Five years, in the business's name; it applies automatically to all drivers"]},"x":{"it":"La dispensa per chi usa i rapporti giornalieri dell'azienda vale 2 anni ed è intestata al singolo conducente. Quella di 1 anno riguarda invece chi ha un orario sempre uguale.","en":"The exemption for those using the business's daily reports is valid for 2 years and is made out to the individual driver. The 1-year one is for those whose schedule is always the same."},"src":"add82"},
{"c":"C","art":"Art. 21 cpv. 3","it":{"q":"Cosa deve contenere il registro per i conducenti indipendenti?","a":["Basta la durata giornaliera della guida e il riposo settimanale","Tutte le indicazioni previste per i lavoratori, compresi straordinari e semigiornate","Nulla: i conducenti indipendenti non devono tenere alcun registro"]},"en":{"q":"What must the register contain for self-employed drivers?","a":["The daily driving time and the weekly rest are enough","All the information required for employees, including overtime and half-days","Nothing: self-employed drivers do not have to keep any register"]},"x":{"it":"Per l'indipendente l'OLR 2 limita solo guida e riposo, non il lavoro. Nel registro bastano quindi la guida giornaliera e il riposo settimanale; straordinari e semigiornate riguardano solo i lavoratori.","en":"For the self-employed, OLR 2 limits only driving and rest, not work. So the register needs only the daily driving time and the weekly rest; overtime and half-days concern employees only."},"src":"add83"},
{"c":"C","art":"Art. 22 cpv. 4","it":{"q":"Quale elenco deve tenere il datore di lavoro riguardo ai conducenti?","a":["Un elenco con nome, indirizzo, data di nascita e numero del libretto di lavoro di ogni conducente","Un elenco con nome, salario, ore straordinarie e multe ricevute di ogni conducente","Un elenco con targa, chilometraggio e incassi del veicolo di ogni conducente"]},"en":{"q":"Which list must the employer keep regarding the drivers?","a":["A list with the name, address, date of birth and work record book number of each driver","A list with the name, wage, overtime hours and fines received of each driver","A list with the registration number, mileage and takings of each driver's vehicle"]},"x":{"it":"L'elenco serve all'autorità per sapere chi guida per l'azienda e con quale libretto: nome, indirizzo, data di nascita e numero del libretto di lavoro. Salari, multe e incassi non ci vanno.","en":"The list lets the authority know who drives for the business and with which book: name, address, date of birth and work record book number. Wages, fines and takings do not belong in it."},"src":"add84"},
{"c":"C","art":"Art. 28 cpv. 2","it":{"q":"Chi non mantiene il tachigrafo in funzione o fa iscrizioni inveritiere nel libretto di lavoro è punito...","a":["Con la multa, come per ogni violazione delle disposizioni sul controllo","Con un semplice avvertimento scritto dell'autorità d'esecuzione","Con la revoca automatica dell'autorizzazione al trasporto professionale"]},"en":{"q":"Anyone who does not keep the tachograph running or makes untrue entries in the work record book is punished...","a":["With a fine, as for any violation of the control provisions","With a simple written warning from the enforcement authority","With automatic withdrawal of the professional transport authorisation"]},"x":{"it":"Spegnere il tachigrafo o scrivere dati falsi nel libretto è una violazione delle regole sul controllo ed è punita con la multa. Non basta un avvertimento, ma non c'è nemmeno una revoca automatica.","en":"Switching off the tachograph or writing false data in the book is a breach of the control rules and is punished with a fine. A warning is not enough, but there is no automatic withdrawal either."},"src":"add85"},
{"c":"O","art":"Art. 8 cpv. 3","it":{"q":"Una persona ha lavorato 8 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 35 minuti","Almeno 40 minuti"]},"en":{"q":"A person has worked 8 hours. How long must the work break be?","a":["At least 30 minutes","At least 35 minutes","At least 40 minutes"]},"x":{"it":"8 ore stanno nella fascia «oltre 7 e fino a 9 ore» di lavoro, e in questa fascia la pausa è di almeno 30 minuti. Sarebbero 20 minuti fino a 7 ore e 1 ora oltre le 9 ore.","en":"8 hours falls in the band “more than 7 and up to 9 hours” of work, and in that band the break is at least 30 minutes. It would be 20 minutes up to 7 hours and 1 hour above 9 hours."},"vars":[{"it":{"q":"Una persona ha lavorato 8 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 35 minuti","Almeno 40 minuti"]},"en":{"q":"A person has worked 8 hours. How long must the work break be?","a":["At least 30 minutes","At least 35 minutes","At least 40 minutes"]},"x":{"it":"8 ore stanno nella fascia «oltre 7 e fino a 9 ore» di lavoro, e in questa fascia la pausa è di almeno 30 minuti. Sarebbero 20 minuti fino a 7 ore e 1 ora oltre le 9 ore.","en":"8 hours falls in the band “more than 7 and up to 9 hours” of work, and in that band the break is at least 30 minutes. It would be 20 minutes up to 7 hours and 1 hour above 9 hours."}},{"it":{"q":"Una persona ha lavorato 7 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 20 minuti","Almeno 30 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 7 hours. How long must the work break be?","a":["At least 20 minutes","At least 30 minutes","At least 45 minutes"]},"x":{"it":"7 ore esatte sono ancora nella fascia «fino a 7 ore», quindi bastano 20 minuti. I 30 minuti servono solo quando si superano le 7 ore.","en":"Exactly 7 hours is still in the band “up to 7 hours”, so 20 minutes is enough. The 30 minutes are needed only once you go over 7 hours."}},{"it":{"q":"Una persona ha lavorato 9 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 45 minuti","Almeno 60 minuti"]},"en":{"q":"A person has worked 9 hours. How long must the work break be?","a":["At least 30 minutes","At least 45 minutes","At least 60 minutes"]},"x":{"it":"9 ore esatte sono ancora nella fascia «oltre 7 e fino a 9 ore», quindi bastano 30 minuti. L'ora intera (60 minuti) serve solo quando si superano le 9 ore.","en":"Exactly 9 hours is still in the band “more than 7 and up to 9 hours”, so 30 minutes is enough. The full hour (60 minutes) is needed only once you go over 9 hours."}},{"it":{"q":"Una persona ha lavorato 6 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 20 minuti","Almeno 15 minuti","Almeno 30 minuti"]},"en":{"q":"A person has worked 6 hours. How long must the work break be?","a":["At least 20 minutes","At least 15 minutes","At least 30 minutes"]},"x":{"it":"6 ore rientrano nella fascia «fino a 7 ore»: la pausa è di almeno 20 minuti. 15 minuti non valgono come pausa, e 30 minuti servono solo oltre le 7 ore.","en":"6 hours falls in the band “up to 7 hours”: the break is at least 20 minutes. 15 minutes does not count as a break, and 30 minutes is needed only above 7 hours."}},{"it":{"q":"Una persona ha lavorato 10 ore. Quanto deve durare la pausa di lavoro?","a":["Almeno 60 minuti","Almeno 30 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 10 hours. How long must the work break be?","a":["At least 60 minutes","At least 30 minutes","At least 45 minutes"]},"x":{"it":"10 ore superano le 9 ore, quindi la pausa è di almeno 1 ora (60 minuti), anche divisa in 2×30 o 3×20 minuti. 30 minuti bastano solo fino a 9 ore.","en":"10 hours is over 9 hours, so the break is at least 1 hour (60 minutes), which may be split into 2×30 or 3×20 minutes. 30 minutes is enough only up to 9 hours."}},{"it":{"q":"Una persona ha lavorato 7 ore e mezza. Quanto deve durare la pausa di lavoro?","a":["Almeno 30 minuti","Almeno 20 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 7½ hours. How long must the work break be?","a":["At least 30 minutes","At least 20 minutes","At least 45 minutes"]},"x":{"it":"7 ore e mezza superano le 7 ore, quindi si è già nella fascia «oltre 7 e fino a 9 ore»: almeno 30 minuti. 20 minuti bastano solo fino a 7 ore esatte.","en":"7½ hours is over 7 hours, so you are already in the band “more than 7 and up to 9 hours”: at least 30 minutes. 20 minutes is enough only up to exactly 7 hours."}},{"it":{"q":"Una persona ha lavorato 9 ore e mezza. Quanto deve durare la pausa di lavoro?","a":["Almeno 60 minuti","Almeno 30 minuti","Almeno 45 minuti"]},"en":{"q":"A person has worked 9½ hours. How long must the work break be?","a":["At least 60 minutes","At least 30 minutes","At least 45 minutes"]},"x":{"it":"9 ore e mezza superano le 9 ore, quindi serve almeno 1 ora (60 minuti) di pausa. 30 minuti bastano solo fino a 9 ore esatte.","en":"9½ hours is over 9 hours, so a break of at least 1 hour (60 minutes) is needed. 30 minutes is enough only up to exactly 9 hours."}}],"src":"add86"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Un conducente ha guidato 4 ore e mezza senza pausa. Quanto deve durare la pausa?","a":["Almeno 45 minuti","Almeno 30 minuti","Almeno 60 minuti"]},"en":{"q":"A driver has driven 4½ hours without a break. How long must the break be?","a":["At least 45 minutes","At least 30 minutes","At least 60 minutes"]},"x":{"it":"Dopo 4 ore e mezza di guida la pausa deve essere di almeno 45 minuti. 30 minuti bastano solo se la pausa viene presa prima di arrivare a 4 ore e mezza.","en":"After 4½ hours of driving the break must be at least 45 minutes. 30 minutes is enough only if the break is taken before reaching 4½ hours."},"vars":[{"it":{"q":"Un conducente ha guidato 4 ore e mezza senza pausa. Quanto deve durare la pausa?","a":["Almeno 45 minuti","Almeno 30 minuti","Almeno 60 minuti"]},"en":{"q":"A driver has driven 4½ hours without a break. How long must the break be?","a":["At least 45 minutes","At least 30 minutes","At least 60 minutes"]},"x":{"it":"Dopo 4 ore e mezza di guida la pausa deve essere di almeno 45 minuti. 30 minuti bastano solo se la pausa viene presa prima di arrivare a 4 ore e mezza.","en":"After 4½ hours of driving the break must be at least 45 minutes. 30 minutes is enough only if the break is taken before reaching 4½ hours."}},{"it":{"q":"Un conducente fa un'unica pausa dopo 3 ore di guida. Quanto deve durare almeno?","a":["Almeno 30 minuti","Almeno 20 minuti","Almeno 45 minuti"]},"en":{"q":"A driver takes a single break after 3 hours of driving. How long must it be at least?","a":["At least 30 minutes","At least 20 minutes","At least 45 minutes"]},"x":{"it":"La pausa è presa prima di arrivare a 4 ore e mezza di guida, quindi come pausa unica bastano 30 minuti. 20 minuti bastano solo se le pause sono due.","en":"The break is taken before reaching 4½ hours of driving, so as a single break 30 minutes is enough. 20 minutes is enough only if there are two breaks."}},{"it":{"q":"Un conducente fa un'unica pausa dopo 4 ore di guida. Quanto deve durare almeno?","a":["Almeno 30 minuti","Almeno 45 minuti","Almeno 20 minuti"]},"en":{"q":"A driver takes a single break after 4 hours of driving. How long must it be at least?","a":["At least 30 minutes","At least 45 minutes","At least 20 minutes"]},"x":{"it":"4 ore sono ancora meno di 4 ore e mezza, quindi come pausa unica bastano 30 minuti. I 45 minuti servono solo dopo 4 ore e mezza di guida piene.","en":"4 hours is still less than 4½ hours, so as a single break 30 minutes is enough. The 45 minutes are needed only after a full 4½ hours of driving."}},{"it":{"q":"Dopo 2 ore di guida un conducente ha fatto una pausa di 20 minuti. Quanto deve durare la seconda pausa, presa prima di raggiungere 4 ore e mezza di guida?","a":["Almeno 20 minuti","Almeno 10 minuti","Almeno 30 minuti"]},"en":{"q":"After 2 hours of driving a driver took a 20-minute break. How long must the second break be, taken before reaching 4½ hours of driving?","a":["At least 20 minutes","At least 10 minutes","At least 30 minutes"]},"x":{"it":"Prima delle 4 ore e mezza la pausa può essere fatta in due parti da 20 minuti ciascuna. La prima è già stata fatta, quindi anche la seconda deve durare almeno 20 minuti.","en":"Before the 4½ hours the break may be taken in two parts of 20 minutes each. The first has already been taken, so the second must also last at least 20 minutes."}}],"src":"add89"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Anche il conducente indipendente deve fare una pausa di guida dopo 4 ore e mezza di guida?","a":["Sì, la pausa di guida vale per tutti i conducenti","No, la pausa di guida vale solo per i lavoratori","Sì, ma solo quando trasporta dei passeggeri"]},"en":{"q":"Must a self-employed driver also take a driving break after 4½ hours of driving?","a":["Yes, the driving break applies to all drivers","No, the driving break applies only to employees","Yes, but only when carrying passengers"]},"x":{"it":"La pausa di guida protegge dalla stanchezza al volante, quindi vale per ogni conducente, anche indipendente e anche senza passeggeri. Solo le pause di LAVORO riguardano soltanto i lavoratori dipendenti.","en":"The driving break protects against tiredness at the wheel, so it applies to every driver, including the self-employed and even without passengers. Only WORK breaks are for employees alone."},"src":"add90"},
{"c":"O","art":"Art. 8 cpv. 4","it":{"q":"Un lavoratore divide la pausa di lavoro in due parti. Quante ore di lavoro possono trascorrere al massimo tra le due parti?","a":["5 ore e mezza","4 ore e mezza","6 ore e mezza"]},"en":{"q":"An employee splits the work break into two parts. How many hours of work may there be at most between the two parts?","a":["5½ hours","4½ hours","6½ hours"]},"x":{"it":"Tra una pausa di lavoro e l'altra (o tra una pausa e il riposo) non si può lavorare più di 5 ore e mezza. Le 4 ore e mezza sono invece il limite di guida prima della pausa di guida.","en":"Between one work break and the next (or between a break and the rest) you may not work more than 5½ hours. The 4½ hours are instead the driving limit before the driving break."},"src":"add91"},
{"c":"C","art":"Art. 22 cpv. 3","it":{"q":"Quando il conducente deve annunciare al datore di lavoro un difetto del tachigrafo?","a":["Al più presto possibile","Entro la fine della settimana","Al prossimo servizio del veicolo"]},"en":{"q":"When must the driver report a tachograph defect to the employer?","a":["As soon as possible","By the end of the week","At the next vehicle service"]},"x":{"it":"Un tachigrafo guasto non registra più i tempi, quindi il datore di lavoro deve saperlo subito per farlo riparare: il difetto va annunciato al più presto possibile, non a fine settimana.","en":"A broken tachograph no longer records the times, so the employer must know at once to have it repaired: the defect is reported as soon as possible, not at the end of the week."},"src":"add92"},
{"c":"V","art":"ONC (regola dei manuali)","it":{"q":"Quante ore prima dell'inizio del lavoro il conducente non può più consumare bevande alcoliche?","a":["6 ore","4 ore","8 ore"]},"en":{"q":"How many hours before starting work may the driver no longer drink alcohol?","a":["6 hours","4 hours","8 hours"]},"x":{"it":"Secondo la regola insegnata per l'esame, il conducente non beve alcol durante il lavoro e nelle 6 ore prima di iniziare. Oggi vale inoltre il limite di 0,10 per mille alla guida.","en":"According to the rule taught for the exam, the driver does not drink alcohol during work or in the 6 hours before starting. Today the 0.10 per mille limit at the wheel also applies."},"vars":[{"it":{"q":"Quante ore prima dell'inizio del lavoro il conducente non può più consumare bevande alcoliche?","a":["6 ore","4 ore","8 ore"]},"en":{"q":"How many hours before starting work may the driver no longer drink alcohol?","a":["6 hours","4 hours","8 hours"]},"x":{"it":"Secondo la regola insegnata per l'esame, il conducente non beve alcol durante il lavoro e nelle 6 ore prima di iniziare. Oggi vale inoltre il limite di 0,10 per mille alla guida.","en":"According to the rule taught for the exam, the driver does not drink alcohol during work or in the 6 hours before starting. Today the 0.10 per mille limit at the wheel also applies."}},{"it":{"q":"Un conducente inizia il lavoro alle 14:00. Fino a che ora può ancora consumare bevande alcoliche?","a":["Fino alle 08:00","Fino alle 10:00","Fino alle 12:00"]},"en":{"q":"A driver starts work at 14:00. Until what time may they still drink alcohol?","a":["Until 08:00","Until 10:00","Until 12:00"]},"x":{"it":"La regola d'esame è: niente alcol nelle 6 ore prima di iniziare il lavoro. 14:00 − 6 ore = 08:00, quindi dopo le 08:00 non si beve più.","en":"The exam rule is: no alcohol in the 6 hours before starting work. 14:00 − 6 hours = 08:00, so after 08:00 there is no more drinking."}},{"it":{"q":"Un conducente inizia il lavoro alle 18:00. Fino a che ora può ancora consumare bevande alcoliche?","a":["Fino alle 12:00","Fino alle 14:00","Fino alle 16:00"]},"en":{"q":"A driver starts work at 18:00. Until what time may they still drink alcohol?","a":["Until 12:00","Until 14:00","Until 16:00"]},"x":{"it":"La regola d'esame è: niente alcol nelle 6 ore prima di iniziare il lavoro. 18:00 − 6 ore = 12:00, quindi dopo le 12:00 non si beve più.","en":"The exam rule is: no alcohol in the 6 hours before starting work. 18:00 − 6 hours = 12:00, so after 12:00 there is no more drinking."}}],"src":"add93"},
{"c":"V","art":"ONC art. 2a","it":{"q":"Da quale tasso alcolemico chi effettua trasporti professionali di persone è considerato sotto l'influsso dell'alcol?","a":["Da 0,10 per mille","Da 0,25 per mille","Da 0,50 per mille"]},"en":{"q":"From which blood alcohol level is a driver in professional passenger transport considered under the influence of alcohol?","a":["From 0.10 per mille","From 0.25 per mille","From 0.50 per mille"]},"x":{"it":"Nel trasporto professionale di persone vale in pratica «zero alcol»: si è considerati sotto l'influsso dell'alcol già da 0,10 per mille. Lo 0,50 per mille è il limite dei normali conducenti privati.","en":"In professional passenger transport it is “zero alcohol” in practice: you count as under the influence from as little as 0.10 per mille. 0.50 per mille is the limit for ordinary private drivers."},"src":"add94"},
{"c":"O","art":"Art. 7 cpv. 1","it":{"q":"Un conducente ha già guidato 7 ore dall'ultimo riposo giornaliero. Quante ore può ancora guidare prima del prossimo riposo giornaliero?","a":["2 ore","3 ore","4 ore"]},"en":{"q":"A driver has already driven 7 hours since the last daily rest. How many more hours may they drive before the next daily rest?","a":["2 hours","3 hours","4 hours"]},"x":{"it":"Tra due riposi giornalieri si possono guidare al massimo 9 ore: 9 − 7 già guidate = 2 ore. Lo straordinario non aggiunge mai ore di guida.","en":"Between two daily rests you may drive for at most 9 hours: 9 − 7 already driven = 2 hours. Overtime never adds driving hours."},"vars":[{"it":{"q":"Un conducente ha già guidato 7 ore dall'ultimo riposo giornaliero. Quante ore può ancora guidare prima del prossimo riposo giornaliero?","a":["2 ore","3 ore","4 ore"]},"en":{"q":"A driver has already driven 7 hours since the last daily rest. How many more hours may they drive before the next daily rest?","a":["2 hours","3 hours","4 hours"]},"x":{"it":"Tra due riposi giornalieri si possono guidare al massimo 9 ore: 9 − 7 già guidate = 2 ore. Lo straordinario non aggiunge mai ore di guida.","en":"Between two daily rests you may drive for at most 9 hours: 9 − 7 already driven = 2 hours. Overtime never adds driving hours."}},{"it":{"q":"Un conducente ha già guidato 6 ore dall'ultimo riposo giornaliero. Quante ore può ancora guidare prima del prossimo riposo giornaliero?","a":["3 ore","4 ore","5 ore"]},"en":{"q":"A driver has already driven 6 hours since the last daily rest. How many more hours may they drive before the next daily rest?","a":["3 hours","4 hours","5 hours"]},"x":{"it":"Tra due riposi giornalieri si possono guidare al massimo 9 ore: 9 − 6 già guidate = 3 ore. Lo straordinario non aggiunge mai ore di guida.","en":"Between two daily rests you may drive for at most 9 hours: 9 − 6 already driven = 3 hours. Overtime never adds driving hours."}},{"it":{"q":"Un conducente ha già guidato 5 ore dall'ultimo riposo giornaliero. Quante ore può ancora guidare prima del prossimo riposo giornaliero?","a":["4 ore","5 ore","6 ore"]},"en":{"q":"A driver has already driven 5 hours since the last daily rest. How many more hours may they drive before the next daily rest?","a":["4 hours","5 hours","6 hours"]},"x":{"it":"Tra due riposi giornalieri si possono guidare al massimo 9 ore: 9 − 5 già guidate = 4 ore. Lo straordinario non aggiunge mai ore di guida.","en":"Between two daily rests you may drive for at most 9 hours: 9 − 5 already driven = 4 hours. Overtime never adds driving hours."}},{"it":{"q":"Un conducente ha già guidato 8 ore dall'ultimo riposo giornaliero. Quante ore può ancora guidare prima del prossimo riposo giornaliero?","a":["1 ora","2 ore","3 ore"]},"en":{"q":"A driver has already driven 8 hours since the last daily rest. How many more hours may they drive before the next daily rest?","a":["1 hour","2 hours","3 hours"]},"x":{"it":"Tra due riposi giornalieri si possono guidare al massimo 9 ore: 9 − 8 già guidate = 1 ora. Lo straordinario non aggiunge mai ore di guida.","en":"Between two daily rests you may drive for at most 9 hours: 9 − 8 already driven = 1 hour. Overtime never adds driving hours."}}],"src":"add95"},

{"c":"O","art":"Art. 11 cpv. 3","it":{"q":"Il giorno di riposo di un lavoratore va da sabato alle 18:00 a domenica alle 18:00. Vale come giorno di riposo coincidente con la domenica?","a":["Sì, almeno 18 ore cadono di domenica","No, devono cadere di domenica tutte le 24 ore","No, devono cadere di domenica almeno 22 ore"]},"en":{"q":"An employee's rest day runs from Saturday 18:00 to Sunday 18:00. Does it count as a rest day coinciding with a Sunday?","a":["Yes, at least 18 hours fall on the Sunday","No, all 24 hours must fall on the Sunday","No, at least 22 hours must fall on the Sunday"]},"x":{"it":"Il giorno di riposo vale come domenica se almeno 18 delle sue 24 ore cadono di domenica. Da mezzanotte alle 18:00 di domenica sono esattamente 18 ore, quindi basta.","en":"The rest day counts as a Sunday if at least 18 of its 24 hours fall on the Sunday. From midnight to 18:00 on Sunday is exactly 18 hours, so that is enough."},"vars":[{"it":{"q":"Il giorno di riposo di un lavoratore va da sabato alle 18:00 a domenica alle 18:00. Vale come giorno di riposo coincidente con la domenica?","a":["Sì, almeno 18 ore cadono di domenica","No, devono cadere di domenica tutte le 24 ore","No, devono cadere di domenica almeno 22 ore"]},"en":{"q":"An employee's rest day runs from Saturday 18:00 to Sunday 18:00. Does it count as a rest day coinciding with a Sunday?","a":["Yes, at least 18 hours fall on the Sunday","No, all 24 hours must fall on the Sunday","No, at least 22 hours must fall on the Sunday"]},"x":{"it":"Il giorno di riposo vale come domenica se almeno 18 delle sue 24 ore cadono di domenica. Da mezzanotte alle 18:00 di domenica sono esattamente 18 ore, quindi basta.","en":"The rest day counts as a Sunday if at least 18 of its 24 hours fall on the Sunday. From midnight to 18:00 on Sunday is exactly 18 hours, so that is enough."}},{"it":{"q":"Il giorno di riposo di un lavoratore va da sabato alle 20:00 a domenica alle 20:00. Vale come giorno di riposo coincidente con la domenica?","a":["Sì, almeno 18 ore cadono di domenica","No, devono cadere di domenica tutte le 24 ore","No, devono cadere di domenica almeno 22 ore"]},"en":{"q":"An employee's rest day runs from Saturday 20:00 to Sunday 20:00. Does it count as a rest day coinciding with a Sunday?","a":["Yes, at least 18 hours fall on the Sunday","No, all 24 hours must fall on the Sunday","No, at least 22 hours must fall on the Sunday"]},"x":{"it":"Il giorno di riposo vale come domenica se almeno 18 delle sue 24 ore cadono di domenica. Da mezzanotte alle 20:00 di domenica sono 20 ore, cioè più delle 18 richieste.","en":"The rest day counts as a Sunday if at least 18 of its 24 hours fall on the Sunday. From midnight to 20:00 on Sunday is 20 hours, which is more than the 18 required."}},{"it":{"q":"Il giorno di riposo di un lavoratore va da sabato alle 16:00 a domenica alle 16:00. Vale come giorno di riposo coincidente con la domenica?","a":["No, solo 16 ore cadono di domenica","Sì, bastano 12 ore di domenica","Sì, bastano 15 ore di domenica"]},"en":{"q":"An employee's rest day runs from Saturday 16:00 to Sunday 16:00. Does it count as a rest day coinciding with a Sunday?","a":["No, only 16 hours fall on the Sunday","Yes, 12 hours on the Sunday are enough","Yes, 15 hours on the Sunday are enough"]},"x":{"it":"Il giorno di riposo vale come domenica solo se almeno 18 delle sue 24 ore cadono di domenica. Da mezzanotte alle 16:00 di domenica sono solo 16 ore: ne mancano 2.","en":"The rest day counts as a Sunday only if at least 18 of its 24 hours fall on the Sunday. From midnight to 16:00 on Sunday is only 16 hours: 2 short."}},{"it":{"q":"Il giorno di riposo di un lavoratore va da sabato alle 12:00 a domenica alle 12:00. Vale come giorno di riposo coincidente con la domenica?","a":["No, solo 12 ore cadono di domenica","Sì, bastano 12 ore di domenica","Sì, bastano 10 ore di domenica"]},"en":{"q":"An employee's rest day runs from Saturday 12:00 to Sunday 12:00. Does it count as a rest day coinciding with a Sunday?","a":["No, only 12 hours fall on the Sunday","Yes, 12 hours on the Sunday are enough","Yes, 10 hours on the Sunday are enough"]},"x":{"it":"Il giorno di riposo vale come domenica solo se almeno 18 delle sue 24 ore cadono di domenica. Da mezzanotte alle 12:00 di domenica sono solo 12 ore: troppo poche.","en":"The rest day counts as a Sunday only if at least 18 of its 24 hours fall on the Sunday. From midnight to 12:00 on Sunday is only 12 hours: too few."}}],"src":"add103"},
{"c":"O","art":"Art. 11 cpv. 2 e 4","it":{"q":"Un conducente indipendente ha lavorato 10 giorni di seguito dopo l'ultimo giorno di riposo. Per quanti giorni può ancora lavorare prima del prossimo giorno di riposo?","a":["2 giorni","3 giorni","4 giorni"]},"en":{"q":"A self-employed driver has worked 10 days in a row since the last rest day. For how many more days may they work before the next rest day?","a":["2 days","3 days","4 days"]},"x":{"it":"Tra due giorni di riposo sono ammessi al massimo 12 giorni di attività: 12 − 10 già lavorati = 2 giorni.","en":"At most 12 days of activity are allowed between two rest days: 12 − 10 already worked = 2 days."},"vars":[{"it":{"q":"Un conducente indipendente ha lavorato 10 giorni di seguito dopo l'ultimo giorno di riposo. Per quanti giorni può ancora lavorare prima del prossimo giorno di riposo?","a":["2 giorni","3 giorni","4 giorni"]},"en":{"q":"A self-employed driver has worked 10 days in a row since the last rest day. For how many more days may they work before the next rest day?","a":["2 days","3 days","4 days"]},"x":{"it":"Tra due giorni di riposo sono ammessi al massimo 12 giorni di attività: 12 − 10 già lavorati = 2 giorni.","en":"At most 12 days of activity are allowed between two rest days: 12 − 10 already worked = 2 days."}},{"it":{"q":"Un conducente indipendente ha lavorato 9 giorni di seguito dopo l'ultimo giorno di riposo. Per quanti giorni può ancora lavorare prima del prossimo giorno di riposo?","a":["3 giorni","4 giorni","5 giorni"]},"en":{"q":"A self-employed driver has worked 9 days in a row since the last rest day. For how many more days may they work before the next rest day?","a":["3 days","4 days","5 days"]},"x":{"it":"Tra due giorni di riposo sono ammessi al massimo 12 giorni di attività: 12 − 9 già lavorati = 3 giorni.","en":"At most 12 days of activity are allowed between two rest days: 12 − 9 already worked = 3 days."}},{"it":{"q":"Un conducente indipendente ha lavorato 11 giorni di seguito dopo l'ul  needed","No, it must end at 17:00 at the latest"]},"x":{"it":"La semigiornata libera deve essere di 5 ore di seguito tra le 07:00 e le 18:00. Dalle 07:00 alle 12:00 sono 5 ore, e iniziano giusto al limite delle 07:00.","en":"The free half-day must be 5 hours in a row between 07:00 and 18:00. From 07:00 to 12:00 is 5 hours, starting right on the 07:00 limit."}},{"it":{"q":"La semigiornata libera di un lavoratore va dalle 15:00 alle 20:00. È valida?","a":["No, le 5 ore devono cadere tra le 07:00 e le 18:00","Sì, sono 5 ore consecutive nello stesso giorno","Sì, basta che termini prima delle 22:00"]},"en":{"q":"An employee's free half-day runs from 15:00 to 20:00. Is it valid?","a":["No, the 5 hours must fall between 07:00 and 18:00","Yes, it is 5 consecutive hours on the same day","Yes, it only has to end before 22:00"]},"x":{"it":"Sono 5 ore, ma dalle 18:00 alle 20:00 si è fuori dalla fascia ammessa. Tutte e 5 le ore devono cadere tra le 07:00 e le 18:00.","en":"It is 5 hours, but from 18:00 to 20:00 you are outside the permitted period. All 5 hours must fall between 07:00 and 18:00."}},{"it":{"q":"La semigiornata libera di un lavoratore va dalle 08:00 alle 12:00. È valida?","a":["No, devono essere 5 ore consecutive","Sì, 4 ore consecutive sono sufficienti","Sì, basta che cada tra le 07:00 e le 18:00"]},"en":{"q":"An employee's free half-day runs from 08:00 to 12:00. Is it valid?","a":["No, it must be 5 consecutive hours","Yes, 4 consecutive hours are enough","Yes, it only has to fall between 07:00 and 18:00"]},"x":{"it":"L'orario è nella fascia giusta, ma dalle 08:00 alle 12:00 sono solo 4 ore. La semigiornata libera deve durare 5 ore di seguito.","en":"The time is within the right period, but 08:00 to 12:00 is only 4 hours. The free half-day must last 5 hours in a row."}}],"src":"add105"},

ino a 15 km/h"]},"en":{"q":"A vehicle used for professional passenger transport has a maximum design speed of 30 km/h. Does the OLR 2 apply?","a":["No, the maximum speed does not exceed 30 km/h","Yes, the exception applies only up to 20 km/h","Yes, the exception applies only up to 15 km/h"]},"x":{"it":"L'eccezione vale per i veicoli con velocità massima «non superiore a 30 km/h». 30 km/h esatti rientrano ancora nell'eccezione.","en":"The exception covers vehicles with a maximum speed “not above 30 km/h”. Exactly 30 km/h still falls within the exception."}},{"it":{"q":"Un veicolo per il trasporto professionale di persone ha una velocità massima, per costruzione, di 40 km/h. Si applica l'OLR 2?","a":["Sì, la velocità massima supera i 30 km/h","No, l'eccezione vale fino a 45 km/h","No, l'eccezione vale fino a 60 km/h"]},"en":{"q":"A vehicle used for professional passenger transport has a maximum design speed of 40 km/h. Does the OLR 2 apply?","a":["Yes, the maximum speed exceeds 30 km/h","No, the exception applies up to 45 km/h","No, the exception applies up to 60 km/h"]},"x":{"it":"L'eccezione vale solo per i veicoli che non superano i 30 km/h. Un veicolo da 40 km/h li supera, quindi si applica l'OLR 2.","en":"The exception covers only vehicles that cannot exceed 30 km/h. A 40 km/h vehicle exceeds that, so OLR 2 applies."}},{"it":{"q":"Un veicolo per il trasporto professionale di persone ha una velocità massima, per costruzione, di 45 km/h. Si applica l'OLR 2?","a":["Sì, la velocità massima supera i 30 km/h","No, l'eccezione vale fino a 45 km/h","No, l'eccezione vale fino a 60 km/h"]},"en":{"q":"A vehicle used for professional passenger transport has a maximum design speed of 45 km/h. Does the OLR 2 apply?","a":["Yes, the maximum speed exceeds 30 km/h","No, the exception applies up to 45 km/h","No, the exception applies up to 60 km/h"]},"x":{"it":"L'eccezione vale solo per i veicoli che non superano i 30 km/h. Un veicolo da 45 km/h li supera, quindi si applica l'OLR 2.","en":"The exception covers only vehicles that cannot exceed 30 km/h. A 45 km/h vehicle exceeds that, so OLR 2 applies."}}],"src":"add108"},
{"c":"O","art":"Art. 6 cpv. 2","it":{"q":"Un lavoratore ha fatto più di 4 ore di straordinario in una settimana. Il trimestre termina il 31 marzo. Entro quando il datore di lavoro deve presentare il rapporto all'autorità d'esecuzione?","a":["Entro il 14 aprile","Entro il 30 aprile","Entro il 7 aprile"]},"en":{"q":"An employee worked more than 4 hours of overtime in one week. The quarter ends on 31 March. By when must the employer submit the report to the enforcement authority?","a":["By 14 April","By 30 April","By 7 April"]},"x":{"it":"Il rapporto trimestrale va presentato entro 14 giorni dalla fine del trimestre: 31 marzo + 14 giorni = 14 aprile. Non c'è tempo fino a fine mese.","en":"The quarterly report must be submitted within 14 days of the end of the quarter: 31 March + 14 days = 14 April. You do not have until the end of the month."},"vars":[{"it":{"q":"Un lavoratore ha fatto più di 4 ore di straordinario in una settimana. Il trimestre termina il 31 marzo. Entro quando il datore di lavoro deve presentare il rapporto all'autorità d'esecuzione?","a":["Entro il 14 aprile","Entro il 30 aprile","Entro il 7 aprile"]},"en":{"q":"An employee worked more than 4 hours of overtime in one week. The quarter ends on 31 March. By when must the employer submit the report to the enforcement authority?","a":["By 14 April","By 30 April","By 7 April"]},"x":{"it":"Il rapporto trimestrale va presentato entro 14 giorni dalla fine del trimestre: 31 marzo + 14 giorni = 14 aprile. Non c'è tempo fino a fine mese.","en":"The quarterly report must be submitted within 14 days of the end of the quarter: 31 March + 14 days = 14 April. You do not have until the end of the month."}},{"it":{"q":"Un lavoratore ha fatto più di 4 ore di straordinario in una settimana. Il trimestre termina il 30 giugno. Entro quando il datore di lavoro deve presentare il rapporto all'autorità d'esecuzione?","a":["Entro il 14 luglio","Entro il 31 luglio","Entro il 7 luglio"]},"en":{"q":"An employee worked more than . Non c'è tempo fino a fine mese.","en":"The quarterly report must be submitted within 14 days of the end of the quarter: 31 December + 14 days = 14 January. You do not have until the end of the month."}}],"src":"add109"},

,"Tra 5 anni","Tra 2 anni"]},"en":{"q":"A driver aged 55 has just had the medical check. In how many years is the next one due?","a":["In 3 years","In 5 years","In 2 years"]},"x":{"it":"Dopo i 50 anni la visita medica di controllo si ripete ogni 3 anni. Un conducente di 55 anni ha superato i 50, quindi la prossima è tra 3 anni.","en":"After the age of 50 the medical check is repeated every 3 years. A 55-year-old driver is over 50, so the next one is in 3 years."}},{"it":{"q":"Un conducente di 60 anni ha appena fatto la visita medica di controllo. Tra quanti anni deve fare la prossima?","a":["Tra 3 anni","Tra 5 anni","Tra 2 anni"]},"en":{"q":"A driver aged 60 has just had the medical check. In how many years is the next one due?","a":["In 3 years","In 5 years","In 2 years"]},"x":{"it":"Dopo i 50 anni la visita medica di controllo si ripete ogni 3 anni. Un conducente di 60 anni ha superato i 50, quindi la prossima è tra 3 anni.","en":"After the age of 50 the medical check is repeated every 3 years. A 60-year-old driver is over 50, so the next one is in 3 years."}}],"src":"add110"},
{"c":"C","art":"OLR 1 art. 14c cpv. 2 (via art. 16a)","it":{"q":"A un controllo stradale, cosa deve poter presentare il conducente di un taxi con tachigrafo digitale?","a":["La carta del conducente","Il libretto di lavoro","I dischi dei 28 giorni precedenti"]},"en":{"q":"At a roadside check, what must the driver of a taxi with a digital tachograph be able to present?","a":["The driver card","The work record book","The sheets of the previous 28 days"]},"x":{"it":"Il tachigrafo digitale salva i dati sulla carta del conducente, quindi al controllo basta mostrare la carta. I dischi dei 28 giorni precedenti esistono solo con il tachigrafo analogico.","en":"The digital tachograph stores the data on the driver card, so at a check it is enough to show the card. The sheets of the previous 28 days exist only with the analogue tachograph."},"src":"add111"},
{"c":"C","art":"OLR 1 art. 18 cpv. 3 (via art. 16a)","it":{"q":"Il taxi ha un tachigrafo UE. Per quanto tempo il datore di lavoro deve conservare i dischi e i dati del tachigrafo?","a":["3 anni, ordinati per conducente","2 anni, ordinati per veicolo","5 anni, ordinati per data"]},"en":{"q":"The taxi has an EU tachograph. How long must the employer keep the tachograph sheets and data?","a":["3 years, sorted by driver","2 years, sorted by vehicle","5 years, sorted by date"]},"x":{"it":"Con il tachigrafo UE i dischi sono personali, perciò si conservano 3 anni e ordinati per conducente. I 2 anni ordinati per veicolo valgono per il tachigrafo CH.","en":"With the EU tachograph the sheets are personal, so they are kept for 3 years and sorted by driver. The 2 years sorted by vehicle apply to the CH tachograph."},"src":"add112"},
{"c":"O","art":"Art. 11 cpv. 4","it":{"q":"Due giorni di riposo settimanale possono essere cumulati nell'arco di due settimane?","a":["Sì, per i conducenti indipendenti","Sì, per i lavoratori dipendenti","No, questo è sempre vietato"]},"en":{"q":"May two weekly rest days be combined within a period of two weeks?","a":["Yes, for self-employed drivers","Yes, for employed drivers","No, this is always forbidden"]},"x":{"it":"Solo l'indipendente può organizzarsi su due settimane: in questo periodo fa due giorni di riposo di almeno 24 ore ciascuno. Il lavoratore dipendente ha invece un giorno di riposo ogni settimana.","en":"Only the self-employed can plan over two weeks: in that period they take two rest days of at least 24 hours each. An employee, by contrast, has one rest day every week."},"src":"add113"},
{"c":"C","art":"Art. 18 cpv. 7-8","it":{"q":"A chi si deve consegnare il libretto di lavoro compilato?","a":["Al datore di lavoro","Alla polizia cantonale","Resta al lavoratore"]},"en":{"q":"To whom must the completed work record book be handed?","a":["To the employer","To the cantonal police","It stays with the employee"]},"x":{"it":"I fogli compilati e il libretto pieno vanno al datore di lavoro, che deve conservarli in azienda per i controlli. Non li ritira la polizia e non restano al lavoratore.","en":"The completed sheets and the full book go to the employer, who must keep them at the business for checks. The police do not collect them and they do not stay with the employee."},"src":"add114"},
{"c":"O","art":"Art. 7 cpv. 1-2","it":{"q":"Qual è la durata massima giornaliera e settimanale della guida per un conducente indipendente?","a":["9 ore al giorno, 45 ore alla settimana","10 ore al giorno, 50 ore alla settimana","11 ore al giorno, 55 ore alla settimana"]},"en":{"q":"What is the maximum daily and weekly driving time for a self-employed driver?","a":["9 hours a day, 45 hours a week","10 hours a day, 50 hours a week","11 hours a day, 55 hours a week"]},"x":{"it":"I limiti di guida sono uguali per tutti, anche per l'indipendente: 9 ore tra due riposi giornalieri e 45 ore per settimana.","en":"The driving limits are the same for everyone, including the self-employed: 9 hours between two daily rests and 45 hours a week."},"src":"add115"},
{"c":"C","art":"Art. 18 cpv. 2-3","it":{"q":"Il conducente deve compilare il foglio settimanale del libretto di lavoro?","a":["Sì, ogni giorno, iniziando l'attività professionale","No, il disco del tachigrafo è sufficiente","Solo il lavoratore dipendente lo deve compilare"]},"en":{"q":"Must the driver fill in the weekly sheet of the work record book?","a":["Yes, every day, when starting professional activity","No, the tachograph sheet is enough","Only employed drivers have to fill it in"]},"x":{"it":"Sia il lavoratore sia l'indipendente compilano il foglio settimanale ogni giorno, quando iniziano l'attività. Il disco del tachigrafo non lo sostituisce.","en":"Both employees and the self-employed fill in the weekly sheet every day, when they start their activity. The tachograph sheet does not replace it."},"src":"add116"},
{"c":"O","art":"Art. 6 cpv. 1","it":{"q":"Quante ore di lavoro straordinario sono ammesse all'anno per un lavoratore?","a":["208 ore all'anno","204 ore all'anno","202 ore all'anno"]},"en":{"q":"How many hours of overtime are allowed per year for an employee?","a":["208 hours per year","204 hours per year","202 hours per year"]},"x":{"it":"Il massimo è di 208 ore per anno civile, cioè 4 ore di straordinario per ognuna delle 52 settimane (52 × 4 = 208).","en":"The maximum is 208 hours per calendar year, that is 4 hours of overtime for each of the 52 weeks (52 × 4 = 208)."},"src":"add117"},
{"c":"O","art":"Art. 11 cpv. 1","it":{"q":"Di quante ore consecutive deve essere il riposo settimanale, senza contare il riposo quotidiano che lo precede o lo segue?","a":["24 ore","18 ore","11 ore"]},"en":{"q":"How many consecutive hours must the weekly rest be, not counting the daily rest that precedes or follows it?","a":["24 hours","18 hours","11 hours"]},"x":{"it":"Il giorno di riposo settimanale è di almeno 24 ore di seguito. Le 11 ore sono il riposo quotidiano che si aggiunge prima o dopo, e 18 sono le ore che devono cadere di domenica.","en":"The weekly rest day is at least 24 hours in a row. The 11 hours are the daily rest added before or after it, and 18 is the number of hours that must fall on the Sunday."},"src":"add118"},
{"c":"T","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Come va considerata una pausa inferiore a 15 minuti?","a":["Come attività professionale","Come pausa obbligatoria","Come parte del riposo quotidiano"]},"en":{"q":"How is a break of less than 15 minutes to be treated?","a":["As professional activity","As a compulsory break","As part of the daily rest"]},"x":{"it":"Un'interruzione di meno di 15 minuti è troppo corta per valere come pausa: viene contata come tempo di lavoro, cioè come attività professionale.","en":"An interruption of less than 15 minutes is too short to count as a break: it is counted as working time, i.e. as professional activity."},"src":"add119"},
{"c":"O","art":"Art. 5 cpv. 1","it":{"q":"Qual è la durata massima della settimana lavorativa del lavoratore?","a":["48 ore, 53 ore nelle imprese di tassì","55 ore, 50 ore nelle imprese di tassì","52 ore per tutti i lavoratori"]},"en":{"q":"What is the maximum working week of an employee?","a":["48 hours, 53 hours in taxi businesses","55 hours, 50 hours in taxi businesses","52 hours for all employees"]},"x":{"it":"La settimana lavorativa massima è di 48 ore; solo nelle imprese di tassì sale a 53 ore. Le 52 ore sono 48 + 4 di straordinario, non il massimo normale.","en":"The maximum working week is 48 hours; only in taxi businesses does it rise to 53 hours. 52 hours is 48 + 4 of overtime, not the normal maximum."},"src":"add120"},
{"c":"O","art":"Art. 20 cpv. 1","it":{"q":"Si può derogare alle disposizioni sulla durata del lavoro, della guida e del riposo?","a":["Solo in casi di necessità, come forza maggiore o soccorso","No, in nessun caso, nemmeno per portare soccorso","Sì, se il superamento non dura più di mezz'ora"]},"en":{"q":"May one deviate from the rules on working, driving and rest time?","a":["Only in cases of necessity, such as force majeure or giving help","No, in no case, not even to give help","Yes, if the limit is exceeded by no more than half an hour"]},"x":{"it":"Le regole si possono superare solo in una vera necessità, come forza maggiore o soccorso, e solo se la sicurezza lo permette. La deroga va poi annotata nel libretto di lavoro e nel registro.","en":"The rules may be exceeded only in real necessity, such as force majeure or giving help, and only if safety allows it. The deviation must then be noted in the work record book and in the register."},"src":"add121"},
{"c":"C","art":"OETV art. 101 cpv. 5","it":{"q":"Cosa si deve controllare dopo un servizio o una riparazione effettuati al tachigrafo?","a":["I sigilli (piombi) nei punti di chiusura e sul tachigrafo","Se la chiave e abbastanza dischi si trovano nel veicolo","La precisione delle misure, a cura del conducente"]},"en":{"q":"What must be checked after a service or repair carried out on the tachograph?","a":["The seals at the closure points and on the tachograph","Whether the key and enough sheets are in the vehicle","The accuracy of the measurements, by the driver"]},"x":{"it":"Il tachigrafo è protetto da sigilli (piombi) contro le manomissioni. Dopo ogni servizio o riparazione bisogna assicurarsi che i sigilli siano al loro posto e intatti.","en":"The tachograph is protected against tampering by seals. After every service or repair you must make sure the seals are in place and intact."},"src":"add122"},
{"c":"P","art":"Art. 4 cpv. 1 lett. a","it":{"q":"I conducenti di veicoli equipaggiati come ambulanze sottostanno all'OLR 2?","a":["No, non sottostanno all'OLR 2","Sì, come tutti i conducenti professionali","Solo durante le corse urgenti"]},"en":{"q":"Are drivers of vehicles equipped as ambulances subject to the OLR 2?","a":["No, they are not subject to the OLR 2","Yes, like all professional drivers","Only during urgent trips"]},"x":{"it":"Le ambulanze sono un'eccezione espressa: i trasporti con veicoli equipaggiati per compiti sanitari non rientrano nell'OLR 2, né nelle corse urgenti né nelle altre.","en":"Ambulances are an express exception: transport with vehicles equipped for medical tasks does not fall under OLR 2, whether on urgent trips or on others."},"src":"add123"},
{"c":"O","art":"Art. 12 cpv. 2","it":{"q":"Le semigiornate libere settimanali di quattro settimane consecutive di lavoro possono essere prese in blocco?","a":["Sì, per il lavoratore","Sì, ma soltanto per gli indipendenti","No, vanno prese ogni settimana"]},"en":{"q":"May the weekly free half-days of four consecutive working weeks be taken together?","a":["Yes, for the employee","Yes, but only for the self-employed","No, they must be taken every week"]},"x":{"it":"Solo il lavoratore dipendente ha diritto alla semigiornata libera. D'accordo con il datore di lavoro può prendere in una sola volta le semigiornate di quattro settimane consecutive.","en":"Only an employee is entitled to the free half-day. By agreement with the employer they may take the half-days of four consecutive weeks all at once."},"src":"add124"},

/* ================= CONSTANTS (official asa CUT exam format for BPT / B121) ================= */
const EXAM_N = 30;          // questions per exam
const EXAM_MIN = 45;        // minutes
const MAX_MISTAKES = 3;     // max errors allowed
const CRITICAL_S = 5*60;    // timer turns red
const CATS = ['T','P','O','C','V'];
const CAT_MIN = {T:3,P:3,O:7,C:9,V:0};
const CASE_MIN = 5; // at least this many concrete-case questions (entries with vars) per exam
const VERSION = 'v24 · 11.11.2026 · OLR 2 stato 01.03.2025';

let lang = localStorage.getItem('b121lang2') || null;
let view = lang ? 'start' : 'lang';   // lang | start | exam | overview | result | train | trainresult

let train = null;
const instantFb = true;   // correct answer is always shown right after answering
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Case questions: a pool entry may carry several concrete cases (vars); one is drawn per exam and stored with the question.
function QV(qq){ const P=POOL[qq.p]; return (P.vars && Number.isInteger(qq.v) && P.vars[qq.v]) ? P.vars[qq.v] : P; }
// Legal-basis label: the pool stores it in Italian; show English abbreviations in the English version.
function artL(a){
  if(lang!=='en') return a;
  return a.replace(/cpv\./g,'para.').replace(/lett\./g,'let.').replace(/ e /g,' and ').replace(/^RS /,'SR ')
    .replace('OAC / licenza di circolazione','OAC / vehicle registration document').replace('Diritto cantonale','Cantonal law')
    .replace('Uso del tachigrafo','Using the tachograph').replace('Simboli del tachigrafo','Tachograph symbols').replace(/^Tachigrafo$/,'Tachograph')
    .replace('ONC (regola dei manuali)','ONC (textbook rule)').replace(/\bart\. /g,'Art. ');
}
function pickVar(p){ const P=POOL[p]; return P.vars ? Math.floor(Math.random()*P.vars.length) : null; }
const T = ()=>UI[lang||'en'];
const catName = c => (T().cat[c]||(c==='V'?'Varie':c));
