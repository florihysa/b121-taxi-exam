<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT-Exam · B121 / BPT — OLR 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== Official CUT design tokens (asa Computer-Unterstützte Theorieprüfung) ===== */
  :root{
    --white:#ffffff;
    --night-rider:#303030;      /* texts */
    --dark-grey:#ababab;        /* lines, strokes */
    --silver:#c6c6c6;           /* inactive states */
    --white-smoke:#f1f1f1;      /* backgrounds */
    --mariner:#355da6;          /* buttons / primary */
    --mariner-light:#afbedb;
    --mahogany:#d73b40;         /* failed, errors */
    --medium-orchid:#af61c6;    /* marked content */
    --deep-lilac:#9849af;
    --jungle-green:#289b7c;     /* passed, accepted */
    --tropical-rain-forest:#027d5c;

    --primary-text-color:var(--night-rider);
    --line-color:var(--dark-grey);
    --inactive-color:var(--silver);
    --shared-background-color:var(--white-smoke);
    --button-color:var(--mariner);
    --error-color:var(--mahogany);
    --marked-content-color:var(--medium-orchid);
    --test-accepted-color:var(--jungle-green);
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    width:100vw; margin:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none; cursor:default;
    background-color:white; color:var(--primary-text-color);
    font-family:'Roboto Condensed','Roboto',sans-serif;
    font-style:normal; font-weight:400;
    overflow-x:hidden;
  }
  .header{
    height:80px; padding:0 60px; background-color:var(--white-smoke);
    display:flex; flex-direction:row; align-items:center;
  }
  .footer{
    position:fixed; bottom:0; left:0; right:0; height:80px; padding:0 60px;
    background-color:var(--white-smoke);
    display:flex; flex-direction:row; align-items:center;
  }
  .justified{justify-content:space-between;}
  .scrollpanel{
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    position:absolute; top:80px; bottom:80px; left:0; right:0;
  }
  .scrollpanel-noheader{top:0;}
  /* paper-button replica */
  .pbtn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:inherit; font-size:14px; font-weight:500; letter-spacing:.2px;
    color:var(--mariner); background:#fff; border:none; border-radius:5px;
    padding:10px 16px; min-width:64px; cursor:pointer; text-transform:none;
    box-shadow:0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12),0 3px 1px -2px rgba(0,0,0,.2);
    transition:box-shadow .15s;
  }
  .pbtn:active{box-shadow:0 4px 5px 0 rgba(0,0,0,.14),0 1px 10px 0 rgba(0,0,0,.12),0 2px 4px -1px rgba(0,0,0,.3);}
  .pbtn.invert{background:var(--mariner); color:white;}
  .pbtn.flat{box-shadow:none; background:transparent;}
  .pbtn.bookmarkbtn{color:var(--marked-content-color);}
  .pbtn svg{width:20px; height:20px; fill:currentColor; flex:0 0 auto;}
  /* icon button (navigation chevrons) */
  .navbtn{
    border:none; cursor:pointer; color:white; background-color:var(--button-color);
    width:50px; height:50px; padding:8px;
  }
  .navbtn svg{width:100%; height:100%; fill:white;}
  .navbtn.back{border-radius:0 5px 5px 0;}
  .navbtn.forward{border-radius:5px 0 0 5px;}
  .navbtn:disabled{background-color:var(--silver); cursor:default;}
  /* login-info block (top right on start screens) */
  .logininfo{
    position:absolute; top:8px; right:44px; font-size:13px; line-height:1.3;
  }
  .logininfo td{padding:1px 0;}
  .logininfo td:first-child{padding-right:24px;}
  .logininfo td:last-child{font-weight:700;}
  /* ===== language selection ===== */
  .langpage{position:absolute; top:60px; left:0; right:0; display:flex; flex-direction:column; align-items:center;}
  .langcards{margin-top:75px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:400px;}
  .langcard{
    width:170px; padding:22px 0; text-align:center; background:#fff; border:none; cursor:pointer;
    color:var(--mariner); font-family:inherit; font-size:14px; font-weight:500; border-radius:2px;
    box-shadow:0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12),0 3px 1px -2px rgba(0,0,0,.2);
  }
  /* ===== start screen ===== */
  .startpage{padding:26px 20px 100px; text-align:center;}
  .startpage h1{font-size:24px; font-weight:700; margin:34px 0 0;}
  .startpage .goodluck{margin-top:34px; font-size:15px;}
  .startpage .disclaimer{margin:28px auto 0; max-width:820px; color:var(--mahogany); font-size:15px; line-height:1.5;}
  .examtable{
    margin:36px auto 0; border-top:1px solid var(--white-smoke); border-bottom:1px solid var(--white-smoke);
    padding:22px 0; max-width:760px; text-align:left; font-size:14px;
  }
  .examtable table{margin:0 auto; border-collapse:collapse;}
  .examtable td{padding:3px 0; vertical-align:top;}
  .examtable td:first-child{font-weight:700; padding-right:80px; white-space:nowrap;}
  .startbtn{margin-top:40px;}
  /* ===== exam screen ===== */
  .examcontainer{height:100%; display:flex; flex-direction:row;}
  .self-center{align-self:center;}
  .exampage{flex:1; min-width:0;}
  .content{padding:0 60px; display:flex; flex-direction:column;}
  .title{
    margin-top:10px; padding-bottom:10px; border-bottom:2px solid var(--shared-background-color);
    display:flex; flex-direction:row; align-items:center;
  }
  .titleText{font-weight:700; font-size:15px;}
  .flexspacer{flex:1;}
  .qcols{display:flex; flex-direction:row; gap:0;}
  .contentLeft{padding:20px 20px 0 0; display:flex; flex-direction:column; flex:1; min-width:0;}
  .contentRight{padding:20px 0 0 20px; flex:1; min-width:0;}
  .questionTitle{font-size:large; margin-bottom:10px; line-height:normal;}
  /* answers — official CUT styles */
  .answer{
    margin:5px 0 5px 0; padding:20px; border:1px solid #fff;
    display:flex; flex-direction:row; align-items:flex-start; cursor:pointer;
  }
  .answer span.atext{margin-top:5px; font-size:14px; line-height:1.4;}
  .answer.selected{
    border:1px solid var(--inactive-color);
    box-shadow:0 0 1px 0 rgba(0,0,0,.12),0 1px 2px 0 rgba(0,0,0,.12),0 2px 1px -2px rgba(0,0,0,.2);
  }
  /* paper-checkbox replica: 30px */
  .pcheck{
    display:inline-block; flex:0 0 30px; width:30px; height:30px; margin-right:16px; position:relative;
    border:2px solid var(--silver); border-radius:2px; background:#fff;
  }
  .answer.checked .pcheck{background:var(--mariner); border-color:var(--mariner);}
  .answer.checked .pcheck::after{
    content:''; position:absolute; left:9px; top:2px; width:8px; height:17px;
    border:solid white; border-width:0 3px 3px 0; transform:rotate(45deg);
  }
  /* review mode rings (official .correct / .incorrect) */
  .ring{
    display:inline-flex; align-items:center; padding:8px 0px 8px 8px; margin-right:8px; margin-left:-11px;
    border:3px solid transparent; border-radius:26px; max-height:52px;
  }
  .correct .ring{border-color:var(--test-accepted-color);}
  .incorrect .ring{border-color:var(--error-color);}
  @keyframes ringPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
  .ring.anim{animation:ringPop .45s cubic-bezier(.2,.8,.3,1.25);}
  @keyframes flashGood{0%{background:rgba(40,155,124,.28)}100%{background:transparent}}
  @keyframes flashBad{0%{background:rgba(215,59,64,.26)}40%{transform:translateX(-4px)}60%{transform:translateX(4px)}100%{background:transparent;transform:translateX(0)}}
  .answer.flashgood{animation:flashGood .9s ease-out;}
  .answer.flashbad{animation:flashBad .6s ease-out;}
  .ring .pcheck{margin-right:8px;}
  /* header widgets */
  .hstack{display:flex; flex-direction:column; font-size:13px; line-height:1.5;}
  .hstack .row{display:flex; align-items:center; gap:6px;}
  .questionBookmarked{color:var(--marked-content-color);}
  .questionAnswered{color:var(--button-color);}
  .hstack svg{width:18px; height:18px; fill:currentColor;}
  /* cut-time-progress replica */
  .timewrap{margin-left:40px;}
  .cut-time{width:20vw; min-width:170px; height:40px; background:var(--white); position:relative; overflow:hidden;}
  .cut-time .fill{position:absolute; left:0; top:0; bottom:0; background:var(--inactive-color);}
  .cut-time .label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:space-around;
    font-size:14px; z-index:1;
  }
  .cut-time .label.critical{color:var(--error-color);}
  /* ===== overview (Fragenübersicht) ===== */
  .ovwrap{padding:0 0 60px 60px;}
  .list-item{display:inline-table; margin:0 20px 0 0; width:calc(20% - 32px);}
  .list-item .flag{
    position:relative; width:36px; height:36px; top:40px; left:10px; z-index:1000;
    color:var(--marked-content-color); display:block;
  }
  .list-item .flag svg{width:36px; height:36px; fill:currentColor;}
  .list-item .flag.hiddenflag{visibility:hidden;}
  .ovbtn{width:100%; padding:15px; margin-bottom:6px;}
  .ovbtn .button-text{width:100%; text-align:center;}
  .ovbtn.answered{color:#fff;}
  .infoText{display:inline-block; width:100px; padding:2px 0;}
  .infoValue{font-weight:700;}
  /* ===== dialogs (paper-dialog replica) ===== */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    display:none; align-items:center; justify-content:center;
  }
  .backdrop.open{display:flex;}
  .pdialog{
    background:#fff; border-radius:2px; min-width:420px; max-width:620px; padding:24px;
    box-shadow:0 16px 24px 2px rgba(0,0,0,.14),0 6px 30px 5px rgba(0,0,0,.12),0 8px 10px -5px rgba(0,0,0,.4);
    font-size:15px; line-height:1.5;
  }
  .pdialog .dlgbuttons{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}
  /* ===== result ===== */
  .resultpage{padding:26px 20px 120px; text-align:center;}
  .resultpage h1{font-size:24px; font-weight:700; margin:34px 0 0;}
  .verdict{font-size:26px; font-weight:700; margin-top:8px;}
  .verdict.pass{color:var(--tropical-rain-forest);}
  .verdict.fail{color:var(--mahogany);}
  .reviewwrap{max-width:900px; margin:30px auto 0; text-align:left;}
  .reviewwrap h2{font-size:16px; border-bottom:2px solid var(--shared-background-color); padding-bottom:8px;}
  .rquestion{margin:26px 0 6px; font-size:15px; font-weight:700; line-height:1.4;}
  .rquestion .qnum{color:var(--mariner);}
  .reviewwrap .answer{cursor:default; padding:10px 14px;}
  .reviewwrap .answer .pcheck{transform:scale(.8); transform-origin:left center;}
  .rmarkedflag{color:var(--marked-content-color); font-size:13px;}
  .explain{
    font-size:13px; color:var(--night-rider); background:var(--white-smoke);
    border-left:3px solid var(--mariner); padding:10px 14px; margin:8px 0 2px; line-height:1.55;
  }
  @media (max-width:860px){
    .header,.footer{padding:0 14px;}
    .content{padding:0 14px;}
    .qcols{flex-direction:column;}
    .contentLeft,.contentRight{padding:14px 0 0 0;}
    .timewrap{margin-left:10px;}
    .list-item{width:calc(33% - 24px);}
    .pdialog{min-width:0; margin:0 12px;}
    .logininfo{right:12px;}
    .hstack{display:none;}
  }
  .artref{font-size:12px; color:var(--dark-grey); margin-left:8px; font-weight:400; white-space:nowrap;}
  .verdict:not(.pass):not(.fail){color:var(--mariner);}
  .answer{padding:12px 16px; margin:4px 0;}
  .contentLeft{padding-top:14px;} .contentRight{padding-top:10px;}
  .explain{margin-top:10px;}
  .contentRight .explain{margin-bottom:16px;}
  .explain ul{margin:0; padding:0 0 0 18px; list-style:disc;}
  .explain li{margin:0; padding:0;}
  .explain li::marker{color:var(--mariner);}
  /* ===== theme toggle ===== */
  .fgroup{display:inline-flex; gap:8px; align-items:center;}
  .pbtn.themebtn{min-width:0; padding:10px;}
  .themefloat{position:absolute; top:20px; left:20px; z-index:2;}
  @media (max-width:480px){
    .footer{padding:0 8px;}
    .footer .pbtn{padding:9px 7px; font-size:12px; gap:4px; white-space:nowrap;}
    .footer .pbtn svg{width:16px; height:16px;}
    .footer .fgroup{gap:5px;}
    .themefloat{left:12px;}
  }
  /* ===== dark theme: same layout, darker palette ===== */
  html[data-theme="dark"]{
    color-scheme:dark;
    --white:#1e2024; --night-rider:#e6e8eb; --dark-grey:#8b919a; --silver:#5a606a; --white-smoke:#26292e;
    --mariner:#8db1f2; --mariner-light:#3c4d70; --mahogany:#f17f83; --medium-orchid:#d199e6; --deep-lilac:#b877cf;
    --jungle-green:#3fbf9b; --tropical-rain-forest:#4fd0ab;
  }
  html[data-theme="dark"] body{background-color:#17191c;}
  html[data-theme="dark"] .pbtn{background:#2f333a;}
  html[data-theme="dark"] .pbtn.flat{background:transparent;}
  html[data-theme="dark"] .pbtn.invert{background:#3f6fc4; color:#fff;}
  html[data-theme="dark"] .navbtn{background-color:#3f6fc4;}
  html[data-theme="dark"] .navbtn:disabled{background-color:#33373e;}
  html[data-theme="dark"] .navbtn:disabled svg{fill:#7b818b;}
  html[data-theme="dark"] .langcard{background:#2f333a;}
  html[data-theme="dark"] .answer{border-color:transparent;}
  html[data-theme="dark"] .answer.selected{border-color:var(--inactive-color);}
  html[data-theme="dark"] .pcheck{background:#1e2024;}
  html[data-theme="dark"] .answer.checked .pcheck{background:#3f6fc4; border-color:#3f6fc4;}
  html[data-theme="dark"] .pdialog{background:#2a2d33; color:var(--night-rider);}
  html[data-theme="dark"] .cut-time{background:#17191c;}
</style>
</head>

{"c":"P","art":"Art. 3 cpv. 1","it":{"q":"A quali conducenti si applica principalmente l'OLR 2 (RS 822.222)?","a":["Ai conducenti professionali di veicoli leggeri e autovetture pesanti per il trasporto di persone","Ai conducenti professionali di veicoli merci pesanti e di autobus con più di 16 posti","A tutti i conducenti di veicoli leggeri, anche privati e senza trasporto professionale"]},"en":{"q":"Which drivers does the OLR 2 (SR 822.222) mainly apply to?","a":["Professional drivers of light vehicles and heavy passenger cars for passenger transport","Professional drivers of heavy goods vehicles and of buses with more than 16 seats","All drivers of light vehicles, including private ones without professional transport"]},"x":{"it":"L'OLR 2 è l'ordinanza per chi trasporta persone a titolo professionale con veicoli leggeri o autovetture pesanti, come i taxi. Autocarri e autobus con più di 16 posti rientrano nell'OLR 1, e le corse private non contano.","en":"OLR 2 is the ordinance for people who carry passengers professionally in light vehicles or heavy passenger cars, such as taxis. Lorries and buses with more than 16 seats fall under OLR 1, and private trips are not covered."},"src":"ref1"},
{"c":"P","art":"Art. 3 cpv. 2","it":{"q":"Un taxi è un veicolo leggero fino a 3'500 kg con al massimo quanti posti PER PASSEGGERI (SENZA contare il conducente) secondo l'OLR 2?","a":["8 posti passeggeri","16 posti passeggeri","4 posti passeggeri"]},"en":{"q":"Under the OLR 2, how many PASSENGER seats (not counting the driver) may a light taxi of up to 3,500 kg have at most?","a":["8 passenger seats","16 passenger seats","4 passenger seats"]},"x":{"it":"Un taxi ha al massimo 8 posti per i passeggeri più quello del conducente, cioè 9 in totale. Qui la domanda chiede i posti SENZA il conducente, quindi la risposta è 8.","en":"A taxi has at most 8 passenger seats plus the driver's seat, so 9 in total. This question asks for the seats WITHOUT the driver, so the answer is 8."},"src":"ref2"},

{"c":"T","art":"Art. 2 cpv. 2 lett. f","it":{"q":"Come è definito il \"tempo di guida\" (Lenkzeit)?","a":["Il tempo durante il quale il veicolo è effettivamente in movimento (guida vera e propria)","L'intera giornata lavorativa dall'inizio alla fine, comprese tutte le pause e le attese","Il tempo trascorso in servizio in attesa dei clienti ai posteggi taxi (tempo di attesa)"]},"en":{"q":"How is \"driving time\" defined?","a":["The time during which the vehicle is actually being driven","The whole working day, including all breaks and waiting times","The time spent on duty waiting for customers at the taxi rank"]},"x":{"it":"Tempo di guida è solo il tempo in cui guidi davvero il veicolo. L'attesa al posteggio e gli altri lavori sono tempo di lavoro, non di guida, e la giornata intera con le pause è un'altra cosa ancora.","en":"Driving time is only the time you are actually driving the vehicle. Waiting at the rank and other tasks are working time, not driving time, and the whole day including breaks is something else again."},"src":"ref4"},
{"c":"T","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Cosa comprende il \"tempo di lavoro\" (Arbeitszeit)?","a":["Il tempo di guida più ogni altra attività lavorativa","Ogni attività lavorativa escluso il tempo di guida","Il tempo di guida più il periodo di riposo giornaliero"]},"en":{"q":"What does \"working time\" include?","a":["Driving time plus all other work-related activity","All work-related activity except the driving time","Driving time plus the daily rest period"]},"x":{"it":"Il tempo di lavoro comprende tutto ciò che fai per lavoro: la guida più ogni altra attività (attesa, pulizia, rifornimento, scartoffie). Il riposo non ne fa mai parte.","en":"Working time covers everything you do for work: driving plus every other task (waiting, cleaning, refuelling, paperwork). Rest is never part of it."},"src":"ref5"},
{"c":"T","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Le interruzioni o brevi pause di meno di 15 minuti sono considerate come...","a":["Tempo di lavoro","Tempo di riposo","Una pausa di guida"]},"en":{"q":"Interruptions or short breaks of less than 15 minutes count as...","a":["Working time","Rest time","A driving break"]},"x":{"it":"Un'interruzione di meno di 15 minuti è troppo corta per valere come pausa, quindi viene contata come tempo di lavoro. Una vera pausa di lavoro deve durare almeno 20 minuti.","en":"An interruption of less than 15 minutes is too short to count as a break, so it is counted as working time. A real work break must last at least 20 minutes."},"src":"ref6"},
{"c":"T","art":"Art. 2 cpv. 2 lett. g","it":{"q":"Per un conducente indipendente, cosa conta come \"attività professionale\" ai fini delle regole?","a":["Il tempo di guida","Il tempo di lavoro","Il tempo di attesa"]},"en":{"q":"For a self-employed driver, what counts as “professional activity” under the OLR 2?","a":["The driving time","The working time","The waiting time"]},"x":{"it":"Per l'indipendente l'«attività professionale» è il tempo di guida, perché il suo tempo di lavoro non è limitato dall'OLR 2. Per il lavoratore dipendente invece è il tempo di lavoro.","en":"For a self-employed driver, “professional activity” means the driving time, because their working time is not limited by OLR 2. For an employee it means the working time."},"src":"ref7"},
{"c":"P","art":"OAC / licenza di circolazione","it":{"q":"Un veicolo può essere impiegato per il trasporto professionale di persone solo se...","a":["È annotato/iscritto per il trasporto professionale di persone nella licenza di circolazione","È dotato di un tassametro approvato dall'autorità di esecuzione","Ha superato un controllo all'ufficio della circolazione negli ultimi 12 mesi"]},"en":{"q":"A vehicle may be used for professional passenger transport only if...","a":["It is entered for professional passenger transport in the vehicle registration document","It is equipped with a taximeter approved by the enforcement authority","It has passed an inspection at the road traffic office within the last 12 months"]},"x":{"it":"Il veicolo deve essere iscritto nella licenza di circolazione per il trasporto professionale di persone: solo così è ammesso a questo uso. Un tassametro o un controllo recente non bastano.","en":"The vehicle must be entered in its registration document for professional passenger transport: only then may it be used for that. A taximeter or a recent inspection is not enough."},"src":"ref8"},
{"c":"O","art":"Art. 7 cpv. 1","it":{"q":"Qual è il tempo massimo DI GUIDA giornaliero tra due periodi di riposo giornaliero consecutivi?","a":["9 ore","10 ore","8 ore"]},"en":{"q":"What is the maximum daily DRIVING time between two consecutive daily rest periods?","a":["9 hours","10 hours","8 hours"]},"x":{"it":"Tra un riposo giornaliero e il successivo puoi guidare al massimo 9 ore. La giornata di lavoro può essere più lunga, perché l'attesa e gli altri lavori non sono tempo di guida.","en":"Between one daily rest and the next you may drive for at most 9 hours. The working day can be longer, because waiting and other tasks are not driving time."},"src":"ref9"},
{"c":"O","art":"Art. 7 cpv. 2","it":{"q":"Qual è il tempo massimo DI GUIDA (Lenkzeit) in una settimana?","a":["45 ore","56 ore","48 ore"]},"en":{"q":"What is the maximum DRIVING time within one week?","a":["45 hours","56 hours","48 hours"]},"x":{"it":"La guida è limitata a 45 ore a settimana. 48 e 53 ore sono i limiti del tempo di LAVORO (fuori e dentro le aziende di taxi), mentre 56 ore è il limite di guida dei camionisti nell'OLR 1.","en":"Driving is limited to 45 hours a week. 48 and 53 hours are the limits for WORKING time (outside and inside taxi businesses), while 56 hours is the driving limit for lorry drivers under OLR 1."},"src":"ref10"},
{"c":"O","art":"Art. 7 cpv. 3","it":{"q":"I tempi massimi di guida giornalieri e settimanali possono essere superati facendo straordinari?","a":["No, non possono mai essere superati, nemmeno con lo straordinario","Sì, se il datore di lavoro approva lo straordinario per iscritto","Sì, al massimo una volta a settimana per corse prenotate"]},"en":{"q":"May the daily and weekly maximum driving times be exceeded when doing overtime?","a":["No, they may never be exceeded, not even with overtime","Yes, if the employer approves the overtime in writing","Yes, at most once per week for pre-booked trips"]},"x":{"it":"I limiti di guida (9 ore al giorno, 45 ore a settimana) sono assoluti. Lo straordinario allunga solo il tempo di lavoro, mai il tempo di guida, e nessuno può autorizzare un superamento.","en":"The driving limits (9 hours a day, 45 hours a week) are absolute. Overtime only extends working time, never driving time, and nobody can authorise going over them."},"src":"ref11"},
{"c":"O","art":"Art. 2 cpv. 2 lett. f","it":{"q":"Quale attività conta sempre interamente come tempo di guida?","a":["Ogni periodo in cui il veicolo è in movimento nel traffico","La pulizia e il rifornimento del veicolo tra le corse","La compilazione del libretto di lavoro a fine turno"]},"en":{"q":"Which activity always counts fully as driving time?","a":["Every period in which the vehicle is moving in traffic","Cleaning and refuelling the vehicle between trips","Filling in the work record book at the end of the shift"]},"x":{"it":"Appena il veicolo si muove nel traffico è tempo di guida, anche senza clienti a bordo. Pulire, fare rifornimento e compilare il libretto sono altri lavori: contano come tempo di lavoro, non di guida.","en":"As soon as the vehicle is moving in traffic it is driving time, even with no customers on board. Cleaning, refuelling and filling in the work record book are other work: they count as working time, not driving time."},"src":"ref12"},
{"c":"O","art":"Art. 7 cpv. 1","it":{"q":"Un tassista indipendente ha già guidato 9 ore oggi. Cosa può ancora fare oggi?","a":["Nessun'altra guida secondo l'OLR 2 fino a dopo un riposo giornaliero","Guidare fino a 2 ore in più dopo una pausa di 45 minuti","Guidare 1 ora in più se la corsa era prenotata in anticipo"]},"en":{"q":"A self-employed taxi driver has already driven 9 hours today. What may they still do today?","a":["Not drive any more until they have taken a daily rest","Drive up to 2 more hours after a 45-minute break","Drive 1 more hour if the trip was booked in advance"]},"x":{"it":"9 ore sono il massimo di guida tra due riposi giornalieri, e vale anche per l'indipendente. Una pausa o una corsa prenotata non danno ore in più: prima serve un riposo giornaliero.","en":"9 hours is the most you may drive between two daily rests, and this also applies to the self-employed. A break or a pre-booked trip gives no extra hours: a daily rest must come first."},"src":"ref13"},
{"c":"O","art":"Art. 7","it":{"q":"I limiti del tempo di guida dell'OLR 2 esistono principalmente per...","a":["Garantire la sicurezza stradale evitando la stanchezza del conducente","Ridurre la congestione del traffico nei centri urbani","Garantire guadagni equi tra le aziende di taxi"]},"en":{"q":"The driving-time limits of the OLR 2 exist mainly to...","a":["Ensure road safety by preventing driver fatigue","Reduce traffic congestion in the city centres","Guarantee equal earnings among taxi businesses"]},"x":{"it":"Un conducente stanco reagisce più lentamente e provoca incidenti. I limiti di guida servono a proteggere i passeggeri e gli altri utenti della strada, non a regolare il traffico o i guadagni.","en":"A tired driver reacts more slowly and causes accidents. The driving limits are there to protect passengers and other road users, not to manage traffic or earnings."},"src":"ref14"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Dopo quanto tempo di guida continuativa deve essere effettuata una pausa DI GUIDA di almeno 45 minuti?","a":["Dopo 4 ore e mezza di guida","Dopo 5 ore e mezza di guida","Dopo 3 ore e mezza di guida"]},"en":{"q":"After how much continuous driving time must a DRIVING break of at least 45 minutes be taken?","a":["After 4½ hours of driving","After 5½ hours of driving","After 3½ hours of driving"]},"x":{"it":"Dopo 4 ore e mezza di guida è obbligatoria una pausa di almeno 45 minuti. Non confonderla con la pausa di lavoro, che va fatta al più tardi dopo 5 ore e mezza di lavoro.","en":"After 4½ hours of driving a break of at least 45 minutes is compulsory. Do not mix it up with the work break, which is due after 5½ hours of work at the latest."},"src":"ref15"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Se la pausa è collocata PRIMA che siano trascorse 4 ore e mezza di guida, cosa è sufficiente?","a":["Una pausa di 30 minuti, oppure due pause di 20 minuti ciascuna","Una pausa di 20 minuti, oppure due pause di 15 minuti ciascuna","Una pausa di 15 minuti, oppure due pause di 10 minuti ciascuna"]},"en":{"q":"If the break is taken BEFORE 4½ hours of driving have passed, what is enough?","a":["One break of 30 minutes, or two breaks of 20 minutes each","One break of 20 minutes, or two breaks of 15 minutes each","One break of 15 minutes, or two breaks of 10 minutes each"]},"x":{"it":"Chi si ferma prima di arrivare a 4 ore e mezza di guida può fare una pausa più corta: 30 minuti in una volta, oppure due pause di 20 minuti. I 45 minuti servono solo se si guida per 4 ore e mezza piene.","en":"If you stop before reaching 4½ hours of driving, a shorter break is enough: 30 minutes in one go, or two breaks of 20 minutes each. The 45 minutes are needed only if you drive the full 4½ hours."},"src":"ref16"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Cosa NON può fare il conducente durante una pausa di guida?","a":["Guidare un veicolo","Riposare in auto","Leggere un giornale"]},"en":{"q":"What may the driver NOT do during a driving break?","a":["Drive a vehicle","Rest in the car","Read a newspaper"]},"x":{"it":"La pausa di guida serve a staccare dal volante, quindi l'unica cosa vietata è guidare un veicolo. Riposare in auto o leggere il giornale è permesso.","en":"The driving break is meant to get you away from the wheel, so the one thing you may not do is drive a vehicle. Resting in the car or reading the paper is allowed."},"src":"ref17"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Quando la pausa di guida di 45 minuti non è richiesta dopo 4 ore e mezza?","a":["Se subito dopo inizia un riposo giornaliero o settimanale","Se il tempo di guida totale del giorno resta sotto le 9 ore","Se il conducente effettua la pausa entro l'ora successiva"]},"en":{"q":"When is the 45-minute driving break not required after 4½ hours of driving?","a":["If a daily or weekly rest begins immediately afterwards","If the total driving time of the day stays under 9 hours","If the driver takes the break within the following hour"]},"x":{"it":"Se subito dopo le 4 ore e mezza inizia un riposo giornaliero o settimanale, la pausa non serve più, perché il riposo è comunque più lungo. Restare sotto le 9 ore o rimandare la pausa non conta.","en":"If a daily or weekly rest starts right after the 4½ hours, the break is no longer needed, because the rest is longer anyway. Staying under 9 hours or postponing the break does not count."},"src":"ref18"},
{"c":"O","art":"Art. 8 cpv. 1","it":{"q":"Un conducente fraziona la pausa in due parti prima di 4 ore e mezza di guida. Ogni parte deve durare almeno...","a":["20 minuti","10 minuti","45 minuti"]},"en":{"q":"A driver splits the break into two parts before 4½ hours of driving. Each part must last at least...","a":["20 minutes","10 minutes","45 minutes"]},"x":{"it":"Prima delle 4 ore e mezza la pausa può essere divisa in due parti, ma ognuna deve durare almeno 20 minuti. Parti più corte non valgono come pausa.","en":"Before the 4½ hours the break may be split into two parts, but each part must last at least 20 minutes. Shorter parts do not count as a break."},"src":"ref19"},
{"c":"O","art":"Art. 8","it":{"q":"Lo scopo della pausa di guida è principalmente quello di...","a":["Contrastare la stanchezza e mantenere il conducente vigile","Permettere il reset del tassametro tra le corse","Dare tempo al datore di lavoro di controllare il veicolo"]},"en":{"q":"The purpose of the driving break is primarily to...","a":["Counter fatigue and keep the driver alert","Allow the taximeter to be reset between trips","Give the employer time to check the vehicle"]},"x":{"it":"Dopo ore al volante l'attenzione cala. La pausa di guida serve a recuperare e a restare vigili; non ha niente a che fare con il tassametro o con i controlli del datore di lavoro.","en":"After hours at the wheel your concentration drops. The driving break lets you recover and stay alert; it has nothing to do with the taximeter or with checks by the employer."},"src":"ref20"},
{"c":"O","art":"Art. 5 cpv. 1","it":{"q":"Qual è il tempo DI LAVORO settimanale massimo (Arbeitszeit) per un conducente DIPENDENTE in un'azienda di taxi?","a":["53 ore","45 ore","48 ore"]},"en":{"q":"What is the maximum weekly WORKING time for an EMPLOYED driver in a taxi business?","a":["53 hours","45 hours","48 hours"]},"x":{"it":"Un dipendente di un'azienda di taxi può lavorare al massimo 53 ore a settimana. 48 ore valgono fuori dalle aziende di taxi, e 45 ore sono il limite del solo tempo di guida.","en":"An employee of a taxi business may work at most 53 hours a week. 48 hours applies outside taxi businesses, and 45 hours is the limit for driving time alone."},"src":"ref21"},
{"c":"O","art":"Art. 5 cpv. 1","it":{"q":"AL DI FUORI delle aziende di taxi, il tempo DI LAVORO settimanale massimo per un conducente dipendente è...","a":["48 ore","53 ore","56 ore"]},"en":{"q":"OUTSIDE taxi businesses, the maximum weekly WORKING time for an employed driver is...","a":["48 hours","53 hours","56 hours"]},"x":{"it":"Fuori dalle aziende di taxi il limite del tempo di lavoro è di 48 ore a settimana. Le 53 ore valgono solo nelle aziende di taxi, e 56 ore non è un limite dell'OLR 2.","en":"Outside taxi businesses the working-time limit is 48 hours a week. The 53 hours apply only in taxi businesses, and 56 hours is not an OLR 2 limit at all."},"src":"ref22"},
{"c":"O","art":"Art. 5 / Art. 2 lett. g","it":{"q":"Per un conducente INDIPENDENTE, il tempo di lavoro è...","a":["Non limitato dall'OLR 2 (ma restano validi tempo di guida, pause e riposo)","Limitato a 53 ore a settimana, come per i conducenti dipendenti","Limitato a 48 ore a settimana compreso il tempo di attesa"]},"en":{"q":"For a SELF-EMPLOYED driver, the working time is...","a":["Not limited by the OLR 2 (but driving time, breaks and rest still apply)","Limited to 53 hours per week, like for employed drivers","Limited to 48 hours per week including the waiting time"]},"x":{"it":"L'OLR 2 limita il tempo di lavoro solo ai dipendenti. L'indipendente non ha un massimo di ore di lavoro, ma deve comunque rispettare il tempo di guida, le pause di guida e i riposi.","en":"OLR 2 limits working time only for employees. A self-employed driver has no maximum working hours, but must still respect driving time, driving breaks and rest periods."},"src":"ref23"},
{"c":"O","art":"Art. 8 cpv. 2","it":{"q":"Al più tardi dopo quanto tempo di lavoro un conducente dipendente deve fare una pausa DI LAVORO (Arbeitspause)?","a":["Dopo 5 ore e mezza di lavoro","Dopo 8 ore di lavoro","Dopo 4 ore e mezza di lavoro"]},"en":{"q":"At the latest after how much working time must an employed driver take a WORK break?","a":["After 5½ hours of working time","After 8 hours of working time","After 4½ hours of working time"]},"x":{"it":"Un dipendente non può lavorare più di 5 ore e mezza di seguito senza una pausa di lavoro. Le 4 ore e mezza riguardano invece la pausa di guida.","en":"An employee may not work more than 5½ hours in a row without a work break. The 4½ hours belong to the driving break instead."},"src":"ref24"},
{"c":"O","art":"Art. 8 cpv. 3 lett. a","it":{"q":"Per un tempo di lavoro giornaliero FINO A 7 ore, la pausa lavorativa minima è di...","a":["20 minuti","30 minuti","45 minuti"]},"en":{"q":"For a daily working time of UP TO 7 hours, the minimum work break is...","a":["20 minutes","30 minutes","45 minutes"]},"x":{"it":"Fino a 7 ore di lavoro al giorno bastano 20 minuti di pausa. I 30 minuti servono solo oltre le 7 ore (fino a 9), e 1 ora oltre le 9 ore.","en":"For up to 7 hours of work a day, a 20-minute break is enough. 30 minutes are needed only above 7 hours (up to 9), and 1 hour above 9 hours."},"src":"ref25"},
{"c":"O","art":"Art. 8 cpv. 3 lett. c","it":{"q":"Per un tempo di lavoro giornaliero SUPERIORE a 9 ore, la pausa lavorativa deve essere di...","a":["1 ora, oppure 2×30 minuti, oppure 3×20 minuti","45 minuti, oppure 2×25 minuti, oppure 3×15 minuti","30 minuti, oppure 2×15 minuti, oppure 3×10 minuti"]},"en":{"q":"For a daily working time of MORE THAN 9 hours, the work break must be...","a":["1 hour, or 2×30 minutes, or 3×20 minutes","45 minutes, or 2×25 minutes, or 3×15 minutes","30 minutes, or 2×15 minutes, or 3×10 minutes"]},"x":{"it":"Oltre le 9 ore di lavoro la pausa è di 1 ora in totale. Si può dividere in 2 parti da 30 minuti o in 3 parti da 20, ma nessuna parte può essere più corta di 20 minuti.","en":"Above 9 hours of work the break totals 1 hour. It may be split into 2 parts of 30 minutes or 3 parts of 20, but no part may be shorter than 20 minutes."},"src":"ref26"},
{"c":"O","art":"Art. 6 cpv. 1","it":{"q":"Il lavoro straordinario ordinario è limitato a quante ore a settimana?","a":["4 ore a settimana","8 ore a settimana","2 ore a settimana"]},"en":{"q":"How many hours of normal overtime are allowed per week?","a":["4 hours per week","8 hours per week","2 hours per week"]},"x":{"it":"Lo straordinario normale è di al massimo 4 ore a settimana oltre il tempo di lavoro massimo. Solo nei periodi di attività eccezionale se ne possono aggiungere altre 2.","en":"Normal overtime is at most 4 hours a week on top of the maximum working time. Only in exceptionally busy periods may 2 more hours be added."},"src":"ref27"},
{"c":"O","art":"Art. 6 cpv. 1","it":{"q":"Il lavoro straordinario per anno civile non può superare...","a":["208 ore","300 ore","150 ore"]},"en":{"q":"Overtime per calendar year may not exceed...","a":["208 hours","300 hours","150 hours"]},"x":{"it":"In un anno civile sono ammesse al massimo 208 ore di straordinario. È facile da ricordare: 52 settimane × 4 ore a settimana = 208.","en":"At most 208 hours of overtime are allowed in a calendar year. It is easy to remember: 52 weeks × 4 hours a week = 208."},"src":"ref28"},
{"c":"O","art":"Art. 9 cpv. 1","it":{"q":"Qual è il riposo giornaliero minimo ordinario?","a":["11 ore consecutive","9 ore consecutive","12 ore consecutive"]},"en":{"q":"What is the normal minimum daily rest?","a":["11 consecutive hours","9 consecutive hours","12 consecutive hours"]},"x":{"it":"Il riposo giornaliero normale è di 11 ore di seguito. Le 9 ore sono il riposo ridotto (ammesso 3 volte a settimana) e le 12 ore valgono solo se il riposo è diviso in parti.","en":"The normal daily rest is 11 hours in a row. 9 hours is the reduced rest (allowed 3 times a week) and 12 hours applies only when the rest is split into parts."},"src":"ref29"},
{"c":"O","art":"Art. 9 cpv. 1","it":{"q":"Il riposo giornaliero può essere ridotto a 9 ore al massimo quante volte a settimana?","a":["3 volte a settimana","1 volta a settimana","5 volte a settimana"]},"en":{"q":"How many times per week may the daily rest be reduced to 9 hours at most?","a":["3 times per week","Once per week","5 times per week"]},"x":{"it":"Il riposo di 11 ore può essere accorciato a 9 ore al massimo 3 volte per settimana. Negli altri giorni devono essere 11 ore piene.","en":"The 11-hour rest may be shortened to 9 hours at most 3 times a week. On the other days it must be the full 11 hours."},"src":"ref30"},
{"c":"O","art":"Art. 9 cpv. 1","it":{"q":"Un riposo giornaliero ridotto (9 ore) deve essere recuperato in seguito?","a":["No, un riposo giornaliero ridotto non deve essere recuperato","Sì, entro la fine della settimana successiva","Sì, ma solo nel caso dei conducenti dipendenti"]},"en":{"q":"Does a reduced daily rest of 9 hours have to be made up later?","a":["No, a reduced daily rest does not have to be made up","Yes, before the end of the following week","Yes, but only in the case of employed drivers"]},"x":{"it":"Le riduzioni a 9 ore (al massimo 3 a settimana) sono semplicemente permesse dall'OLR 2: le ore mancanti non vanno recuperate, né da dipendente né da indipendente.","en":"The reductions to 9 hours (at most 3 a week) are simply allowed by OLR 2: the missing hours do not have to be made up, whether you are employed or self-employed."},"src":"ref31"},
{"c":"O","art":"Art. 9 cpv. 1","it":{"q":"In ogni momento dell'attività professionale, quanta parte delle 24 ore precedenti deve essere stata riposo consecutivo?","a":["11 ore","8 ore","24 ore"]},"en":{"q":"At any time during professional activity, how many consecutive hours of rest must the driver have had within the previous 24 hours?","a":["11 hours","8 hours","24 hours"]},"x":{"it":"In qualsiasi momento in cui lavori, guardando le 24 ore precedenti devi trovare 11 ore di riposo di seguito. È lo stesso riposo giornaliero di 11 ore, visto «all'indietro».","en":"At any moment while you are working, looking back over the previous 24 hours there must be 11 hours of rest in a row. It is the same 11-hour daily rest, seen “backwards”."},"src":"ref32"},
{"c":"O","art":"Art. 9 cpv. 2","it":{"q":"Se il riposo giornaliero è frazionato nelle 24 ore, quante parti sono ammesse e quanto deve durare una parte?","a":["Fino a 3 parti: una parte di almeno 8 ore, nessuna parte sotto 1 ora, e in totale almeno 12 ore","Fino a 3 parti: una parte di almeno 6 ore, nessuna parte sotto 30 minuti, in totale almeno 10 ore","Fino a 2 parti: una parte di almeno 9 ore, nessuna parte sotto 2 ore, in totale almeno 11 ore"]},"en":{"q":"If the daily rest is split within 24 hours, how many parts are allowed and how long must they be?","a":["Up to 3 parts: one part of at least 8 hours, no part under 1 hour, and at least 12 hours in total","Up to 3 parts: one part of at least 6 hours, no part under 30 minutes, at least 10 hours in total","Up to 2 parts: one part of at least 9 hours, no part under 2 hours, at least 11 hours in total"]},"x":{"it":"Il riposo diviso ha condizioni che valgono tutte insieme: al massimo 3 parti, una parte di almeno 8 ore, nessuna parte sotto 1 ora. In cambio il totale sale da 11 a 12 ore.","en":"A split rest has conditions that must all be met together: at most 3 parts, one part of at least 8 hours, no part under 1 hour. In return the total goes up from 11 to 12 hours."},"src":"ref33"},
{"c":"O","art":"Art. 13","it":{"q":"Il tempo di riposo può essere sostituito da un pagamento (denaro) invece di essere effettivamente goduto.","a":["Falso – il riposo non può essere sostituito con denaro (divieto di indennizzo)","Vero – se il conducente acconsente al pagamento per iscritto","Vero – ma solo nel caso dei conducenti indipendenti"]},"en":{"q":"May rest time be paid out in money instead of being taken?","a":["No – rest may not be replaced by money (ban on compensation)","Yes – if the driver agrees to the payment in writing","Yes – but only in the case of self-employed drivers"]},"x":{"it":"Il riposo serve alla salute e alla sicurezza, quindi va fatto davvero e non può essere «comprato» con denaro, nemmeno se il conducente è d'accordo. L'unica eccezione è la fine del rapporto di lavoro.","en":"Rest is there for health and safety, so it must really be taken and cannot be “bought” with money, even if the driver agrees. The only exception is when the employment ends."},"src":"ref34"},
{"c":"O","art":"Art. 11 cpv. 1","it":{"q":"Un conducente DIPENDENTE deve avere un giorno di riposo settimanale di almeno...","a":["24 ore consecutive","12 ore consecutive","48 ore consecutive"]},"en":{"q":"An EMPLOYED driver must have a weekly rest day of at least...","a":["24 consecutive hours","12 consecutive hours","48 consecutive hours"]},"x":{"it":"Il dipendente ha diritto ogni settimana a un giorno di riposo di almeno 24 ore di seguito. A questo si aggiunge il riposo giornaliero, subito prima o subito dopo.","en":"An employee is entitled every week to a rest day of at least 24 hours in a row. The daily rest is added to it, immediately before or after."},"src":"ref35"},
{"c":"O","art":"Art. 11 cpv. 4","it":{"q":"Un conducente INDIPENDENTE deve, nell'arco di due settimane, prendere quanti giorni di riposo?","a":["Due giorni di riposo di almeno 24 ore consecutive ciascuno","Due giorni di riposo di almeno 12 ore consecutive ciascuno","Quattro giorni di riposo di almeno 8 ore consecutive ciascuno"]},"en":{"q":"How many rest days must a SELF-EMPLOYED driver take within two weeks?","a":["Two rest days of at least 24 consecutive hours each","Two rest days of at least 12 consecutive hours each","Four rest days of at least 8 consecutive hours each"]},"x":{"it":"L'indipendente può organizzarsi su due settimane: in questo periodo deve fare due giorni di riposo, ognuno di almeno 24 ore di seguito. Giorni di riposo più corti non valgono.","en":"A self-employed driver can plan over two weeks: in that period they must take two rest days, each of at least 24 hours in a row. Shorter rest days do not count."},"src":"ref36"},
{"c":"O","art":"Art. 11 cpv. 4","it":{"q":"Tra due giorni di riposo di un conducente indipendente, quanti giorni di attività professionale al massimo possono trascorrere?","a":["12 giorni","6 giorni","14 giorni"]},"en":{"q":"Between two rest days of a self-employed driver, how many days of professional activity may there be at most?","a":["12 days","6 days","14 days"]},"x":{"it":"Tra un giorno di riposo e l'altro l'indipendente può lavorare al massimo 12 giorni. Così può spostare i due giorni di riposo dentro le due settimane, ma non lavorare 14 giorni di fila.","en":"Between one rest day and the next a self-employed driver may work at most 12 days. This lets them move the two rest days around within the two weeks, but not work 14 days in a row."},"src":"ref37"},
{"c":"O","art":"Art. 11 cpv. 3","it":{"q":"Il giorno di riposo è considerato goduto in una domenica/festivo se almeno quante delle 24 ore vi cadono?","a":["18 ore","12 ore","24 ore"]},"en":{"q":"How many of the 24 hours of a rest day must fall on a Sunday or public holiday for it to count as taken on that day?","a":["18 hours","12 hours","24 hours"]},"x":{"it":"Il giorno di riposo vale come domenica o festivo se almeno 18 delle sue 24 ore cadono in quel giorno. Non devono essere tutte e 24, ma 12 sono troppo poche.","en":"The rest day counts as a Sunday or public holiday if at least 18 of its 24 hours fall on that day. It need not be all 24, but 12 is too few."},"src":"ref38"},
{"c":"O","art":"Art. 12 cpv. 1","it":{"q":"Chi ha diritto a una mezza giornata libera a settimana oltre al giorno di riposo settimanale?","a":["Un dipendente il cui lavoro è distribuito su più di 5 mattine e pomeriggi della settimana","Un dipendente il cui tempo di lavoro settimanale supera regolarmente le 45 ore","Ogni conducente dipendente, indipendentemente da come è distribuito il lavoro"]},"en":{"q":"Who is entitled to a free half-day per week in addition to the weekly rest day?","a":["An employee whose work is spread over more than 5 mornings and afternoons of the week","An employee whose weekly working time regularly exceeds 45 hours over the whole week","Every employed driver, regardless of how the work is distributed over the week"]},"x":{"it":"Dipende da come è distribuito il lavoro, non dal numero di ore: la mezza giornata libera spetta al dipendente che lavora su più di 5 mattine e pomeriggi della settimana.","en":"It depends on how the work is spread, not on the number of hours: the free half-day goes to an employee whose work is spread over more than 5 mornings and afternoons of the week."},"src":"ref39"},
{"c":"O","art":"Art. 12 cpv. 3","it":{"q":"La mezza giornata libera consiste in 5 ore consecutive tra quali orari?","a":["Tra le 07:00 e le 18:00","Tra le 00:00 e le 05:00","Tra le 18:00 e le 23:00"]},"en":{"q":"The free half-day consists of 5 consecutive hours between which times?","a":["Between 07:00 and 18:00","Between 00:00 and 05:00","Between 18:00 and 23:00"]},"x":{"it":"La mezza giornata libera sono 5 ore di seguito durante il giorno, cioè tra le 07:00 e le 18:00. Ore libere di notte o di sera non valgono come mezza giornata.","en":"The free half-day is 5 hours in a row during the daytime, that is between 07:00 and 18:00. Free hours at night or in the evening do not count as a half-day."},"src":"ref40"},
{"c":"O","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Per un tassista DIPENDENTE, il tempo trascorso in attesa dei clienti restando a disposizione del datore di lavoro conta come...","a":["Tempo di lavoro","Tempo di riposo","Una pausa di guida"]},"en":{"q":"For an EMPLOYED taxi driver, time spent waiting for customers while available for the employer counts as...","a":["Working time","Rest time","A driving break"]},"x":{"it":"Finché aspetti i clienti e resti a disposizione del datore di lavoro stai lavorando, anche se il taxi è fermo. Non è riposo e non è una pausa, perché non puoi disporre liberamente del tuo tempo.","en":"While you wait for customers and remain at the employer's disposal you are working, even if the taxi is standing still. It is neither rest nor a break, because you are not free to use the time as you wish."},"src":"ref41"},
{"c":"O","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Il tempo di disponibilità (Bereitschaftszeit) è descritto meglio come...","a":["Tempo in cui il conducente non guida ma deve restare disponibile a lavorare","Tempo in cui il conducente può lasciare il posto di lavoro e disporre liberamente del tempo","Tempo tra due turni che il conducente trascorre a casa"]},"en":{"q":"Standby time is best described as...","a":["Time when the driver is not driving but must remain available to work","Time when the driver may leave the workplace and use the time freely","Time between two shifts that the driver spends at home"]},"x":{"it":"Disponibilità vuol dire che non guidi ma devi restare pronto a lavorare. Se potessi andartene e usare il tempo liberamente, sarebbe una pausa o un riposo.","en":"Standby means you are not driving but must stay ready to work. If you could leave and use the time freely, it would be a break or rest instead."},"src":"ref42"},
{"c":"O","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Perché il tempo di attesa è rilevante per i limiti di un conducente dipendente?","a":["Perché conta ai fini del tempo di lavoro massimo, non come riposo","Perché conta come tempo di riposo e allunga la giornata lavorativa","Perché conta come pausa di guida e sostituisce i 45 minuti"]},"en":{"q":"Why does waiting time matter for an employed driver's limits?","a":["Because it counts toward the maximum working time, not as rest","Because it counts as rest time and extends the working day","Because it counts as a driving break and replaces the 45 minutes"]},"x":{"it":"Per il dipendente l'attesa entra nelle ore di lavoro della settimana (massimo 53 in un'azienda di taxi). Non è riposo e non sostituisce la pausa di guida di 45 minuti.","en":"For an employee, waiting counts towards the week's working hours (maximum 53 in a taxi business). It is not rest, and it does not replace the 45-minute driving break."},"src":"ref43"},
{"c":"C","art":"Art. 17","it":{"q":"Un conducente indipendente registra i suoi tempi in un...","a":["Libretto di lavoro (Arbeitsbuch)","Rapporto settimanale (Wochenrapport)","Libretto di manutenzione del veicolo"]},"en":{"q":"A self-employed driver records their times in a...","a":["Work record book","Weekly report","Vehicle service booklet"]},"x":{"it":"Ogni conducente, anche indipendente, annota i propri tempi nel libretto di lavoro personale. È questo il documento che viene controllato, non un rapporto qualsiasi o il libretto di manutenzione.","en":"Every driver, including the self-employed, records their times in their personal work record book. That is the document that gets checked, not some other report or the vehicle's service booklet."},"src":"ref44"},
{"c":"C","art":"Art. 18 cpv. 3","it":{"q":"Prima di iniziare la corsa, cosa deve annotare un conducente indipendente nel libretto di lavoro?","a":["Il riposo consecutivo prima dell'inizio, l'ora di inizio e il numero di targa","Il nome del cliente, la destinazione e la tariffa concordata","Il chilometraggio, il livello del carburante e lo stato del veicolo"]},"en":{"q":"Before starting the trip, what must a self-employed driver enter in the work record book?","a":["The rest taken before starting, the start time and the registration number","The customer's name, the destination and the agreed fare","The odometer reading, the fuel level and the vehicle's condition"]},"x":{"it":"Prima di partire si annota ciò che serve per controllare il riposo: quante ore di riposo di seguito hai fatto, a che ora inizi e con quale veicolo (targa). Clienti, tariffe e carburante non interessano l'OLR 2.","en":"Before setting off you note what is needed to check your rest: how many hours of rest in a row you had, what time you start and which vehicle (registration number). Customers, fares and fuel are of no interest to OLR 2."},"src":"ref45"},
{"c":"C","art":"Art. 18 cpv. 6","it":{"q":"Alla fine della giornata lavorativa, cosa deve annotare in più il conducente indipendente?","a":["Il tempo di guida totale e il nuovo chilometraggio","Le condizioni meteo e la situazione del traffico","I nomi di tutti i passeggeri trasportati quel giorno"]},"en":{"q":"At the end of the working day, what must the self-employed driver additionally record?","a":["The total driving time and the new odometer reading","The weather conditions and the traffic situation","The names of all passengers transported that day"]},"x":{"it":"A fine giornata l'indipendente completa il foglio con il tempo di guida totale e il nuovo chilometraggio, così si può verificare il limite di guida. Meteo e nomi dei passeggeri non c'entrano.","en":"At the end of the day the self-employed driver completes the sheet with the total driving time and the new mileage, so the driving limit can be checked. Weather and passenger names are irrelevant."},"src":"ref46"},
{"c":"C","art":"Art. 14","it":{"q":"Qual è lo scopo delle registrazioni dei tempi di guida/riposo?","a":["Permettere alle autorità di verificare il rispetto dell'OLR 2","Permettere al datore di lavoro di calcolare correttamente i salari","Fornire statistiche all'ufficio federale delle strade"]},"en":{"q":"What is the purpose of the driving and rest-time records?","a":["To allow the authorities to check compliance with the OLR 2","To let the employer calculate the wages correctly","To provide statistics for the Federal Roads Office"]},"x":{"it":"Le registrazioni sono mezzi di controllo: servono all'autorità per verificare che lavoro, guida e riposo rispettino l'OLR 2. Non servono a calcolare i salari o a fare statistiche.","en":"The records are means of control: they let the authority check that work, driving and rest comply with OLR 2. They are not for calculating wages or producing statistics."},"src":"ref47"},
{"c":"C","art":"Art. 14 / 16a","it":{"q":"Un tachigrafo digitale o registrazione equivalente serve principalmente a...","a":["Registrare in modo affidabile i periodi di guida, lavoro e riposo","Registrare il percorso effettuato e la velocità media","Registrare le tariffe e le distanze di ogni corsa"]},"en":{"q":"A digital tachograph or equivalent recording is used mainly to...","a":["Record driving, work and rest periods reliably","Record the route taken and the average speed","Record the fares and distances of each trip"]},"x":{"it":"Il tachigrafo registra in modo affidabile quando guidi, quando fai altri lavori e quando riposi, e così permette di controllare i tempi. Le tariffe sono compito del tassametro, non del tachigrafo.","en":"The tachograph reliably records when you drive, when you do other work and when you rest, so the times can be checked. Fares are the taximeter's job, not the tachograph's."},"src":"ref48"},
{"c":"C","art":"Art. 23","it":{"q":"Le registrazioni di tempo di lavoro, guida e riposo devono essere...","a":["Conservate e messe a disposizione per il controllo","Archiviate dal cantone per dieci anni","Distrutte non appena i salari sono stati pagati"]},"en":{"q":"Records of working, driving and rest time must be...","a":["Kept and made available for checks","Archived by the canton for ten years","Destroyed as soon as the wages have been paid"]},"x":{"it":"I mezzi di controllo devono restare in azienda ed essere mostrati all'autorità quando li chiede. Non li archivia il Cantone e non si possono buttare via dopo aver pagato i salari.","en":"The control records must be kept at the business and shown to the authority on request. The canton does not archive them, and they may not be thrown away once wages are paid."},"src":"ref49"},
{"c":"C","art":"Art. 22 cpv. 2","it":{"q":"Un dovere fondamentale del datore di lavoro secondo l'OLR 2 è...","a":["Vigilare sul rispetto delle norme su tempo di lavoro, guida e riposo","Pagare le multe ricevute dai conducenti in servizio","Controllare ogni mese le tariffe del tassametro"]},"en":{"q":"A key duty of the employer under the OLR 2 is to...","a":["Monitor that working, driving and rest-time rules are respected","Pay any fines the drivers receive while on duty","Check the taximeter tariffs every month"]},"x":{"it":"Il datore di lavoro deve sorvegliare in modo continuo che i suoi conducenti rispettino tempo di lavoro, guida e riposo. Pagare le multe o controllare le tariffe non sono doveri previsti dall'OLR 2.","en":"The employer must continuously make sure their drivers keep to the rules on working time, driving and rest. Paying fines or checking fares are not duties under OLR 2."},"src":"ref50"},
{"c":"C","art":"Art. 21 cpv. 1","it":{"q":"Il registro (Aufstellung) dei tempi tenuto dal datore di lavoro deve contenere, tra l'altro...","a":["Tempo di guida giornaliero, tempo di lavoro totale giornaliero/settimanale e straordinari","I salari mensili, le mance e le spese di servizio di ogni singolo conducente","Il consumo di carburante e gli intervalli di manutenzione di tutti i veicoli"]},"en":{"q":"The employer's register of times must contain, among other things...","a":["Daily driving time, total daily/weekly working time and overtime","The wages, tips and expenses of every driver","The fuel consumption and service intervals of the vehicles"]},"x":{"it":"Il registro serve a controllare i tempi di ogni conducente: guida giornaliera, lavoro totale del giorno e della settimana, straordinari. Salari, mance e carburante non c'entrano con l'OLR 2.","en":"The register is for checking each driver's times: daily driving, total work per day and per week, overtime. Wages, tips and fuel have nothing to do with OLR 2."},"src":"ref51"},
{"c":"C","art":"Art. 2 lett. h / Art. 31","it":{"q":"Chi è generalmente responsabile del controllo del rispetto delle norme su strada e nelle aziende?","a":["L'autorità cantonale di esecuzione competente","L'amministrazione federale delle dogane","I centri accreditati di controllo dei veicoli"]},"en":{"q":"Who is generally responsible for checking compliance on the road and in businesses?","a":["The competent cantonal enforcement authority","The federal customs administration","The accredited vehicle inspection centres"]},"x":{"it":"I controlli su strada e nelle aziende spettano ai Cantoni, che designano la propria autorità di esecuzione. La dogana e i centri di controllo dei veicoli non hanno questo compito.","en":"Checks on the road and in businesses are the job of the cantons, which each appoint their enforcement authority. Customs and vehicle inspection centres do not have this task."},"src":"ref52"},
{"c":"V","art":"OAC art. 25","it":{"q":"Quale esperienza di guida è normalmente richiesta prima di ottenere il B121 (trasporto professionale di persone)?","a":["Almeno 1 anno di esperienza in categoria B senza revoca della licenza","Almeno 3 anni di esperienza in categoria B senza alcuna multa","Almeno 2 anni di esperienza di guida in qualsiasi categoria"]},"en":{"q":"What driving experience is normally required before obtaining the B121 (professional passenger transport)?","a":["At least 1 year of category B experience without a licence withdrawal","At least 3 years of category B experience without any fines","At least 2 years of driving experience in any category"]},"x":{"it":"Per il trasporto professionale di persone serve almeno 1 anno di guida nella categoria B senza infrazioni che abbiano portato alla revoca della licenza. Non sono richiesti 2 o 3 anni.","en":"For professional passenger transport you need at least 1 year of driving in category B without an offence that led to withdrawal of the licence. 2 or 3 years are not required."},"src":"ref53"},
{"c":"V","art":"OAC art. 25","it":{"q":"Prima di iscriversi, il candidato deve normalmente superare una...","a":["Visita medica presso un medico riconosciuto","Solo esame della vista presso un ottico riconosciuto","Valutazione psicologica dell'idoneità"]},"en":{"q":"Before registering, the candidate normally must pass a...","a":["Medical examination by an approved physician","Eye test at a recognised optician only","Psychological aptitude assessment"]},"x":{"it":"Chi trasporta persone a titolo professionale deve dimostrare di essere idoneo alla guida con una visita medica completa presso un medico riconosciuto. Un solo esame della vista non basta.","en":"Anyone who carries passengers professionally must prove they are fit to drive with a full medical examination by a recognised doctor. An eye test alone is not enough."},"src":"ref54"},
{"c":"V","art":"OAC art. 27","it":{"q":"Ogni quanto viene ripetuta la visita medica di controllo FINO ai 50 anni?","a":["Ogni 5 anni","Ogni anno","Ogni 10 anni"]},"en":{"q":"How often must the medical check be repeated UP TO age 50?","a":["Every 5 years","Every year","Every 10 years"]},"x":{"it":"Fino ai 50 anni la visita medica di controllo si ripete ogni 5 anni. Dopo i 50 anni l'intervallo si accorcia a 3 anni.","en":"Up to the age of 50 the medical check is repeated every 5 years. After 50 the interval shortens to 3 years."},"src":"ref55"},
{"c":"V","art":"OAC art. 27","it":{"q":"DOPO i 50 anni, ogni quanto deve essere ripetuta la visita medica di controllo?","a":["Ogni 3 anni","Ogni 5 anni","Ogni anno"]},"en":{"q":"AFTER age 50, how often must the medical check be repeated?","a":["Every 3 years","Every 5 years","Every year"]},"x":{"it":"Dopo i 50 anni la visita medica di controllo si ripete ogni 3 anni, perché con l'età i controlli diventano più frequenti. Prima dei 50 anni basta ogni 5 anni.","en":"After the age of 50 the medical check is repeated every 3 years, because checks become more frequent with age. Before 50, every 5 years is enough."},"src":"ref56"},
{"c":"V","art":"OAC art. 25 / Art. 3 cpv. 2","it":{"q":"Il B121 autorizza il trasporto professionale di persone con veicoli fino a quanti posti IN TOTALE (conducente INCLUSO)?","a":["9 posti (8 passeggeri + conducente)","16 posti (15 passeggeri + conducente)","5 posti (4 passeggeri + conducente)"]},"en":{"q":"The B121 authorises professional passenger transport with vehicles up to how many seats IN TOTAL (driver INCLUDED)?","a":["9 seats (8 passengers + driver)","16 seats (15 passengers + driver)","5 seats (4 passengers + driver)"]},"x":{"it":"Il limite è di 8 passeggeri più il conducente, quindi 9 posti in totale. Qui la domanda conta anche il conducente: per questo la risposta è 9 e non 8.","en":"The limit is 8 passengers plus the driver, so 9 seats in total. This question counts the driver as well, which is why the answer is 9 and not 8."},"src":"ref57"},
{"c":"V","art":"Diritto cantonale","it":{"q":"Oltre a superare le tappe del B121, un conducente può inoltre necessitare, a seconda del cantone...","a":["Un'autorizzazione cantonale d'esercizio separata (conoscenze locali, regole locali, lingua)","Una concessione federale per il trasporto di persone rilasciata dall'UFT (esame federale, tariffe)","Un certificato federale di formazione commerciale completata (contabilità, lingua, tariffe)"]},"en":{"q":"Besides the B121 requirements, what may a driver also need, depending on the canton?","a":["A separate cantonal operating permit (local knowledge, local rules, language)","A federal passenger-transport concession issued by the FOT (federal exam, fares)","A federal certificate of completed commercial training (accounting, language, fares)"]},"x":{"it":"Il B121 è la parte federale. Cantoni e Comuni possono chiedere in più una propria autorizzazione per i taxi, per esempio con un esame sulla conoscenza della città, delle regole locali o della lingua.","en":"The B121 is the federal part. Cantons and municipalities can additionally require their own taxi permit, for example with a test on knowledge of the city, local rules or the language."},"src":"ref58"},
{"c":"C","art":"Art. 15 cpv. 1","it":{"q":"Mentre il conducente si trova nel veicolo o nelle sue vicinanze, come deve essere gestito il tachigrafo durante l'attività professionale?","a":["Sempre in funzione, in modo che guida, altro lavoro e pause siano registrati correttamente","In funzione solo con passeggeri a bordo; durante l'attesa al posteggio può essere fermato","In funzione solo nelle corse notturne; quelle diurne si annotano nel libretto di lavoro"]},"en":{"q":"While the driver is in or near the vehicle, how must the tachograph be handled during professional activity?","a":["Always running, so that driving, other work and breaks are recorded correctly","Running only with passengers on board; it may be stopped while waiting at the rank","Running only on night trips; daytime trips are noted in the work record book"]},"x":{"it":"Durante l'attività professionale il tachigrafo resta sempre in funzione, anche quando aspetti al posteggio, così vengono registrati guida, altri lavori e pause. Non si può fermarlo di giorno o quando non ci sono passeggeri.","en":"During professional activity the tachograph always stays switched on, also while you wait at the rank, so that driving, other work and breaks are recorded. You may not stop it in the daytime or when there are no passengers."},"src":"ref59"},
{"c":"C","art":"Art. 15 cpv. 1-2","it":{"q":"Perché un tassista indipendente deve azionare anche il selettore del tachigrafo durante l'attività professionale?","a":["Affinché sul foglio di registrazione si possano distinguere le corse in taxi dalle corse private","Affinché il tassametro e il tachigrafo mostrino sempre gli stessi totali di chilometri e di incassi","Affinché l'autorità possa verificare i percorsi effettuati e i chilometri percorsi con i clienti"]},"en":{"q":"Why must a self-employed taxi driver also operate the tachograph selector during professional activity?","a":["So that taxi trips and private trips can be told apart on the record sheet","So that the taximeter and the tachograph always show the same kilometres and fares","So that the authority can check the routes and kilometres driven with customers"]},"x":{"it":"L'indipendente usa lo stesso veicolo anche in privato. Con il selettore indica se sta lavorando oppure no, così sul foglio si distinguono le corse in taxi dalle corse private.","en":"A self-employed driver also uses the same vehicle privately. With the selector they show whether they are working or not, so the sheet separates taxi trips from private trips."},"src":"ref60"},
{"c":"C","art":"Art. 15 cpv. 2","it":{"q":"Durante le corse PRIVATE con il veicolo, il tachigrafo deve...","a":["Restare in funzione, impostato sulla posizione di pausa/riposo (\"0\" / simbolo della sedia)","Essere impostato sulla posizione di guida, esattamente come nelle corse professionali","Essere sigillato dal datore di lavoro fino alla prossima corsa professionale"]},"en":{"q":"During PRIVATE trips with the vehicle, the tachograph must...","a":["Keep running, set to the break/rest position (“0” / chair symbol)","Be set to the driving position, exactly like on professional trips","Be sealed by the employer until the next professional trip"]},"x":{"it":"Anche nelle corse private il tachigrafo non si spegne: resta in funzione, ma sulla posizione di pausa/riposo, così la corsa non viene contata come guida professionale.","en":"The tachograph is not switched off on private trips either: it keeps running, but in the break/rest position, so the trip is not counted as professional driving."},"src":"ref61"},
{"c":"C","art":"Art. 16 cpv. 2","it":{"q":"Con il tachigrafo CH (disco legato al veicolo), quanti fogli di registrazione si possono usare per veicolo e per giorno?","a":["Un solo foglio per veicolo al giorno; ogni foglio può essere usato una sola volta","Un solo foglio per conducente a settimana; ogni foglio può essere riutilizzato","Due fogli per veicolo al giorno: uno per il turno di giorno e uno per la notte"]},"en":{"q":"With a CH tachograph (sheet tied to the vehicle), how many record sheets may be used per vehicle and per day?","a":["Only one sheet per vehicle per day; each sheet may be used only once","Only one sheet per driver per week; each sheet may be used again","Two sheets per vehicle per day: one for the day shift and one for the night"]},"x":{"it":"Con il tachigrafo CH il foglio appartiene al veicolo: uno solo per veicolo e per giorno, e non si riutilizza mai. Se lo usano due conducenti, si distinguono con le posizioni 1 e 2.","en":"With the CH tachograph the sheet belongs to the vehicle: only one per vehicle per day, and it is never reused. If two drivers use it, they are told apart by positions 1 and 2."},"src":"ref62"},
{"c":"C","art":"Art. 16 cpv. 1","it":{"q":"Quali fogli di registrazione devono essere presenti sul veicolo?","a":["Fogli vergini a sufficienza e il foglio del giorno precedente, se era feriale (o una copia)","Tutti i fogli compilati del mese in corso e fogli vergini sufficienti per una settimana","I fogli compilati degli ultimi tre mesi; i fogli vergini restano presso il datore di lavoro"]},"en":{"q":"Which record sheets must be carried on the vehicle?","a":["Enough blank sheets and the previous day's sheet, if it was a working day (or a copy)","All completed sheets of the current month and enough blank sheets for one week","The completed sheets of the last three months; blank sheets stay with the employer"]},"x":{"it":"Servono fogli vergini di riserva per poter continuare a registrare, più il foglio del giorno prima (o una copia) se era un giorno feriale, così al controllo si vede anche quel giorno.","en":"You need spare blank sheets so you can keep recording, plus the previous day's sheet (or a copy) if it was a working day, so that a check can see that day too."},"src":"ref63"},
{"c":"C","art":"OLR 1 art. 14c cpv. 1bis (via art. 16a)","it":{"q":"A un controllo stradale, cosa deve poter presentare il conducente di un taxi con tachigrafo UE analogico?","a":["Il disco del giorno in corso, i dischi dei 28 giorni precedenti e la carta del conducente","Il disco del giorno in corso, i dischi dei 56 giorni precedenti e la carta del conducente","Soltanto il disco del giorno in corso; i dischi precedenti restano presso il datore di lavoro"]},"en":{"q":"At a roadside check, what must the driver of a taxi with an analogue EU tachograph be able to present?","a":["The current day's sheet, the sheets of the previous 28 days and the driver card","The current day's sheet, the sheets of the previous 56 days and the driver card","Only the current day's sheet; the earlier sheets stay with the employer"]},"x":{"it":"Per un taxi con tachigrafo UE analogico vanno mostrati il disco di oggi, quelli dei 28 giorni precedenti e la carta del conducente, se ne hai una. I 56 giorni valgono solo per autocarri e autobus.","en":"For a taxi with an analogue EU tachograph you must show today's sheet, those of the previous 28 days and the driver card, if you have one. The 56 days apply only to lorries and buses."},"src":"ref64"},
{"c":"C","art":"Art. 18 cpv. 4","it":{"q":"Cosa deve fare il conducente se il tachigrafo del veicolo è difettoso?","a":["Compilare i fogli giornalieri del libretto di lavoro finché il tachigrafo non viene riparato","Continuare a guidare normalmente; la riparazione può attendere il prossimo servizio","Fermare subito tutte le corse professionali finché non è stato riparato"]},"en":{"q":"What must the driver do if the vehicle's tachograph is defective?","a":["Fill in the daily sheets of the work record book until the tachograph is repaired","Continue driving normally; the repair can wait until the next service","Stop all professional trips immediately until it has been repaired"]},"x":{"it":"Con il tachigrafo guasto puoi continuare a lavorare, ma devi registrare i tempi a mano: compili i fogli giornalieri del libretto di lavoro finché l'apparecchio non è riparato.","en":"With a broken tachograph you may keep working, but you must record the times by hand: you fill in the daily sheets of the work record book until the device is repaired."},"src":"ref65"},
{"c":"C","art":"Art. 17 cpv. 1","it":{"q":"Quali sono i doveri del conducente riguardo al libretto di lavoro durante le corse?","a":["Portarlo con sé, presentarlo ai controlli e compilarlo in modo leggibile e indelebile","Tenerlo presso la sede dell'azienda e aggiornarlo alla fine di ogni settimana","Portare con sé solo una copia; l'originale resta sempre presso il datore di lavoro"]},"en":{"q":"What are the driver's duties regarding the work record book during trips?","a":["Carry it, present it at checks and fill it in legibly and indelibly","Keep it at the business premises and bring it up to date every week","Carry only a copy; the original always stays with the employer"]},"x":{"it":"Il libretto di lavoro va sempre portato con sé durante le corse e mostrato ai controlli. Le iscrizioni devono essere leggibili e non cancellabili, quindi a penna e non a matita.","en":"The work record book must always be carried on trips and shown at checks. Entries must be legible and impossible to erase, so in pen rather than pencil."},"src":"ref66"},
{"c":"C","art":"Art. 17 cpv. 3","it":{"q":"Un conducente lavora per due aziende di taxi diverse. Quanti libretti di lavoro può usare contemporaneamente?","a":["Un solo libretto di lavoro – è personale e non trasferibile","Due libretti di lavoro: un originale e una copia di riserva","Nessuno – in questo caso le registrazioni le tengono i datori di lavoro"]},"en":{"q":"A driver works for two different taxi companies. How many work record books may they use at the same time?","a":["Only one work record book – it is personal and not transferable","Two work record books: one original and one backup copy","None – in this case the employers keep the records"]},"x":{"it":"Il libretto di lavoro è personale: ogni conducente ne usa uno solo alla volta e non lo presta a nessuno. Così tutte le ore, anche presso due aziende, finiscono nello stesso libretto.","en":"The work record book is personal: each driver uses only one at a time and never lends it to anyone. That way all hours, even with two businesses, end up in the same book."},"src":"ref67"},
{"c":"C","art":"Art. 18 cpv. 4","it":{"q":"Oltre al foglio settimanale, quando il conducente deve compilare anche i fogli giornalieri del libretto di lavoro?","a":["Quando il tachigrafo non funziona o il veicolo è già stato guidato da due conducenti quel giorno","In ogni giorno lavorativo senza eccezione, in aggiunta ai fogli di registrazione del tachigrafo","Ogni volta che il tempo di lavoro giornaliero supera le 9 ore o il giorno di riposo è stato rinviato"]},"en":{"q":"In addition to the weekly sheet, when must the driver also fill in the daily sheets of the work record book?","a":["When the tachograph is not working or the vehicle has already been driven by two drivers that day","On every working day without exception, in addition to the record sheets of the tachograph","Whenever the daily working time exceeds 9 hours or the weekly rest day has been postponed"]},"x":{"it":"I fogli giornalieri servono quando il tachigrafo non può registrare per te: se è guasto, oppure se il disco è già occupato da due conducenti e tu sei il terzo della giornata.","en":"The daily sheets are needed when the tachograph cannot record for you: if it is broken, or if the sheet is already taken by two drivers and you are the third of the day."},"src":"ref68"},
{"c":"C","art":"Art. 18 cpv. 7","it":{"q":"Entro quando un conducente dipendente deve consegnare al datore di lavoro i fogli settimanali e giornalieri compilati del libretto di lavoro?","a":["Al più tardi il primo giorno lavorativo della settimana successiva","Al più tardi alla fine della giornata lavorativa in corso","Entro un mese dalla compilazione del foglio settimanale"]},"en":{"q":"By when must an employed driver hand the completed weekly and daily sheets of the work record book to the employer?","a":["At the latest on the first working day of the following week","At the latest at the end of the current working day","Within one month of completing the weekly sheet"]},"x":{"it":"I fogli della settimana si consegnano al datore di lavoro al più tardi il primo giorno lavorativo della settimana dopo. Chi torna dall'estero li consegna al rientro in Svizzera.","en":"The week's sheets are handed to the employer at the latest on the first working day of the following week. Anyone coming back from abroad hands them in on return to Switzerland."},"src":"ref69"},
{"c":"C","art":"Art. 19 cpv. 1","it":{"q":"A quale condizione l'autorità di esecuzione può esonerare un conducente dalla compilazione dei fogli settimanali del libretto di lavoro?","a":["Se i dati richiesti sono annotati ogni giorno in rapporti giornalieri interni all'azienda","Se il conducente lavora per la stessa azienda di taxi da più di cinque anni","Se il datore di lavoro conferma per iscritto i tempi di lavoro ogni settimana"]},"en":{"q":"Under what condition can the enforcement authority exempt a driver from filling in the weekly sheets of the work record book?","a":["If the required data are entered every day in company-internal daily reports","If the driver has worked for the same taxi business for more than five years","If the employer confirms the working times in writing every week"]},"x":{"it":"L'esonero dai fogli settimanali è possibile solo se le stesse informazioni vengono già annotate ogni giorno nei rapporti giornalieri interni dell'azienda. L'anzianità o una conferma del datore di lavoro non bastano.","en":"Exemption from the weekly sheets is possible only if the same information is already noted every day in the business's internal daily reports. Length of service or an employer's confirmation is not enough."},"src":"ref70"},
{"c":"C","art":"Art. 23 cpv. 3","it":{"q":"Per quanto tempo datori di lavoro e conducenti indipendenti devono conservare i mezzi di controllo (fogli di registrazione, annotazioni del libretto di lavoro, registri) presso la sede aziendale?","a":["2 anni, in ordine cronologico e ordinati per veicolo","1 anno, in ordine cronologico e ordinati per conducente","5 anni, insieme ai documenti contabili"]},"en":{"q":"How long must employers and self-employed drivers keep the control documents (record sheets, work record book entries, registers) at the place of business?","a":["2 years, in chronological order and sorted by vehicle","1 year, in chronological order and sorted by driver","5 years, together with the accounting records"]},"x":{"it":"I mezzi di controllo si conservano 2 anni in azienda, in ordine di data e separati per veicolo. Solo i dischi di un tachigrafo UE si conservano 3 anni e ordinati per conducente.","en":"Control records are kept for 2 years at the business, in date order and sorted by vehicle. Only the sheets of an EU tachograph are kept for 3 years and sorted by driver."},"src":"ref71"},
{"c":"C","art":"OLR 1 art. 13b","it":{"q":"Quanto è valida la carta del conducente per il tachigrafo digitale?","a":["5 anni","1 anno","10 anni"]},"en":{"q":"How long is a driver card for the digital tachograph valid?","a":["5 years","1 year","10 years"]},"x":{"it":"La carta del conducente per il tachigrafo digitale vale 5 anni; poi bisogna richiederne una nuova. È personale e non si presta a nessuno.","en":"The driver card for the digital tachograph is valid for 5 years; after that a new one must be applied for. It is personal and is never lent to anyone."},"src":"ref72"},
{"c":"O","art":"Art. 20 cpv. 1","it":{"q":"In caso di emergenza (forza maggiore, prestazione di soccorso), il conducente può derogare alle norme su tempo di lavoro, guida e riposo...","a":["Nella misura in cui l'emergenza lo richiede effettivamente e la sicurezza stradale lo consente","Nella misura in cui l'orario concordato con il cliente lo rende strettamente necessario","Solo dopo aver informato telefonicamente l'autorità cantonale di esecuzione competente"]},"en":{"q":"In an emergency (force majeure, giving assistance), the driver may deviate from the working, driving and rest time rules...","a":["As far as the emergency actually requires and road safety allows","As far as the customer's schedule makes it necessary","Only after informing the cantonal authority by telephone"]},"x":{"it":"In un'emergenza vera (forza maggiore, soccorso) si può derogare, ma solo quanto serve davvero e solo se la sicurezza stradale non ne soffre. I desideri di un cliente non sono un'emergenza.","en":"In a real emergency (force majeure, giving help) you may deviate, but only as far as is really needed and only if road safety does not suffer. A customer's wishes are not an emergency."},"src":"ref73"},
