{"c":"C","art":"OLR 1 art. 14a cpv. 3","it":{"q":"Il tachigrafo smette di registrare correttamente durante la giornata. Cosa deve fare il conducente con i dati mancanti?","a":["Annotarli a mano sul disco o su un foglio allegato","Annotarli a fine mese nel registro del datore","Farli stimare e confermare dal datore di lavoro"]},"en":{"q":"The tachograph stops recording correctly during the day. What must the driver do with the missing data?","a":["Write them by hand on the sheet or an attached sheet","Write them in the employer's register at month end","Have the employer estimate and confirm them"]},"x":{"it":"Se il tachigrafo non registra bene, i tempi mancanti li scrivi tu a mano sul disco, oppure su un foglio a parte che resta allegato al disco. Non si aspetta fine mese e non si fanno stime.","en":"If the tachograph is not recording properly, you write the missing times by hand on the sheet yourself, or on a separate sheet that stays attached to it. You do not wait until the end of the month or use estimates."},"src":"ref85"},
{"c":"C","art":"Art. 16 cpv. 1","it":{"q":"Con il tachigrafo CH (disco legato al veicolo), quali dischi il conducente deve poter presentare a un controllo?","a":["Il disco di oggi e quello di ieri, se era feriale","Il disco di oggi e quelli dei 28 giorni precedenti","Soltanto il disco di oggi, senza quelli precedenti"]},"en":{"q":"With a CH tachograph (sheet tied to the vehicle), which sheets must the driver be able to present at a check?","a":["Today's sheet and yesterday's, if it was a working day","Today's sheet and those of the previous 28 days","Only today's sheet, without the earlier ones"]},"x":{"it":"Con il tachigrafo CH basta il disco di oggi più quello di ieri (o una copia), se ieri era un giorno feriale. I 28 giorni e la carta del conducente riguardano il tachigrafo UE.","en":"With the CH tachograph today's sheet is enough, plus yesterday's (or a copy) if yesterday was a working day. The 28 days and the driver card concern the EU tachograph."},"src":"ref86"},
{"c":"C","art":"Art. 16 cpv. 4","it":{"q":"Cos'è il blocchetto settimanale (per l'odocronografo settimanale)?","a":["Un blocchetto di 5, 6 o 7 dischi usati di seguito","Un unico grande disco con sette anelli concentrici","Una scheda digitale letta dal datore ogni lunedì"]},"en":{"q":"What is the weekly booklet used with a 7-day tachograph?","a":["A pack of 5, 6 or 7 sheets used one after another","A single large sheet with seven concentric rings","A digital card the employer reads every Monday"]},"x":{"it":"Il blocchetto settimanale è un pacchetto di 5, 6 o 7 dischi messi uno sopra l'altro: l'apparecchio passa da solo da un disco al successivo e ogni disco inizia a mezzanotte.","en":"The weekly booklet is a pack of 5, 6 or 7 sheets stacked on top of each other: the device moves on from one sheet to the next by itself and each sheet starts at midnight."},"src":"ref87"},
{"c":"C","art":"Art. 16 cpv. 5","it":{"q":"Come si riconosce il disco diagrammale speciale per l'odocronografo settimanale?","a":["Pausa di circa 30° e rotazione di 26 ore","Pausa di circa 90° e rotazione di 24 ore","Grande il doppio e stampato su carta arancione"]},"en":{"q":"How can you recognise the special daily sheet for a 7-day tachograph?","a":["A gap of about 30° and a 26-hour rotation","A gap of about 90° and a 24-hour rotation","Twice as large and printed on orange paper"]},"x":{"it":"Il disco speciale si riconosce da tre segni: uno spazio vuoto di circa 30°, una rotazione di 26 ore invece di 24 e la scritta «1 disco giornaliero per apparato di 7 giorni».","en":"The special sheet has three tell-tale signs: an empty gap of about 30°, a 26-hour rotation instead of 24, and the marking “1 daily sheet for 7-day device”."},"src":"ref88"},
{"c":"C","art":"Simboli del tachigrafo","it":{"q":"Nel libretto di lavoro e nelle registrazioni del tachigrafo, il simbolo del volante indica...","a":["Il tempo di guida","Ogni altro tempo di lavoro","Le pause e il tempo di riposo"]},"en":{"q":"In the work record book and on tachograph records, the steering-wheel symbol stands for...","a":["Driving time","All other working time","Breaks and rest time"]},"x":{"it":"Il volante è il simbolo della guida. Gli altri lavori (martelli incrociati), la disponibilità (quadrato barrato) e le pause hanno ciascuno un simbolo diverso.","en":"The steering wheel is the symbol for driving. Other work (crossed hammers), availability (crossed square) and breaks each have a different symbol."},"src":"ref89"},
{"c":"C","art":"Simboli del tachigrafo","it":{"q":"Il simbolo del quadrato barrato nelle registrazioni del tachigrafo indica...","a":["La disponibilità: attesa, secondo autista","Il tempo di guida: veicolo in movimento","Gli altri lavori: pulizia, rifornimento"]},"en":{"q":"The crossed-square symbol on tachograph records stands for...","a":["Availability: waiting, second driver","Driving time: the vehicle is moving","Other work: cleaning, refuelling"]},"x":{"it":"Il quadrato barrato indica la disponibilità: non guidi e non lavori attivamente, ma sei pronto a farlo (attesa, secondo autista in cabina). La guida ha il volante e gli altri lavori i martelli incrociati.","en":"The crossed square stands for availability: you are not driving or actively working, but ready to (waiting, second driver in the cab). Driving has the steering wheel and other work the crossed hammers."},"src":"ref90"},
{"c":"C","art":"Art. 18 cpv. 5","it":{"q":"Come devono essere fatte le iscrizioni sul foglio giornaliero del libretto di lavoro?","a":["Subito a ogni cambio di attività, al quarto d'ora","A fine giornata, con i tempi arrotondati all'ora","Solo per la guida; pause e altri lavori no"]},"en":{"q":"How must the entries on the daily sheet of the work record book be made?","a":["At once at each change of activity, to the quarter hour","At the end of the day, rounded to the full hour","Only for driving; not for breaks and other work"]},"x":{"it":"Il foglio giornaliero sostituisce il tachigrafo, quindi va aggiornato subito a ogni cambio di attività (guida, lavoro, pausa), senza buchi e con precisione al quarto d'ora.","en":"The daily sheet stands in for the tachograph, so it must be updated straight away at every change of activity (driving, work, break), without gaps and accurate to the quarter-hour."},"src":"ref91"},
{"c":"C","art":"Art. 18 cpv. 2","it":{"q":"Cosa deve iscrivere ogni giorno un conducente DIPENDENTE nel foglio settimanale?","a":["Riposo precedente, inizio, targa e fine del lavoro","Ore lavorate, straordinari, targa e firma","Incassi, mance, chilometri e fine del lavoro"]},"en":{"q":"What must an EMPLOYED driver enter in the weekly sheet each day?","a":["Previous rest, start, registration number and end time","Hours worked, overtime, registration number, signature","Takings, tips, kilometres and end time"]},"x":{"it":"Nel foglio settimanale il dipendente scrive ogni giorno il riposo fatto prima, l'ora di inizio, la targa prima di ogni corsa e l'ora di fine lavoro. Incassi, mance e firme non sono richiesti.","en":"In the weekly sheet the employee writes each day the rest taken beforehand, the start time, the registration number before each trip and the end time. Takings, tips and signatures are not required."},"src":"ref92"},
{"c":"V","art":"ONC (regola dei manuali)","it":{"q":"Quando è vietato il consumo di bevande alcoliche per il conducente?","a":["Durante il lavoro e nelle 6 ore precedenti","Durante il lavoro e nelle 2 ore precedenti","Solo mentre trasporta effettivamente passeggeri"]},"en":{"q":"When is the driver not allowed to drink alcohol?","a":["During work and in the 6 hours before it","During work and in the 2 hours before it","Only while actually carrying passengers"]},"x":{"it":"All'esame la risposta attesa è: niente alcol durante il lavoro e nelle 6 ore prima di iniziare. Oggi la legge vieta inoltre di guidare con 0,10 per mille o più nel trasporto professionale di persone.","en":"The answer expected in the exam is: no alcohol during work and in the 6 hours before starting. Today the law also bans driving with 0.10 per mille or more in professional passenger transport."},"src":"ref93"},
{"c":"T","art":"Art. 3 cpv. 1bis","it":{"q":"Quando le corse sono considerate \"regolari\" (trasporto professionale)?","a":["Almeno due volte a intervalli di meno di 16 giorni","Almeno una volta a intervalli di 16 giorni","In ogni giorno lavorativo della settimana"]},"en":{"q":"When do trips count as \"regular\" (professional transport)?","a":["At least twice at intervals of less than 16 days","At least once in every period of 16 days","On every working day of the week"]},"x":{"it":"Le corse sono «regolari» se si ripetono: almeno due corse con meno di 16 giorni tra l'una e l'altra. Una sola corsa, o corse a 16 giorni o più di distanza, non bastano.","en":"Trips are “regular” if they are repeated: at least two trips with less than 16 days between them. A single trip, or trips 16 or more days apart, is not enough."},"src":"ref94"},
{"c":"T","art":"Art. 3 cpv. 1bis","it":{"q":"Quando il \"successo economico\" di una corsa è considerato dato?","a":["Quando il prezzo supera i costi e le spese","Quando c'è un pagamento qualsiasi, anche simbolico","Quando il prezzo copre esattamente il carburante"]},"en":{"q":"When is a trip considered to bring an economic profit?","a":["When the fare exceeds the costs and expenses","When any payment is made, even a symbolic one","When the fare covers exactly the fuel costs"]},"x":{"it":"C'è successo economico quando il prezzo della corsa è più alto dei costi del veicolo e delle spese del conducente, cioè quando resta un guadagno. Coprire soltanto i costi non basta.","en":"There is economic success when the fare is higher than the vehicle costs and the driver's expenses, in other words when a profit is left. Merely covering the costs is not enough."},"src":"ref95"},
{"c":"P","art":"Art. 4 cpv. 1","it":{"q":"Per quali corse NON si applica l'OLR 2?","a":["Ambulanze, veicoli fino a 30 km/h, trasporto di scolari","Trasferimenti aeroportuali, navette, corse prenotate","Corse notturne, di domenica e fuori cantone"]},"en":{"q":"To which trips does the OLR 2 NOT apply?","a":["Ambulances, vehicles up to 30 km/h, school transport","Airport transfers, hotel shuttles, pre-booked trips","Night trips, Sunday trips, trips outside the canton"]},"x":{"it":"Le eccezioni dell'OLR 2 sono: ambulanze, veicoli che non superano i 30 km/h e trasporti di disabili, scolari e operai. Corse notturne, prenotate o per l'aeroporto restano normali trasporti professionali.","en":"The exceptions to OLR 2 are: ambulances, vehicles that cannot exceed 30 km/h, and transport of disabled persons, schoolchildren and workers. Night trips, pre-booked trips and airport runs remain normal professional transport."},"src":"ref96"},
{"c":"O","art":"Art. 12 cpv. 3","it":{"q":"Se due mezze giornate libere vengono unite in un giorno libero, esso copre...","a":["Dalle 07:00 alle 18:00, più il riposo giornaliero","Dalle 06:00 alle 20:00, senza riposo giornaliero","10 ore consecutive a scelta del dipendente"]},"en":{"q":"If two free half-days are combined into one free day, it covers...","a":["From 07:00 to 18:00, plus the daily rest","From 06:00 to 20:00, without the daily rest","Any 10 consecutive hours the employee chooses"]},"x":{"it":"Due mezze giornate insieme devono dare un vero giorno libero: tutta la fascia diurna dalle 07:00 alle 18:00, con il riposo giornaliero attaccato subito prima o subito dopo.","en":"Two half-days together must give a real day off: the whole daytime period from 07:00 to 18:00, with the daily rest attached immediately before or after."},"src":"ref97"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Quali limiti di orario valgono per il riposo di 24 ore che compensa una domenica lavorata?","a":["Deve comprendere il periodo dalle 06:00 alle 20:00","Deve comprendere il periodo dalle 08:00 alle 18:00","Deve andare esattamente da mezzanotte a mezzanotte"]},"en":{"q":"Which time limits apply to the 24-hour rest that compensates a worked Sunday?","a":["It must cover the period from 06:00 to 20:00","It must cover the period from 08:00 to 18:00","It must run exactly from midnight to midnight"]},"x":{"it":"Il riposo che compensa la domenica lavorata deve coprire tutta la giornata: inizia al più tardi alle 06:00 e non finisce prima delle 20:00.","en":"The rest that makes up for a worked Sunday must cover the whole day: it starts at 06:00 at the latest and does not end before 20:00."},"src":"ref98"},
{"c":"O","art":"Art. 11 + 9 + 12","it":{"q":"Un conducente dipendente prende insieme il giorno di riposo settimanale, il riposo giornaliero normale e la mezza giornata libera. Per quanto tempo deve restare lontano dal lavoro?","a":["40 ore (24 + 11 + 5)","38 ore (24 + 9 + 5)","35 ore (24 + 11)"]},"en":{"q":"An employed driver takes the weekly rest day, the normal daily rest and the free half-day together. How many hours off work does that make in total?","a":["40 hours (24 + 11 + 5)","38 hours (24 + 9 + 5)","35 hours (24 + 11)"]},"x":{"it":"Si sommano i tre riposi: 24 ore di giorno di riposo + 11 ore di riposo giornaliero normale + 5 ore di mezza giornata = 40 ore. 38 ore sarebbero con il riposo ridotto a 9 ore.","en":"You add the three rests: 24 hours for the rest day + 11 hours of normal daily rest + 5 hours for the half-day = 40 hours. 38 hours would be with the rest reduced to 9 hours."},"src":"ref99"},
{"c":"O","art":"Art. 5 cpv. 3","it":{"q":"Se il lavoro è organizzato a turni, i turni devono cambiare al più tardi dopo...","a":["6 settimane, salvo consenso del dipendente","2 settimane, salvo eccezione dell'autorità","Mai, se il salario ha un supplemento notturno"]},"en":{"q":"If the work is organised in shifts, when must employees change shift at the latest?","a":["After 6 weeks, unless the employee agrees otherwise","After 2 weeks, unless the authority allows otherwise","Never, if the wage includes a night supplement"]},"x":{"it":"Nessuno deve restare troppo a lungo nello stesso turno (per esempio sempre di notte): i turni cambiano al più tardi dopo 6 settimane, a meno che il dipendente accetti espressamente un'altra soluzione.","en":"Nobody should stay too long on the same shift (for example always nights): shifts change after 6 weeks at the latest, unless the employee expressly agrees to something else."},"src":"ref100"},
{"c":"O","art":"Art. 6 cpv. 3","it":{"q":"Come viene compensato il lavoro straordinario?","a":["Tempo libero entro 3 mesi o supplemento del 25%","Tempo libero entro 1 settimana o supplemento del 50%","Nessun compenso: è compreso nel salario"]},"en":{"q":"How is overtime compensated?","a":["Time off within 3 months or a 25% supplement","Time off within 1 week or a 50% supplement","No compensation: it is included in the wage"]},"x":{"it":"Lo straordinario va restituito: di regola con tempo libero della stessa durata entro 3 mesi, altrimenti pagato con il 25% in più. Non è mai semplicemente «compreso» nel salario normale.","en":"Overtime must be given back: as a rule as time off of the same length within 3 months, otherwise paid with a 25% supplement. It is never simply “included” in normal pay."},"src":"ref101"},
{"c":"C","art":"Tachigrafo","it":{"q":"Cosa registra fondamentalmente il tachigrafo?","a":["Velocità, tempo e percorso (distanza percorsa)","Tempo, tariffe applicate e percorsi effettuati","Distanza, numero di passeggeri e fermate"]},"en":{"q":"What does the tachograph fundamentally record?","a":["Speed, time and distance travelled","Time, fares charged and routes driven","Distance, number of passengers and stops"]},"x":{"it":"Il tachigrafo registra tre cose: la velocità, il tempo (guida, lavoro, pause) e la distanza percorsa. Tariffe e passeggeri non li registra: per le tariffe c'è il tassametro.","en":"The tachograph records three things: speed, time (driving, work, breaks) and distance travelled. It does not record fares or passengers: the taximeter is there for fares."},"src":"ref102"},
{"c":"C","art":"Art. 16 cpv. 2","it":{"q":"Con il tachigrafo CH, per quanto tempo un disco può restare nell'apparecchio e da quanti conducenti può essere usato?","a":["Al massimo 24 ore, per due conducenti","Al massimo una settimana, per più conducenti","Al massimo 12 ore, per tre conducenti"]},"en":{"q":"With a CH tachograph, how long may a sheet stay in the device and how many drivers may use it?","a":["At most 24 hours, for two drivers","At most one week, for any number of drivers","At most 12 hours, for three drivers"]},"x":{"it":"Un disco copre un giorno: può restare nel tachigrafo CH al massimo 24 ore, altrimenti le registrazioni si sovrappongono. Ha due posizioni, quindi serve per due conducenti (1 e 2).","en":"A sheet covers one day: it may stay in the CH tachograph for at most 24 hours, otherwise the recordings overlap. It has two positions, so it serves two drivers (1 and 2)."},"src":"ref103"},
{"c":"C","art":"Art. 17-18","it":{"q":"Se i fogli di registrazione del tachigrafo sono usati in modo VINCOLATO AL VEICOLO (un foglio per veicolo), cosa vale per il tassista?","a":["Deve comunque tenere il libretto di lavoro","Gli serve il libretto solo con due datori di lavoro","Può sostituire il libretto con le ricevute firmate"]},"en":{"q":"If the record sheets are tied to the vehicle (one sheet per vehicle), what applies to the taxi driver?","a":["They must still keep a work record book","They need the book only with two employers","They may replace the book with signed receipts"]},"x":{"it":"Quando il foglio appartiene al veicolo e non al conducente, non basta a provare i tempi della singola persona. Perciò il tassista tiene comunque il libretto di lavoro e compila i fogli settimanali.","en":"When the sheet belongs to the vehicle and not to the driver, it is not enough to prove one person's times. So the taxi driver still keeps a work record book and fills in the weekly sheets."},"src":"ref104"},
{"c":"O","art":"Art. 5 + 6","it":{"q":"Un conducente DIPENDENTE in un'azienda di taxi ha già lavorato 50 ore questa settimana. Compreso lo straordinario ordinario consentito, quante ore può ancora lavorare al massimo?","a":["7 ore (53 ore + 4 ore di straordinario = 57 ore)","3 ore (solo fino alle 53 ore normali)","9 ore (53 ore + 6 ore di straordinario = 59 ore)"]},"en":{"q":"An EMPLOYED driver in a taxi business has already worked 50 hours this week. Including the permitted normal overtime, how many more hours may they work at most?","a":["7 hours (53 h + 4 h overtime = 57 h)","3 hours (only up to the normal 53 h)","9 hours (53 h + 6 h overtime = 59 h)"]},"x":{"it":"In un'azienda di taxi il massimo è 53 ore, più 4 ore di straordinario normale = 57 ore. 57 − 50 già lavorate = 7 ore. Le 2 ore in più (59) valgono solo in periodi eccezionali.","en":"In a taxi business the maximum is 53 hours, plus 4 hours of normal overtime = 57 hours. 57 − 50 already worked = 7 hours. The 2 extra hours (59) apply only in exceptional periods."},"src":"ref105"},
{"c":"O","art":"Art. 5","it":{"q":"Un conducente DIPENDENTE in un'azienda di taxi ha già lavorato 50 ore questa settimana. SENZA straordinario, quante ore può ancora lavorare?","a":["3 ore (fino al massimo normale di 53 ore)","9 ore (fino a un limite assoluto di 59 ore)","0 ore (il massimo settimanale è raggiunto)"]},"en":{"q":"An EMPLOYED driver in a taxi business has already worked 50 hours this week. WITHOUT overtime, how many more hours may they work?","a":["3 hours (up to the normal maximum of 53 h)","9 hours (up to a 59-hour absolute limit)","0 hours (the weekly maximum is reached)"]},"x":{"it":"Senza straordinario conta solo il massimo normale di un'azienda di taxi, cioè 53 ore. 53 − 50 già lavorate = 3 ore.","en":"Without overtime only the normal maximum for a taxi business counts, which is 53 hours. 53 − 50 already worked = 3 hours."},"src":"ref106"},
{"c":"O","art":"Art. 5 + 6","it":{"q":"Un conducente dipendente AL DI FUORI di un'azienda di taxi ha già lavorato 50 ore questa settimana. Compreso lo straordinario ordinario, quante ore può ancora lavorare?","a":["2 ore (48 ore + 4 ore di straordinario = 52 ore)","7 ore (53 ore + 4 ore di straordinario = 57 ore)","9 ore (fino a un limite assoluto di 59 ore)"]},"en":{"q":"An employed driver OUTSIDE a taxi business has already worked 50 hours this week. Including normal overtime, how many more hours may they work?","a":["2 hours (48 h + 4 h overtime = 52 h)","7 hours (53 h + 4 h overtime = 57 h)","9 hours (up to a 59-hour absolute limit)"]},"x":{"it":"Fuori dalle aziende di taxi il massimo è 48 ore, più 4 ore di straordinario normale = 52 ore. 52 − 50 già lavorate = 2 ore. Le 53 ore valgono solo nelle aziende di taxi.","en":"Outside taxi businesses the maximum is 48 hours, plus 4 hours of normal overtime = 52 hours. 52 − 50 already worked = 2 hours. The 53 hours apply only in taxi businesses."},"src":"ref107"},
{"c":"O","art":"Art. 5 + 6","it":{"q":"Un conducente dipendente AL DI FUORI di un'azienda di taxi ha già lavorato 45 ore questa settimana. Compreso lo straordinario ordinario consentito, quante ore può ancora lavorare al massimo?","a":["7 ore (48 ore + 4 ore di straordinario = 52 ore)","9 ore (48 ore + 6 ore di straordinario = 54 ore)","12 ore (fino al limite taxi di 57 ore)"]},"en":{"q":"An employed driver OUTSIDE a taxi business has already worked 45 hours this week. Including the permitted normal overtime, how many more hours may they work at most?","a":["7 hours (48 h + 4 h overtime = 52 h)","9 hours (48 h + 6 h overtime = 54 h)","12 hours (up to the taxi limit of 57 h)"]},"x":{"it":"Fuori dalle aziende di taxi: 48 ore + 4 ore di straordinario normale = 52 ore. 52 − 45 già lavorate = 7 ore. Il limite di 57 ore vale solo nelle aziende di taxi.","en":"Outside taxi businesses: 48 hours + 4 hours of normal overtime = 52 hours. 52 − 45 already worked = 7 hours. The 57-hour limit applies only in taxi businesses."},"src":"ref108"},
{"c":"O","art":"Art. 5","it":{"q":"Un conducente dipendente AL DI FUORI di un'azienda di taxi ha già lavorato 45 ore questa settimana. SENZA straordinario, quante ore può ancora lavorare?","a":["3 ore (fino al massimo normale di 48 ore)","8 ore (fino al massimo taxi di 53 ore)","0 ore (il massimo settimanale è raggiunto)"]},"en":{"q":"An employed driver OUTSIDE a taxi business has already worked 45 hours this week. WITHOUT overtime, how many more hours may they work?","a":["3 hours (up to the normal maximum of 48 h)","8 hours (up to the taxi maximum of 53 h)","0 hours (the weekly maximum is reached)"]},"x":{"it":"Fuori dalle aziende di taxi il massimo normale è 48 ore, e senza straordinario non si va oltre. 48 − 45 già lavorate = 3 ore.","en":"Outside taxi businesses the normal maximum is 48 hours, and without overtime you cannot go beyond it. 48 − 45 already worked = 3 hours."},"src":"ref109"},
{"c":"T","art":"Art. 1","it":{"q":"Cosa regola l'OLR 2 (ARV 2)?","a":["Lavoro, guida e riposo dei conducenti e i controlli","Solo il tempo di guida e l'equipaggiamento dei veicoli","Le tariffe, i percorsi e i posteggi dei taxi"]},"en":{"q":"What does the OLR 2 regulate?","a":["Drivers' work, driving and rest times, and the checks","Only driving time and the vehicles' equipment","The fares, routes and ranks of taxi businesses"]},"x":{"it":"L'OLR 2 regola tre tempi dei conducenti (lavoro, guida e riposo), come vengono controllati e che cosa deve fare il datore di lavoro. Tariffe, percorsi e posteggi non sono materia dell'OLR 2.","en":"OLR 2 regulates three kinds of time for drivers (work, driving and rest), how they are checked and what the employer must do. Fares, routes and ranks are not covered by OLR 2."},"src":"ref110"},
{"c":"P","art":"Art. 3 cpv. 1","it":{"q":"Quali veicoli rientrano nell'OLR 2 quando sono usati per il trasporto professionale di persone?","a":["Veicoli leggeri e minibus fino a 16 posti","Tutti i veicoli a motore fino a 7,5 tonnellate","Solo gli autobus di linea con più di 16 posti"]},"en":{"q":"Which vehicles fall under the OLR 2 when used for professional passenger transport?","a":["Light vehicles and minibuses with up to 16 seats","All motor vehicles up to 7.5 tonnes","Only scheduled buses with more than 16 seats"]},"x":{"it":"L'OLR 2 copre i veicoli «piccoli» per il trasporto professionale di persone: veicoli leggeri, autovetture pesanti e minibus fino a 16 posti oltre al conducente. Autobus più grandi e trasporto merci rientrano nell'OLR 1.","en":"OLR 2 covers the “small” vehicles used for professional passenger transport: light vehicles, heavy passenger cars and minibuses with up to 16 seats besides the driver. Larger buses and goods transport fall under OLR 1."},"src":"ref111"},
{"c":"T","art":"Art. 2 cpv. 2","it":{"q":"Quali tre ruoli distingue l'OLR 2?","a":["Conducente indipendente, dipendente e datore di lavoro","Proprietario, locatario e locatore del veicolo","Apprendista, conducente con licenza e capo flotta"]},"en":{"q":"Which three roles does the OLR 2 distinguish?","a":["Self-employed driver, employee and employer","Vehicle owner, tenant and lessor","Apprentice, licensed driver and fleet manager"]},"x":{"it":"L'OLR 2 distingue chi guida per conto proprio (indipendente), chi guida per un altro (lavoratore) e chi può dare ordini al conducente (datore di lavoro). Le regole cambiano a seconda del ruolo.","en":"OLR 2 distinguishes those who drive for themselves (self-employed), those who drive for someone else (employee) and those who can give the driver orders (employer). The rules differ according to the role."},"src":"ref112"},
{"c":"T","art":"Art. 2 cpv. 2 lett. b","it":{"q":"Chi è considerato «conducente indipendente» secondo l'OLR 2?","a":["Chi non ha un datore di lavoro e decide da sé","Chi ha un datore di lavoro ma decide da sé gli orari","Chi guida un veicolo proprio, anche da dipendente"]},"en":{"q":"Who is considered a “self-employed driver” under the OLR 2?","a":["Someone with no employer who decides for themselves","Someone with an employer who sets their own hours","Someone driving their own vehicle, even as an employee"]},"x":{"it":"Indipendente è chi non ha un capo: non lavora per un datore di lavoro, non riceve ordini e decide da solo come usare il veicolo. Essere proprietario dell'auto non basta, se si lavora alle dipendenze di un'azienda.","en":"Self-employed means having no boss: you do not work for an employer, take no orders and decide for yourself how the vehicle is used. Owning the car is not enough if you work as an employee of a business."},"src":"add1"},
{"c":"T","art":"Art. 2 cpv. 2 lett. b","it":{"q":"Il coniuge o il figlio del proprietario dell'azienda che guida il taxi è considerato...","a":["Conducente indipendente","Lavoratore dipendente","Conducente a titolo accessorio"]},"en":{"q":"The spouse or child of the business owner who drives the taxi is considered...","a":["A self-employed driver","An employee","A driver with a second job"]},"x":{"it":"I familiari stretti del titolare (coniuge, figli, genitori) che guidano nell'azienda di famiglia sono trattati come conducenti indipendenti, non come dipendenti.","en":"Close family members of the owner (spouse, children, parents) who drive in the family business are treated as self-employed drivers, not as employees."},"src":"add2"},
{"c":"T","art":"Art. 2 cpv. 2 lett. c-d","it":{"q":"Chi è il «datore di lavoro» ai sensi dell'OLR 2?","a":["Chi, come titolare o superiore, può dare ordini","Chi mette il veicolo a disposizione del conducente","Chi paga le spese e le assicurazioni del veicolo"]},"en":{"q":"Who is the “employer” within the meaning of the OLR 2?","a":["Whoever, as owner or superior, can give orders","Whoever makes the vehicle available to the driver","Whoever pays the vehicle's costs and insurance"]},"x":{"it":"Datore di lavoro è chi può dare ordini al conducente, come proprietario dell'azienda o come superiore. Possedere il veicolo o pagarne le spese non rende datore di lavoro.","en":"The employer is whoever can give the driver orders, as owner of the business or as a superior. Owning the vehicle or paying its costs does not make someone the employer."},"src":"add3"},
{"c":"T","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Un tassista dipendente lavora due giorni alla settimana anche per un altro datore di lavoro. Questo tempo conta come durata del lavoro?","a":["Sì, conta anche il lavoro per un altro datore","No, conta solo il lavoro nell'azienda di taxi","Solo se anche l'altro lavoro è trasporto di persone"]},"en":{"q":"An employed taxi driver also works two days a week for another employer. Does this time count as working time?","a":["Yes, work for another employer counts too","No, only the work in the taxi business counts","Only if the other job is also passenger transport"]},"x":{"it":"Le ore si sommano: nel tempo di lavoro rientra anche il lavoro retribuito svolto presso un altro datore di lavoro, di qualunque tipo sia. Altrimenti i limiti settimanali si potrebbero aggirare con due impieghi.","en":"The hours add up: working time also includes paid work for another employer, whatever kind of work it is. Otherwise the weekly limits could be dodged with two jobs."},"src":"add4"},
{"c":"T","art":"Art. 2 cpv. 2 lett. h","it":{"q":"Chi è l'«autorità di esecuzione» dell'OLR 2?","a":["L'autorità cantonale competente per i controlli","L'Ufficio federale delle strade (USTRA)","La polizia comunale della sede dell'azienda"]},"en":{"q":"Who is the “enforcement authority” of the OLR 2?","a":["The cantonal authority responsible for the checks","The Federal Roads Office (FEDRO)","The municipal police where the business is based"]},"x":{"it":"L'autorità di esecuzione è cantonale: ogni Cantone designa chi fa i controlli su strada e nelle aziende. L'USTRA ha solo la sovrintendenza generale e non fa i controlli.","en":"The enforcement authority is cantonal: each canton appoints who carries out the checks on the road and in businesses. The Federal Roads Office only has general oversight and does not do the checks."},"src":"add5"},
{"c":"T","art":"Art. 3 cpv. 1ter","it":{"q":"Il trasporto di persone con veicoli noleggiati con autista è considerato trasporto professionale di persone?","a":["Sì, è equiparato al trasporto professionale","No, è un noleggio e non rientra nell'OLR 2","Solo se la distanza supera i 50 chilometri"]},"en":{"q":"Is passenger transport with chauffeur-driven hire vehicles considered professional passenger transport?","a":["Yes, it is treated as professional transport","No, it is a hire and not covered by the OLR 2","Only if the distance exceeds 50 kilometres"]},"x":{"it":"Noleggiare un veicolo insieme all'autista equivale, in pratica, a far trasportare persone a pagamento. Per questo è trattato come trasporto professionale di persone e vale l'OLR 2.","en":"Hiring a vehicle together with a driver amounts in practice to paying to have people carried. That is why it is treated as professional passenger transport and OLR 2 applies."},"src":"add6"},
{"c":"P","art":"Art. 3 cpv. 4","it":{"q":"In che misura l'OLR 2 si applica al datore di lavoro?","a":["Solo dove gli impone esplicitamente degli obblighi","Nella stessa misura che al conducente dipendente","Non si applica: per lui vale solo l'OLR 1"]},"en":{"q":"To what extent does the OLR 2 apply to the employer?","a":["Only where it explicitly imposes duties on them","To the same extent as to the employed driver","Not at all: only the OLR 1 applies to them"]},"x":{"it":"L'OLR 2 è scritta per i conducenti. Al datore di lavoro si applica solo dove gli impone espressamente un obbligo, per esempio tenere il registro o organizzare il lavoro in modo corretto.","en":"OLR 2 is written for drivers. It applies to the employer only where it expressly gives them a duty, for example keeping the register or planning the work properly."},"src":"add7"},
{"c":"P","art":"Art. 3 cpv. 2","it":{"q":"Guidi all'estero un minibus immatricolato in Svizzera con più di 8 posti oltre al conducente. Quale ordinanza devi rispettare?","a":["L'OLR 1","L'OLR 2","Nessuna: all'estero valgono solo le regole locali"]},"en":{"q":"You are driving abroad in a Swiss-registered minibus with more than 8 seats besides the driver's. Which ordinance must you observe?","a":["The OLR 1","The OLR 2","None: abroad only local rules apply"]},"x":{"it":"All'estero l'OLR 2 vale solo fino a 8 posti oltre al conducente. Un minibus con più di 8 posti, quando va all'estero, deve rispettare l'OLR 1.","en":"Abroad, OLR 2 applies only up to 8 seats besides the driver. A minibus with more than 8 seats must comply with OLR 1 when it goes abroad."},"src":"add8"},
{"c":"P","art":"Art. 3 cpv. 3","it":{"q":"Un conducente con un veicolo immatricolato all'estero circola in Svizzera. Quali disposizioni dell'OLR 2 deve osservare?","a":["Guida, pause e riposo (articoli 7–11)","Tutta l'ordinanza, libretto di lavoro compreso","Nessuna: valgono solo le regole del suo Paese"]},"en":{"q":"A driver with a foreign-registered vehicle drives in Switzerland. Which OLR 2 provisions must they observe?","a":["Driving time, breaks and rest (Articles 7–11)","The whole ordinance, work record book included","None: only their own country's rules apply"]},"x":{"it":"Chi viene dall'estero deve rispettare in Svizzera solo le regole essenziali per la sicurezza: tempo di guida, pause e riposo giornaliero e settimanale. Il libretto di lavoro svizzero non gli è richiesto.","en":"A driver from abroad must observe in Switzerland only the rules essential for safety: driving time, breaks, and daily and weekly rest. The Swiss work record book is not required of them."},"src":"add9"},
{"c":"P","art":"Art. 3 cpv. 1","it":{"q":"L'OLR 2 vale anche quando il tassista percorre una corsa a vuoto durante il servizio?","a":["Sì, fa parte dell'attività professionale","No, senza passeggeri non è trasporto di persone","Solo se la corsa a vuoto supera i 50 chilometri"]},"en":{"q":"Does the OLR 2 also apply when the taxi driver drives without passengers while on duty?","a":["Yes, it is part of the professional activity","No, without passengers it is not passenger transport","Only if the empty run is longer than 50 kilometres"]},"x":{"it":"Anche senza passeggeri stai lavorando e stai guidando: la corsa a vuoto fa parte del servizio e conta come tempo di guida e di lavoro.","en":"Even without passengers you are working and driving: an empty run is part of the job and counts as driving time and working time."},"src":"add10"},
{"c":"P","art":"Art. 4 cpv. 3 / Art. 15 cpv. 2","it":{"q":"Fai una corsa privata con il taxi. Sei soggetto all'OLR 2?","a":["No, ma il tachigrafo resta in funzione su «Pausa»","No, e il tachigrafo può essere spento","Sì, come durante qualsiasi corsa professionale"]},"en":{"q":"You make a private trip with the taxi. Are you subject to the OLR 2?","a":["No, but the tachograph keeps running on “break”","No, and the tachograph may be switched off","Yes, in full, as during any professional trip"]},"x":{"it":"In una corsa privata i limiti di tempo dell'OLR 2 non valgono. Il tachigrafo però non si spegne: resta acceso sulla posizione «Pausa», così si vede che la corsa era privata.","en":"On a private trip the OLR 2 time limits do not apply. But the tachograph is not switched off: it stays on in the “Break” position, which shows that the trip was private."},"src":"add11"},
{"c":"P","art":"Art. 4 cpv. 4","it":{"q":"Se l'OLR 2 si applica soltanto a una parte dell'attività di un conducente, i limiti di tempo valgono per...","a":["L'intera attività, con mezzi di controllo per tutto","Solo la parte OLR 2, con mezzi di controllo solo lì","Solo la parte OLR 2, senza mezzi di controllo"]},"en":{"q":"If the OLR 2 applies only to part of a driver's activity, the time limits apply to...","a":["The whole activity, with control documents for all of it","Only the OLR 2 part, with control documents for it","Only the OLR 2 part, without any control documents"]},"x":{"it":"Non si può dividere l'attività in una parte «con regole» e una «senza»: se anche solo una parte del lavoro rientra nell'OLR 2, i limiti e i mezzi di controllo valgono per tutta l'attività professionale.","en":"You cannot split the activity into a part “with rules” and a part “without”: if even part of the work falls under OLR 2, the limits and the control records apply to the whole professional activity."},"src":"add12"},
{"c":"P","art":"Art. 25 cpv. 1","it":{"q":"I Cantoni possono emanare prescrizioni diverse dall'OLR 2 per i tassisti?","a":["Sì, per i tassisti delle agglomerazioni urbane","Sì, per tutti i conducenti professionali","No, l'OLR 2 è federale e non ammette deroghe"]},"en":{"q":"May the cantons issue rules for taxi drivers that differ from the OLR 2?","a":["Yes, for taxi drivers in urban agglomerations","Yes, for all professional drivers in the canton","No, the OLR 2 is federal and allows no departures"]},"x":{"it":"L'OLR 2 permette ai Cantoni di fissare regole diverse solo per i tassisti delle agglomerazioni urbane (e di delegare questo compito ai Comuni). Non vale per tutti i conducenti professionali del Cantone.","en":"OLR 2 lets cantons set different rules only for taxi drivers in urban agglomerations (and delegate this to municipalities). It does not extend to all professional drivers in the canton."},"src":"add13"},
{"c":"P","art":"Art. 25 cpv. 4","it":{"q":"Cosa possono prescrivere i Cantoni ai tassisti al posto del libretto di lavoro?","a":["Carte di lavoro con le indicazioni principali","Rapporti del tassametro con le indicazioni principali","Nulla: il libretto è obbligatorio in tutti i Cantoni"]},"en":{"q":"What may the cantons prescribe for taxi drivers instead of the work record book?","a":["Work cards with the main information","Taximeter reports with the main information","Nothing: the book is mandatory in all cantons"]},"x":{"it":"Al posto del libretto di lavoro i Cantoni possono prescrivere ai tassisti delle carte di lavoro, che riportano le indicazioni principali del libretto. I rapporti del tassametro non lo sostituiscono.","en":"Instead of the work record book, cantons may require taxi drivers to use work cards that contain its main information. Taximeter reports do not replace it."},"src":"add14"},
{"c":"P","art":"Art. 27","it":{"q":"Un datore di lavoro impiega un conducente a titolo accessorio (ad es. uno studente). Di cosa deve accertarsi?","a":["Che le due attività insieme rispettino i limiti","Che solo l'attività accessoria rispetti i limiti","Che il conducente tenga un secondo libretto di lavoro"]},"en":{"q":"An employer takes on a driver who works for them as a second job (e.g. a student). What must the employer make sure of?","a":["That both jobs together stay within the limits","That only the second job stays within the limits","That the driver keeps a second work record book"]},"x":{"it":"I limiti valgono per la persona, non per il singolo impiego. Il datore di lavoro deve quindi verificare che attività principale e attività accessoria, sommate, restino dentro i limiti dell'OLR 2.","en":"The limits apply to the person, not to each job. The employer must therefore check that the main job and the second job, added together, stay within the OLR 2 limits."},"src":"add15"},
{"c":"O","art":"Art. 5","it":{"q":"Qual è la durata massima giornaliera del lavoro di un tassista secondo l'OLR 2?","a":["Non è regolata: esiste solo il limite settimanale","10 ore al giorno: la durata di guida più un'ora","15 ore al giorno, pause e attese comprese"]},"en":{"q":"What is the maximum daily working time of a taxi driver under the OLR 2?","a":["It is not regulated: there is only a weekly limit","10 hours a day: the driving time plus one hour","15 hours a day, breaks and waiting included"]},"x":{"it":"L'OLR 2 fissa solo un massimo settimanale di lavoro (48 o 53 ore), non un massimo giornaliero. La giornata è limitata solo indirettamente, dalle 11 ore di riposo e dalle 9 ore di guida.","en":"OLR 2 sets only a weekly maximum for work (48 or 53 hours), not a daily one. The day is limited only indirectly, by the 11 hours of rest and the 9 hours of driving."},"src":"add16"},
{"c":"O","art":"Art. 6 cpv. 2","it":{"q":"Un lavoratore effettua in una settimana più di 4 ore di straordinario. Cosa deve fare il datore di lavoro?","a":["Annunciarlo all'autorità in un rapporto trimestrale","Annunciarlo all'autorità in un rapporto mensile","Chiedere prima un permesso scritto all'autorità"]},"en":{"q":"An employee works more than 4 hours of overtime in one week. What must the employer do?","a":["Report it to the authority in a quarterly report","Report it to the authority in a monthly report","Ask the authority for written permission first"]},"x":{"it":"Più di 4 ore di straordinario in una settimana sono un'eccezione che l'autorità vuole conoscere: il datore di lavoro la segnala in un rapporto trimestrale, entro 14 giorni dalla fine del trimestre. Non serve un permesso prima.","en":"More than 4 hours of overtime in a week is an exception the authority wants to know about: the employer reports it in a quarterly report, within 14 days of the end of the quarter. No permit is needed beforehand."},"src":"add17"},
{"c":"O","art":"Art. 6 cpv. 1","it":{"q":"Nei periodi di intensa attività straordinaria, di quante ore in totale può essere prolungata la settimana lavorativa?","a":["6 ore: 4 ordinarie più 2 supplementari","4 ore: lo straordinario non può aumentare","8 ore: 4 ordinarie più 4 supplementari"]},"en":{"q":"During periods of exceptionally intense activity, by how many hours in total may the working week be extended?","a":["6 hours: 4 ordinary plus 2 extra","4 hours: overtime cannot be increased","8 hours: 4 ordinary plus 4 extra"]},"x":{"it":"Alle 4 ore di straordinario normale si possono aggiungere 2 ore nei periodi di attività eccezionale: in totale 6 ore a settimana, non di più.","en":"On top of the 4 hours of normal overtime, 2 hours may be added in exceptionally busy periods: 6 hours a week in total, no more."},"src":"add18"},
{"c":"O","art":"Art. 8 cpv. 1-2","it":{"q":"Cosa è vietato al lavoratore durante una pausa?","a":["Guidare e svolgere attività professionali","Lasciare il veicolo e allontanarsi dal posteggio","Restare a riposare all'interno del veicolo"]},"en":{"q":"What is forbidden for the employee during a break?","a":["Driving and doing any professional activity","Leaving the vehicle and the taxi rank","Staying inside the vehicle to rest"]},"x":{"it":"Una pausa è tale solo se non lavori affatto: niente guida e nessun'altra attività professionale. Lasciare il veicolo o riposarci dentro invece è permesso.","en":"A break is only a break if you do no work at all: no driving and no other professional activity. Leaving the vehicle or resting inside it, on the other hand, is allowed."},"src":"add19"},
{"c":"O","art":"Art. 9 cpv. 2","it":{"q":"Un conducente riposa 8 ore di notte e 3 ore nel pomeriggio. Il riposo quotidiano suddiviso è valido?","a":["No: sono 11 ore, ma ne servono almeno 12","Sì: una parte dura 8 ore e nessuna meno di 1 ora","Sì: il totale supera le 9 ore del riposo ridotto"]},"en":{"q":"A driver rests 8 hours at night and 3 hours in the afternoon. Is the split daily rest valid?","a":["No: it is 11 hours, but at least 12 are needed","Yes: one part is 8 hours and none is under 1 hour","Yes: the total exceeds the 9 hours of reduced rest"]},"x":{"it":"8 + 3 = 11 ore, ma quando il riposo è suddiviso il totale deve essere di almeno 12 ore. Le altre due condizioni (una parte di 8 ore, nessuna sotto 1 ora) qui sono rispettate, ma non bastano.","en":"8 + 3 = 11 hours, but when the rest is split the total must be at least 12 hours. The other two conditions (one part of 8 hours, none under 1 hour) are met here, but that is not enough."},"src":"add20"},
{"c":"O","art":"Art. 9 cpv. 3","it":{"q":"Durante il riposo quotidiano il conducente può svolgere un'altra attività professionale, se la settimana lavorativa resta sotto il massimo?","a":["No, nessuna attività professionale è ammessa","Sì, se il massimo settimanale non viene superato","Sì, se lavora per un altro datore di lavoro"]},"en":{"q":"May the driver carry out another professional activity during the daily rest, if the working week stays below the maximum?","a":["No, no professional activity is allowed","Yes, if the weekly maximum is not exceeded","Yes, if it is done for another employer"]},"x":{"it":"Riposo vuol dire non lavorare del tutto. Durante il riposo quotidiano non è ammessa nessuna attività professionale, nemmeno per un altro datore di lavoro e anche se nella settimana restano ore libere.","en":"Rest means not working at all. No professional activity is allowed during the daily rest, not even for another employer and even if hours are still left in the week."},"src":"add21"},
{"c":"O","art":"Art. 11 cpv. 1","it":{"q":"Quando deve cadere, di regola, il giorno di riposo settimanale di un lavoratore?","a":["Di domenica o in un giorno festivo, a domicilio","Di sabato o domenica, a scelta del datore di lavoro","In un giorno qualsiasi, a scelta del lavoratore"]},"en":{"q":"When must an employee's weekly rest day normally fall?","a":["On a Sunday or public holiday, spent at home","On a Saturday or Sunday, as the employer chooses","On any day of the week, as the employee chooses"]},"x":{"it":"Di regola il giorno di riposo cade di domenica o in un giorno festivo, e il lavoratore deve poterlo passare a casa. Non lo scelgono liberamente né il datore di lavoro né il lavoratore.","en":"As a rule the rest day falls on a Sunday or public holiday, and the employee must be able to spend it at home. Neither the employer nor the employee is free to pick it."},"src":"add22"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Quanti giorni di riposo coincidenti con una domenica o un giorno festivo deve accordare ogni anno il datore di lavoro a chi lavora la domenica?","a":["Almeno 20","Almeno 12","Almeno 18"]},"en":{"q":"How many rest days falling on a Sunday or public holiday must the employer grant each year to someone who works on Sundays?","a":["At least 20","At least 12","At least 18"]},"x":{"it":"Chi lavora spesso di domenica deve comunque avere almeno 20 domeniche o giorni festivi liberi all'anno. Non confondere con 18 (ore che devono cadere di domenica) e 12 (giorni massimi tra due riposi).","en":"Someone who often works on Sundays must still get at least 20 Sundays or public holidays off per year. Do not confuse this with 18 (hours that must fall on the Sunday) or 12 (maximum days between two rest days)."},"src":"add23"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Un lavoratore deve lavorare di domenica. Quando recupera il giorno di riposo settimanale?","a":["In uno dei 6 giorni feriali prima o dopo la domenica","Solo in uno dei 6 giorni feriali dopo la domenica","Solo in uno dei 6 giorni feriali prima della domenica"]},"en":{"q":"An employee has to work on a Sunday. When do they take the weekly rest day instead?","a":["On one of the 6 weekdays before or after that Sunday","Only on one of the 6 weekdays after that Sunday","Only on one of the 6 weekdays before that Sunday"]},"x":{"it":"Il giorno di riposo sostitutivo può essere dato sia prima sia dopo: in uno dei 6 giorni feriali che precedono o che seguono direttamente la domenica lavorata.","en":"The replacement rest day may be given either before or after: on one of the 6 working days directly before or directly after the worked Sunday."},"src":"add24"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Tra due giorni di riposo, quanti giorni lavorativi possono trascorrere al massimo per un lavoratore?","a":["12","14","18"]},"en":{"q":"Between two rest days, how many working days may pass at most for an employee?","a":["12","14","18"]},"x":{"it":"Anche spostando i giorni di riposo, tra un giorno di riposo e il successivo non possono esserci più di 12 giorni di lavoro. 18 sono le ore che devono cadere di domenica, non giorni.","en":"Even when rest days are moved, there may be no more than 12 working days between one rest day and the next. 18 is the number of hours that must fall on the Sunday, not days."},"src":"add25"},
{"c":"O","art":"Art. 11 cpv. 5","it":{"q":"Durante il giorno di riposo settimanale è ammessa un'attività professionale?","a":["No, nessuna attività professionale","Sì, al massimo 4 ore di attività professionale","Sì, se svolta per un altro datore di lavoro"]},"en":{"q":"Is professional activity allowed during the weekly rest day?","a":["No, no professional activity at all","Yes, at most 4 hours of professional activity","Yes, if carried out for another employer"]},"x":{"it":"Il giorno di riposo settimanale è completamente libero: nessuna attività professionale, nemmeno per poche ore e nemmeno per un altro datore di lavoro.","en":"The weekly rest day is completely free: no professional activity, not even for a few hours and not even for another employer."},"src":"add26"},
{"c":"O","art":"Art. 12 cpv. 2","it":{"q":"Quante semigiornate libere settimanali possono essere ritirate in blocco, d'accordo con il datore di lavoro?","a":["Al massimo 4, di quattro settimane consecutive","Al massimo 2, di due settimane consecutive","Tutte quelle non ancora ritirate nell'anno"]},"en":{"q":"How many weekly free half-days may be taken together, by agreement with the employer?","a":["At most 4, from four consecutive weeks","At most 2, from two consecutive weeks","All those not yet taken in the calendar year"]},"x":{"it":"Le semigiornate libere si possono accumulare, ma solo quelle di 4 settimane consecutive, e vanno prese insieme d'accordo con il datore di lavoro. Non si possono mettere da parte per tutto l'anno.","en":"Free half-days may be saved up, but only those of 4 consecutive weeks, and they are taken together by agreement with the employer. They cannot be saved up for the whole year."},"src":"add27"},
{"c":"O","art":"Art. 12 cpv. 3 / Art. 9","it":{"q":"Due semigiornate libere vengono ritirate assieme e il riposo quotidiano è ridotto. Quante ore libere consecutive risultano come minimo?","a":["20 ore (11 ore + 9 ore di riposo ridotto)","18 ore (11 ore + 7 ore di riposo ridotto)","24 ore (11 ore + 13 ore di riposo normale)"]},"en":{"q":"Two free half-days are taken together and the daily rest is reduced. How many consecutive hours off does this give at least?","a":["20 hours (11 hours + 9 hours of reduced rest)","18 hours (11 hours + 7 hours of reduced rest)","24 hours (11 hours + 13 hours of normal rest)"]},"x":{"it":"Due semigiornate insieme coprono dalle 07:00 alle 18:00, cioè 11 ore. A queste si attacca il riposo quotidiano, qui ridotto a 9 ore: 11 + 9 = 20 ore libere di seguito.","en":"Two half-days together cover 07:00 to 18:00, which is 11 hours. The daily rest, here reduced to 9 hours, is attached to them: 11 + 9 = 20 consecutive hours off."},"src":"add28"},
{"c":"O","art":"Art. 11 + 9 + 12","it":{"q":"Un lavoratore prende insieme il giorno di riposo settimanale, una semigiornata libera e il riposo quotidiano RIDOTTO. Quante ore deve restare lontano dal lavoro?","a":["38 ore (24 + 5 + 9)","40 ore (24 + 5 + 11)","33 ore (24 + 9)"]},"en":{"q":"An employee takes the weekly rest day, a free half-day and the REDUCED daily rest together. How many hours off work does that make in total?","a":["38 hours (24 + 5 + 9)","40 hours (24 + 5 + 11)","33 hours (24 + 9)"]},"x":{"it":"Si sommano: 24 ore di giorno di riposo + 5 ore di semigiornata + 9 ore di riposo ridotto = 38 ore. Con il riposo normale di 11 ore sarebbero 40.","en":"You add them up: 24 hours for the rest day + 5 hours for the half-day + 9 hours of reduced rest = 38 hours. With the normal 11-hour rest it would be 40."},"src":"add29"},
{"c":"O","art":"Art. 22 cpv. 1","it":{"q":"Il datore di lavoro ti assegna dei turni che ti portano fuori dai limiti dell'OLR 2. Cosa devi fare?","a":["Avvisarlo per tempo che non puoi rispettare i limiti","Eseguire i turni: risponde soltanto il datore","Eseguire i turni: la responsabilità è soltanto tua"]},"en":{"q":"Your employer assigns you shifts that take you beyond the OLR 2 limits. What must you do?","a":["Tell them in good time that you cannot comply","Work the shifts: only the employer is responsible","Work the shifts: only you are responsible"]},"x":{"it":"Il conducente deve avvisare in tempo il datore di lavoro se i turni non permettono di rispettare le regole. Tacere non protegge nessuno: in caso di violazione sono punibili entrambi.","en":"The driver must tell the employer in good time if the shifts make it impossible to keep to the rules. Keeping quiet protects no one: if the rules are broken, both can be punished."},"src":"add30"},
{"c":"O","art":"Art. 28 cpv. 1","it":{"q":"Con quale pena è punito chi viola le disposizioni sulla durata del lavoro, della guida e del riposo?","a":["Con la multa, per ogni violazione","Con l'arresto o con la multa","Con la revoca automatica della licenza"]},"en":{"q":"What is the penalty for violating the working, driving and rest-time rules?","a":["A fine, for every violation","Detention or a fine","Automatic licence withdrawal"]},"x":{"it":"Le violazioni dei tempi di lavoro, guida e riposo sono punite con la multa. L'arresto non è più previsto e la licenza non viene revocata automaticamente.","en":"Breaches of working, driving and rest times are punished with a fine. Detention is no longer provided for, and the licence is not withdrawn automatically."},"src":"add31"},
{"c":"C","art":"Art. 16a","it":{"q":"Il taxi è equipaggiato con un tachigrafo UE (analogico o digitale). Quali regole sul tachigrafo e sui dischi si applicano?","a":["Quelle dell'OLR 1, al posto di quelle dell'OLR 2","Quelle dell'OLR 2, al posto di quelle dell'OLR 1","Nessuna: il conducente è dispensato dai controlli"]},"en":{"q":"The taxi is fitted with an EU tachograph (analogue or digital). Which rules on the tachograph and sheets apply?","a":["Those of the OLR 1, instead of those of the OLR 2","Those of the OLR 2, instead of those of the OLR 1","None: the driver is exempt from control documents"]},"x":{"it":"Il tachigrafo UE è lo stesso apparecchio usato su autocarri e autobus. Perciò per l'apparecchio, i dischi e la carta del conducente valgono le regole dell'OLR 1 al posto di quelle dell'OLR 2.","en":"The EU tachograph is the same device used in lorries and buses. So for the device, the sheets and the driver card the OLR 1 rules apply in place of the OLR 2 ones."},"src":"add32"},
{"c":"C","art":"Art. 16 cpv. 2 / OLR 1 art. 14a","it":{"q":"Qual è la differenza tra il disco del tachigrafo CH e quello del tachigrafo UE?","a":["Il disco CH è del veicolo, quello UE del conducente","Il disco CH è del conducente, quello UE del veicolo","Nessuna: entrambi sono legati al veicolo"]},"en":{"q":"What is the difference between the sheet of a CH tachograph and that of an EU tachograph?","a":["CH sheet: tied to the vehicle; EU sheet: personal","CH sheet: personal; EU sheet: tied to the vehicle","None: both are tied to the vehicle"]},"x":{"it":"È la differenza di base: il disco CH resta nel veicolo e può servire a due conducenti; il disco UE appartiene al conducente, che lo porta con sé quando cambia veicolo.","en":"This is the basic difference: the CH sheet stays in the vehicle and can serve two drivers; the EU sheet belongs to the driver, who takes it along when changing vehicle."},"src":"add33"},
{"c":"C","art":"Art. 16 cpv. 2-3","it":{"q":"Con un tachigrafo CH, cosa si fa al cambio di conducente durante la giornata?","a":["Si gira il selettore da conducente «1» a «2»","Si toglie il disco e se ne inserisce uno nuovo","Nulla: il cambio viene registrato automaticamente"]},"en":{"q":"With a CH tachograph, what is done at a change of driver during the day?","a":["The selector is turned from driver “1” to “2”","The sheet is removed and a new one inserted","Nothing: the change is recorded automatically"]},"x":{"it":"Con il tachigrafo CH il disco resta nel veicolo. Al cambio di conducente si gira solo il selettore da «1» a «2» e si completa il disco con il nome del secondo conducente.","en":"With the CH tachograph the sheet stays in the vehicle. At a change of driver you just turn the selector from “1” to “2” and add the second driver's name to the sheet."},"src":"add34"},
{"c":"C","art":"Art. 16 cpv. 6","it":{"q":"Con un tachigrafo CH, un terzo conducente guida lo stesso veicolo nello stesso giorno. Cosa deve fare?","a":["Mettere il nome sul disco e usare il foglio quotidiano","Inserire un nuovo disco e usare il foglio settimanale","Non scrivere nulla e usare il foglio settimanale"]},"en":{"q":"With a CH tachograph, a third driver drives the same vehicle on the same day. What must they do?","a":["Write their name on the sheet and use the daily sheet","Insert a new sheet and use only the weekly sheet","Write nothing and use only the weekly sheet"]},"x":{"it":"Il disco CH ha solo due posizioni. Il terzo conducente scrive quindi il suo nome accanto a quello del conducente 1 o 2 e registra i propri tempi a mano nel foglio quotidiano del libretto.","en":"The CH sheet has only two positions. So the third driver writes their name next to that of driver 1 or 2 and records their own times by hand in the daily sheet of the work record book."},"src":"add35"},
{"c":"C","art":"Art. 16 cpv. 2","it":{"q":"In un'azienda con lavoro a turni, più di due conducenti usano lo stesso veicolo al giorno. Possono usare un disco individuale?","a":["Sì, con un permesso dell'autorità valido un anno","Sì, senza permesso, se ognuno scrive il suo nome","No, resta un solo disco per veicolo e per giorno"]},"en":{"q":"In a business with shift work, more than two drivers use the same vehicle per day. May each of them use their own sheet?","a":["Yes, with a one-year permit from the authority","Yes, without a permit, if each writes their name","No, there is only one sheet per vehicle per day"]},"x":{"it":"Il disco individuale con il tachigrafo CH è un'eccezione, quindi serve un permesso dell'autorità d'esecuzione. Il permesso vale un anno e una copia va all'USTRA.","en":"An individual sheet with the CH tachograph is an exception, so a permit from the enforcement authority is needed. The permit is valid for one year and a copy goes to the Federal Roads Office."},"src":"add36"},
{"c":"C","art":"Art. 16 cpv. 7","it":{"q":"Sono ammesse iscrizioni facoltative sul disco del tachigrafo?","a":["Sì, se non rendono difficile la lettura","Sì, se sono scritte in rosso sul retro","No, sono ammesse solo quelle obbligatorie"]},"en":{"q":"Are optional entries allowed on the tachograph sheet?","a":["Yes, if they do not make it hard to read","Yes, if they are written in red on the back","No, only the mandatory entries are allowed"]},"x":{"it":"Si possono aggiungere annotazioni facoltative a una sola condizione: il disco deve restare ben leggibile per chi lo controlla. Il colore o il lato non c'entrano.","en":"Optional notes may be added on one condition only: the sheet must remain easy to read for whoever checks it. Colour or side has nothing to do with it."},"src":"add38"},
{"c":"C","art":"Art. 16 cpv. 8","it":{"q":"Entro quando il conducente deve consegnare al datore di lavoro i dischi usati?","a":["Il primo giorno di lavoro della settimana successiva","Alla fine della giornata in cui sono stati usati","Il primo giorno di lavoro del mese successivo"]},"en":{"q":"By when must the driver hand the used sheets to the employer?","a":["On the first working day of the following week","At the end of the day they were used","On the first working day of the following month"]},"x":{"it":"I dischi usati si consegnano al datore di lavoro al più tardi il primo giorno di lavoro della settimana successiva; chi è all'estero li consegna al ritorno. Non serve farlo ogni sera.","en":"Used sheets are handed to the employer at the latest on the first working day of the following week; anyone abroad hands them in on return. It does not have to be done every evening."},"src":"add39"},
{"c":"C","art":"Art. 15 cpv. 3","it":{"q":"Quante volte al giorno il conducente può aprire il tachigrafo durante la corsa per controllarne il funzionamento?","a":["Al massimo una volta al giorno","Al massimo due volte al giorno","Tutte le volte che lo ritiene necessario"]},"en":{"q":"How many times a day may the driver open the tachograph during the trip to check that it is working?","a":["At most once a day","At most twice a day","As often as they consider necessary"]},"x":{"it":"Durante la corsa il tachigrafo deve registrare senza interruzioni. Per questo il conducente può aprirlo solo una volta al giorno per controllare che funzioni.","en":"During a trip the tachograph must record without interruption. That is why the driver may open it only once a day to check that it is working."},"src":"add41"},
{"c":"C","art":"Art. 15 cpv. 1","it":{"q":"Un tassista fa una pausa di 10 minuti al bar lasciando il selettore del tachigrafo su «guida». Cosa viene registrato?","a":["Tempo di lavoro: da fermo registra «altri lavori»","Una pausa: il tachigrafo riconosce il veicolo fermo","Nulla: senza movimento il tachigrafo non registra"]},"en":{"q":"A taxi driver takes a 10-minute coffee break leaving the tachograph selector on “driving”. What is recorded?","a":["Working time: when stationary it records “other work”","A break: the tachograph recognises the stop","Nothing: without movement it does not record"]},"x":{"it":"Il tachigrafo non «capisce» da solo che sei in pausa. Se il selettore resta su guida e il veicolo è fermo, registra «altri lavori», cioè tempo di lavoro. Per la pausa devi scegliere tu la posizione «Pausa».","en":"The tachograph cannot tell by itself that you are on a break. If the selector stays on driving and the vehicle is stationary, it records “other work”, i.e. working time. For a break you must select the “Break” position yourself."},"src":"add42"},
{"c":"C","art":"OLR 1 art. 14a cpv. 2","it":{"q":"Il conducente è lontano dal veicolo e non può azionare il tachigrafo. Cosa deve fare con i tempi di quel periodo?","a":["Annotarli a mano sul disco, in modo leggibile","Annotarli a fine mese nel registro del datore","Nulla: conta solo ciò che registra il tachigrafo"]},"en":{"q":"The driver is away from the vehicle and cannot operate the tachograph. What must they do with the times of that period?","a":["Enter them by hand on the sheet, legibly","Enter them in the employer's register at month end","Nothing: only what the tachograph records counts"]},"x":{"it":"Quando sei lontano dal veicolo il tachigrafo non può registrare per te. Quei tempi li annoti tu a mano sul disco, in modo leggibile, senza aspettare la fine del mese.","en":"When you are away from the vehicle the tachograph cannot record for you. You note those times by hand on the sheet, legibly, without waiting until the end of the month."},"src":"add43"},
{"c":"C","art":"Art. 18 cpv. 4","it":{"q":"Si può circolare con il taxi mentre il tachigrafo è guasto?","a":["Sì, compilando i fogli quotidiani del libretto","Sì, avvisando la polizia e con il foglio settimanale","No, il taxi resta fermo fino alla riparazione"]},"en":{"q":"May the taxi be driven while the tachograph is broken?","a":["Yes, filling in the daily sheets of the book","Yes, telling the police and using the weekly sheet","No, the taxi stays off the road until the repair"]},"x":{"it":"Un tachigrafo guasto non ferma il taxi. Si può continuare a circolare, ma i tempi vanno registrati a mano nei fogli quotidiani del libretto di lavoro finché l'apparecchio non è riparato.","en":"A broken tachograph does not take the taxi off the road. You may keep driving, but the times must be recorded by hand in the daily sheets of the work record book until the device is repaired."},"src":"add47"},
{"c":"C","art":"Art. 17 cpv. 4","it":{"q":"Una persona non prevista come conducente deve guidare all'improvviso un taxi, senza avere un libretto di lavoro. Cosa deve fare?","a":["Avvisare subito l'autorità e compilare poi il libretto","Avvisare il datore di lavoro e guidare senza registrare","Rifiutare di guidare finché non riceve un libretto"]},"en":{"q":"Someone who was not planned as a driver suddenly has to drive a taxi and has no work record book. What must they do?","a":["Tell the authority at once and fill in the book later","Tell the employer and drive without recording anything","Refuse to drive until they receive a book"]},"x":{"it":"In un caso imprevisto si può guidare anche senza libretto di lavoro, ma bisogna annunciarlo subito all'autorità d'esecuzione e compilare il libretto in seguito. Guidare senza registrare nulla non è ammesso.","en":"In an unforeseen case you may drive even without a work record book, but you must report it to the enforcement authority straight away and fill in the book afterwards. Driving without recording anything is not allowed."},"src":"add52"},
{"c":"C","art":"Art. 17 cpv. 5","it":{"q":"Chi procura il libretto di lavoro e chi lo consegna al conducente dipendente?","a":["Il datore di lavoro, che lo consegna gratuitamente","Il datore di lavoro, che lo vende al prezzo di costo","Il conducente, che lo acquista a proprie spese"]},"en":{"q":"Who obtains the work record book and who hands it to the employed driver?","a":["The employer, who hands it over free of charge","The employer, who sells it at cost price","The driver, who buys it at their own expense"]},"x":{"it":"Il libretto di lavoro non costa nulla al dipendente: il datore di lavoro lo ritira presso l'autorità d'esecuzione e glielo consegna gratuitamente.","en":"The work record book costs the employee nothing: the employer collects it from the enforcement authority and hands it over free of charge."},"src":"add53"},
{"c":"C","art":"Art. 18 cpv. 1","it":{"q":"Appena ricevuto il libretto di lavoro, cosa deve compilare subito il conducente?","a":["La prima pagina della copertina","Il primo foglio quotidiano","Il primo foglio settimanale"]},"en":{"q":"As soon as the driver receives the work record book, what must they fill in immediately?","a":["The first page of the cover","The first daily sheet","The first weekly sheet"]},"x":{"it":"Per prima cosa si compila la prima pagina della copertina con i propri dati, così il libretto è subito attribuito a un conducente. I fogli quotidiani e settimanali si compilano dopo, lavorando.","en":"The first thing to fill in is the first page of the cover with your details, so the book is tied to one driver from the start. The daily and weekly sheets are filled in later, as you work."},"src":"add54"},
{"c":"C","art":"Art. 18 cpv. 2","it":{"q":"Se il tachigrafo funziona correttamente, cosa deve iscrivere il conducente nel libretto di lavoro?","a":["Soltanto il foglio settimanale del libretto","Il foglio settimanale e il foglio quotidiano","Nulla: il disco sostituisce il libretto di lavoro"]},"en":{"q":"If the tachograph works correctly, what must the driver enter in the work record book?","a":["Only the weekly sheet of the book","The weekly sheet and the daily sheet","Nothing: the tachograph sheet replaces the book"]},"x":{"it":"Se il tachigrafo funziona, i tempi della giornata li registra lui. Il conducente compila solo il foglio settimanale (riposo precedente, inizio e fine del lavoro, targa); il foglio quotidiano serve solo se il tachigrafo è guasto.","en":"If the tachograph is working, it records the day's times. The driver fills in only the weekly sheet (previous rest, start and end of work, registration number); the daily sheet is needed only if the tachograph is broken."},"src":"add55"},
{"c":"C","art":"Art. 18 cpv. 8","it":{"q":"Quando il libretto di lavoro deve essere restituito al datore di lavoro?","a":["Quando è pieno o termina il rapporto di lavoro","Alla fine di ogni mese, anche se non è pieno","Alla fine di ogni anno, anche se non è pieno"]},"en":{"q":"When must the work record book be returned to the employer?","a":["When it is full or the employment ends","At the end of every month, even if not full","At the end of every year, even if not full"]},"x":{"it":"Il libretto torna al datore di lavoro quando è pieno o quando finisce il rapporto di lavoro, perché deve essere conservato in azienda. Non c'è una scadenza mensile o annuale.","en":"The book goes back to the employer when it is full or when the employment ends, because it has to be kept at the business. There is no monthly or yearly deadline."},"src":"add56"},
{"c":"C","art":"Art. 19 cpv. 3","it":{"q":"Un conducente lavora secondo un orario quotidiano invariabile. Può essere dispensato dai fogli quotidiani e settimanali?","a":["Sì, per un anno, prorogabile a certe condizioni","Sì, per cinque anni, con proroga automatica","No, solo con rapporti giornalieri aziendali"]},"en":{"q":"A driver works according to an unchanging daily schedule. Can they be exempted from the daily and weekly sheets?","a":["Yes, for one year, renewable under conditions","Yes, for five years, renewed automatically","No, only where in-house daily reports are kept"]},"x":{"it":"Chi ha un orario sempre uguale può essere dispensato dai fogli, ma solo per un anno alla volta. La dispensa non viene rinnovata se nell'anno ha fatto più di 20 corse fuori dall'orario.","en":"Someone whose schedule is always the same can be exempted from the sheets, but only for one year at a time. The exemption is not renewed if they made more than 20 trips outside the schedule during the year."},"src":"add57"},
{"c":"C","art":"Art. 19 cpv. 6","it":{"q":"La dispensa dalla compilazione del libretto di lavoro vale anche all'estero?","a":["No, è valevole soltanto in Svizzera","Sì, se il conducente la porta con sé","Sì, ma soltanto nei Paesi dell'Unione europea"]},"en":{"q":"Is the exemption from filling in the work record book also valid abroad?","a":["No, it is valid only in Switzerland","Yes, if the driver carries it with them","Yes, but only in European Union countries"]},"x":{"it":"La dispensa è una decisione di un'autorità svizzera e vale solo in Svizzera. Appena si va all'estero, il libretto di lavoro va compilato normalmente.","en":"The exemption is a decision by a Swiss authority and is valid only in Switzerland. As soon as you go abroad, the work record book must be filled in as normal."},"src":"add58"},
{"c":"C","art":"Art. 19 cpv. 6","it":{"q":"Un conducente dispensato dalla compilazione del libretto di lavoro effettua una corsa all'estero. Deve compilare il libretto?","a":["Sì, occorresse compilarlo sempre","No, la dispensa vale anche all'estero","No, basta portare con sé la dispensa"]},"en":{"q":"A driver exempted from filling in the work record book makes a trip abroad. Must they fill in the book?","a":["Yes, abroad it must always be filled in","No, the exemption is also valid abroad","No, carrying the exemption is enough"]},"x":{"it":"La dispensa vale solo in Svizzera. All'estero il libretto di lavoro va sempre compilato, anche se si porta con sé la dispensa. «Occorresse» viene da «occorrere»: essere necessario.","en":"The exemption is valid only in Switzerland. Abroad the work record book must always be filled in, even if you carry the exemption. Italian “occorresse” comes from “occorrere”: to be necessary."},"src":"add137"},
{"c":"C","art":"Art. 19 cpv. 2 e 4","it":{"q":"Cosa deve portare con sé un conducente che ha ottenuto una dispensa?","a":["La dispensa e, se del caso, i rapporti giornalieri","Soltanto la licenza di condurre con il codice 121","Nulla: dispensa e rapporti restano in azienda"]},"en":{"q":"What must a driver who has obtained an exemption carry with them?","a":["The exemption and, where applicable, the daily reports","Only the driving licence with code 121","Nothing: exemption and reports stay at the business"]},"x":{"it":"Al controllo devi poter provare la dispensa: porti con te la decisione e, se la dispensa si basa sui rapporti giornalieri dell'azienda, anche quelli della settimana in corso.","en":"At a check you must be able to prove the exemption: you carry the decision and, if it is based on the business's daily reports, also those of the current week."},"src":"add59"},
{"c":"C","art":"Art. 21 cpv. 2","it":{"q":"Un lavoratore guida chiaramente meno di 7 ore al giorno. Il datore di lavoro deve iscrivere la durata della guida nel registro?","a":["No, basta includerla nella durata del lavoro","Sì, va sempre iscritta separatamente","Solo se la guida è inferiore a 5 ore al giorno"]},"en":{"q":"An employee clearly drives less than 7 hours a day. Must the employer enter the driving time in the register?","a":["No, including it in the working time is enough","Yes, it must always be entered separately","Only if they drive less than 5 hours a day"]},"x":{"it":"Se è evidente che il lavoratore guida meno di 7 ore al giorno, il limite di 9 ore non è in pericolo. Allora la guida non va scritta a parte: basta includerla nel tempo di lavoro totale del giorno.","en":"If it is clear that the employee drives less than 7 hours a day, the 9-hour limit is not at risk. Then driving need not be entered separately: it is enough to include it in the day's total working time."},"src":"add60"},
{"c":"C","art":"Art. 21 cpv. 5","it":{"q":"Entro quando il registro del datore di lavoro deve contenere tutte le iscrizioni?","a":["Alla fine del mese, per il penultimo mese","Alla fine del mese, per il mese in corso","Alla fine dell'anno, per l'anno precedente"]},"en":{"q":"By when must the employer's register contain all entries?","a":["By the end of the month, for the month before last","By the end of the month, for the current month","By the end of the year, for the previous year"]},"x":{"it":"Il datore di lavoro ha un po' di margine: alla fine di ogni mese il registro deve essere completo fino al penultimo mese. Per esempio, a fine marzo devono esserci tutte le iscrizioni di gennaio.","en":"The employer has some leeway: at the end of each month the register must be complete up to the month before last. For example, at the end of March all the January entries must be there."},"src":"add61"},
{"c":"C","art":"Art. 21 cpv. 6","it":{"q":"Il datore di lavoro fa tenere il registro da una fiduciaria. Chi risponde dell'esattezza delle iscrizioni?","a":["Il datore di lavoro","La fiduciaria incaricata","Il conducente"]},"en":{"q":"The employer has an outside accounting firm keep the register. Who is responsible for the accuracy of the entries?","a":["The employer","The accounting firm","The driver"]},"x":{"it":"Il datore di lavoro può far tenere il registro da qualcun altro, ma la responsabilità resta sua: se le iscrizioni sono sbagliate, ne risponde lui.","en":"The employer may have someone else keep the register, but the responsibility stays with them: if the entries are wrong, the employer answers for it."},"src":"add62"},
{"c":"C","art":"Art. 22 cpv. 3-4","it":{"q":"Cosa deve mettere a disposizione del conducente il datore di lavoro?","a":["Libretto di lavoro, chiavi e dischi del tachigrafo","Libretto di lavoro e un tachigrafo di riserva","Chiavi e dischi; il libretto lo compra il conducente"]},"en":{"q":"What must the employer make available to the driver?","a":["Work record book, tachograph keys and sheets","Work record book and a spare tachograph","Keys and sheets; the driver buys the book"]},"x":{"it":"Il datore di lavoro deve fornire al conducente tutto ciò che serve per registrare i tempi: il libretto di lavoro, le chiavi del tachigrafo e i dischi. Il conducente non deve comprarli.","en":"The employer must give the driver everything needed to record the times: the work record book, the tachograph keys and the sheets. The driver does not have to buy them."},"src":"add63"},
{"c":"C","art":"Art. 23 cpv. 1-2","it":{"q":"L'autorità d'esecuzione chiede informazioni e vuole accedere all'azienda per un controllo. Il datore di lavoro può rifiutare?","a":["No, deve informare e permettere l'accesso","Sì, se manca un mandato scritto del giudice","Sì, se tutti i conducenti sono indipendenti"]},"en":{"q":"The enforcement authority asks for information and wants access to the business for a check. May the employer refuse?","a":["No, they must give information and allow access","Yes, if there is no written court warrant","Yes, if all the drivers are self-employed"]},"x":{"it":"Il datore di lavoro è obbligato a collaborare ai controlli: deve dare all'autorità tutte le informazioni necessarie e lasciarla entrare in azienda. Non serve un mandato del giudice.","en":"The employer is obliged to cooperate with checks: they must give the authority all necessary information and let it enter the business. No court warrant is needed."},"src":"add64"},
{"c":"C","art":"Art. 28 cpv. 4","it":{"q":"Un datore di lavoro induce un conducente a violare l'OLR 2, oppure non lo impedisce pur potendolo. Quale pena rischia?","a":["La stessa pena prevista per il conducente","Nessuna pena: risponde soltanto il conducente","Una pena più lieve di quella del conducente"]},"en":{"q":"An employer induces a driver to violate the OLR 2, or fails to prevent it although they could. What penalty do they risk?","a":["The same penalty as the driver","No penalty: only the driver is liable","A lighter penalty than the driver's"]},"x":{"it":"Chi spinge un conducente a violare le regole, o non lo impedisce pur potendo, è responsabile quanto lui e riceve la stessa pena. Per il lavoratore il giudice può invece ridurre la pena.","en":"Anyone who pushes a driver to break the rules, or fails to prevent it when they could, is as responsible as the driver and gets the same penalty. For the employee, by contrast, the judge may reduce the penalty."},"src":"add65"},
{"c":"C","art":"Art. 29-32","it":{"q":"Chi è competente per il perseguimento penale delle violazioni dell'OLR 2 e chi vigila sull'applicazione dell'ordinanza?","a":["I Cantoni perseguono; l'USTRA vigila","L'USTRA persegue; i Cantoni vigilano","I Comuni perseguono; il DATEC vigila"]},"en":{"q":"Who prosecutes OLR 2 violations and who supervises the enforcement of the ordinance?","a":["Cantons prosecute; Federal Roads Office supervises","Federal Roads Office prosecutes; cantons supervise","Municipalities prosecute; DETEC supervises"]},"x":{"it":"I Cantoni fanno i controlli e perseguono le violazioni. L'USTRA (Ufficio federale delle strade) esercita la sovrintendenza, cioè sorveglia dall'alto come viene applicata l'ordinanza.","en":"The cantons carry out the checks and prosecute violations. The Federal Roads Office supervises, meaning it oversees from above how the ordinance is applied."},"src":"add66"},
{"c":"P","art":"Art. 3 cpv. 2","it":{"q":"Esegui un trasporto all'estero con un taxi immatricolato in Svizzera che ha al massimo 8 posti oltre al conducente. Quale ordinanza vale per te?","a":["L'OLR 2, salvo accordi internazionali più severi","L'OLR 1, salvo accordi internazionali più severi","Soltanto gli accordi internazionali"]},"en":{"q":"You carry out a trip abroad with a Swiss-registered taxi that has at most 8 seats besides the driver. Which ordinance applies to you?","a":["The OLR 2, unless international rules are stricter","The OLR 1, unless international rules are stricter","Only the international agreements"]},"x":{"it":"Con al massimo 8 posti oltre al conducente l'OLR 2 ti segue anche all'estero. Solo se un accordo internazionale ratificato dalla Svizzera è più severo, vale quello.","en":"With at most 8 seats besides the driver, OLR 2 follows you abroad too. Only if an international agreement ratified by Switzerland is stricter does that apply instead."},"src":"add74"},
