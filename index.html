{"c":"O","art":"Art. 20","it":{"q":"Dopo aver derogato alle norme in un'emergenza, il conducente deve...","a":["Annotare motivo ed entità nel libretto e nel registro e compensare entro la fine della settimana successiva","Compensare entro i tre mesi successivi; un'annotazione nel libretto di lavoro non è richiesta","Annotare la deroga nel registro; la compensazione non serve se è durata meno di due ore"]},"en":{"q":"After deviating from the rules in an emergency, the driver must...","a":["Note reason and extent in the work record book and register and compensate by the end of the following week","Compensate within the following three months; a note in the work record book is not required","Note the deviation in the register; no compensation is needed if it lasted under two hours"]},"x":{"it":"Dopo un'emergenza si scrive perché e di quanto si è derogato, sia nel libretto di lavoro sia nel registro, e si compensa entro la fine della settimana successiva.","en":"After an emergency you write down why and by how much you deviated, in both the work record book and the register, and you compensate for it by the end of the following week."},"src":"ref74"},
{"c":"C","art":"Art. 22 cpv. 1","it":{"q":"Per quanto riguarda la pianificazione, il datore di lavoro deve...","a":["Organizzare il lavoro in modo che il conducente possa rispettare tempo di lavoro, guida e riposo","Lasciare la pianificazione delle pause e dei riposi interamente a ogni conducente","Pianificare il lavoro in modo da sfruttare ogni settimana tutte le ore di straordinario"]},"en":{"q":"Regarding scheduling, the employer must...","a":["Organise the work so that the driver can comply with working, driving and rest times","Leave the planning of breaks and rest periods entirely to each driver","Plan the work so that all permitted overtime hours are used every week"]},"x":{"it":"È il datore di lavoro che assegna turni e corse, quindi deve organizzarli in modo che il conducente possa rispettare tempo di lavoro, guida e riposo.","en":"It is the employer who assigns shifts and trips, so they must plan them in a way that lets the driver keep to working time, driving time and rest."},"src":"ref75"},
{"c":"O","art":"Art. 8 cpv. 3 lett. b","it":{"q":"Per un tempo di lavoro giornaliero SUPERIORE a 7 ore ma non più di 9 ore (es. 8 ore), la pausa lavorativa minima è di...","a":["Almeno 30 minuti, oppure due pause di almeno 20 minuti ciascuna","Almeno 10 minuti, presi prima della fine del turno","Almeno 1 ora, oppure due pause di almeno 30 minuti ciascuna"]},"en":{"q":"For a daily working time of MORE THAN 7 hours but not more than 9 hours (e.g. 8 hours), the minimum work break is...","a":["At least 30 minutes, or two breaks of at least 20 minutes each","At least 10 minutes, taken before the end of the shift","At least 1 hour, or two breaks of at least 30 minutes each"]},"x":{"it":"8 ore stanno nella fascia «oltre 7 e fino a 9 ore»: la pausa è di 30 minuti, oppure due pause di 20 minuti ciascuna. 1 ora serve solo oltre le 9 ore di lavoro.","en":"8 hours falls in the band “more than 7 and up to 9 hours”: the break is 30 minutes, or two breaks of 20 minutes each. 1 hour is needed only above 9 hours of work."},"src":"ref76"},
{"c":"O","art":"Art. 8 cpv. 3 lett. c","it":{"q":"In quante parti può essere divisa al massimo la pausa lavorativa di 1 ora (tempo di lavoro giornaliero oltre 9 ore)?","a":["In 3 parti di almeno 20 minuti ciascuna, oppure 2 parti di almeno 30 minuti","In 2 parti di almeno 15 minuti ciascuna, ma mai in 3 parti","Non può essere divisa; deve essere presa come un'ora intera"]},"en":{"q":"Into how many parts may the 1-hour work break (daily working time over 9 hours) be divided at most?","a":["Into 3 parts of at least 20 minutes each, or 2 parts of at least 30 minutes","Into 2 parts of at least 15 minutes each, but never into 3 parts","It may not be divided; it must be taken as one full hour"]},"x":{"it":"L'ora di pausa può essere presa intera, in 2 parti da 30 minuti o in 3 parti da 20 minuti. Di più non si può dividere, perché nessuna parte può durare meno di 20 minuti.","en":"The one-hour break may be taken whole, in 2 parts of 30 minutes or in 3 parts of 20 minutes. It cannot be split further, because no part may be shorter than 20 minutes."},"src":"ref77"},
{"c":"O","art":"Art. 8 cpv. 4","it":{"q":"Come devono essere distribuite le pause di lavoro nella giornata lavorativa?","a":["Tra due pause, o tra una pausa e un riposo, non più di 5 ore e mezza di lavoro","Una pausa al più tardi dopo ogni 4 ore di lavoro, indipendentemente dai riposi","Almeno la metà del tempo totale di pausa nella prima metà della giornata"]},"en":{"q":"How must the work breaks be distributed over the working day?","a":["Between two breaks, or between a break and a rest, no more than 5½ hours of work","A break at the latest after every 4 hours of work, regardless of rest periods","At least half of the total break time in the first half of the working day"]},"x":{"it":"La regola è una sola: mai più di 5 ore e mezza di lavoro di seguito senza una pausa (o senza che inizi il riposo). Non esiste l'obbligo di fare una pausa ogni 4 ore.","en":"There is just one rule: never more than 5½ hours of work in a row without a break (or without the rest starting). There is no duty to take a break every 4 hours."},"src":"ref78"},
{"c":"O","art":"Art. 8 cpv. 3","it":{"q":"Qual è la durata minima che può contare come parte di una pausa di lavoro?","a":["20 minuti – le interruzioni di meno di 15 minuti contano addirittura come tempo di lavoro","15 minuti – tutto ciò che è più breve conta come normale tempo di lavoro","10 minuti – le interruzioni più brevi vengono contate come tempo di riposo"]},"en":{"q":"What is the shortest time that can count as part of a work break?","a":["20 minutes – interruptions of less than 15 minutes even count as working time","15 minutes – anything shorter than that counts as ordinary working time","10 minutes – shorter interruptions are counted as rest time instead"]},"x":{"it":"Una parte di pausa di lavoro deve durare almeno 20 minuti. Le interruzioni sotto i 15 minuti non sono pause: vengono contate come tempo di lavoro.","en":"A part of a work break must last at least 20 minutes. Interruptions under 15 minutes are not breaks at all: they are counted as working time."},"src":"ref79"},
{"c":"C","art":"Uso del tachigrafo","it":{"q":"Come si inserisce correttamente il disco nel tachigrafo analogico?","a":["Con la parte verde o nera verso l'alto; poi si chiude il coperchio e si posizionano i commutatori","Con il lato stampato verso il basso; poi si blocca con la chiave e si annota l'ora sul retro","Mentre il veicolo si muove lentamente; poi si preme la lampada di avvertimento"]},"en":{"q":"How is the record sheet correctly inserted into the analogue tachograph?","a":["Green or black side up; then close the cover and set the time-group switches","Printed side down; then lock it with the key and note the time on the back","While the vehicle is moving slowly; then press the warning lamp"]},"x":{"it":"Il disco va messo con il lato di registrazione (verde o nero) verso l'alto, perché è lì che l'apparecchio scrive. Poi si chiude il coperchio e si mettono i commutatori sull'attività giusta.","en":"The sheet goes in with the recording side (green or black) facing up, because that is where the device writes. Then you close the cover and set the switches to the right activity."},"src":"ref80"},
{"c":"C","art":"OLR 1 art. 14a (via art. 16a)","it":{"q":"Un conducente cambia veicolo durante la giornata lavorativa (tachigrafo UE). Cosa succede con il suo disco?","a":["Il disco è personale: lo porta con sé e annota il cambio di veicolo a mano sul retro del disco","Il disco appartiene al veicolo: resta nel tachigrafo per il conducente successivo","Consegna il disco al datore di lavoro prima di salire sul nuovo veicolo"]},"en":{"q":"A driver changes vehicle during the working day (EU tachograph). What happens with their record sheet?","a":["The sheet is personal: they take it and note the vehicle change by hand on the back","The sheet belongs to the vehicle: it stays in and the next driver continues on it","They hand the sheet to the employer and start a new sheet in the new vehicle"]},"x":{"it":"Con il tachigrafo UE il disco è personale e segue il conducente, non il veicolo. Per questo lo porti con te e scrivi a mano sul retro il cambio di veicolo.","en":"With the EU tachograph the sheet is personal and follows the driver, not the vehicle. That is why you take it with you and write the change of vehicle by hand on the back."},"src":"ref81"},
{"c":"C","art":"OLR 1 art. 14a (via art. 16a)","it":{"q":"Al cambio di conducente con un tachigrafo UE, cosa succede con i dischi?","a":["Chi lascia il veicolo prende il proprio disco; il nuovo conducente inserisce il suo","Chi lascia il veicolo lascia il disco inserito; il nuovo conducente continua sullo stesso","Chi lascia il veicolo gira il disco; il nuovo conducente registra sul retro"]},"en":{"q":"At a change of driver with an EU tachograph, what happens with the record sheets?","a":["The driver leaving takes their own sheet; the new driver inserts their own","The driver leaving leaves the sheet in; the new driver continues on the same one","The driver leaving turns the sheet over; the new driver records on the back"]},"x":{"it":"Con il tachigrafo UE ogni conducente ha il proprio disco: chi scende lo toglie e lo porta via, chi sale inserisce il suo. Solo con il tachigrafo CH il disco resta nel veicolo.","en":"With the EU tachograph each driver has their own sheet: the one leaving takes theirs out and away, the one starting inserts their own. Only with the CH tachograph does the sheet stay in the vehicle."},"src":"ref82"},
{"c":"C","art":"Art. 16 cpv. 3 / OLR 1 art. 14a","it":{"q":"Quali iscrizioni si devono fare sul disco PRIMA di inserirlo?","a":["Cognome e nome, luogo di partenza, data (riga sopra), targa e chilometri alla partenza","Cognome e nome, luogo di arrivo, data (riga sotto), targa e chilometri all'arrivo","Datore di lavoro, luogo di partenza, data (riga sopra), numero interno e ora di partenza"]},"en":{"q":"Which entries must be made on the record sheet BEFORE inserting it?","a":["Name, place of departure, date (upper line), registration number and odometer at the start","Name, place of arrival, date (lower line), registration number and odometer at the end","Employer, place of departure, date (upper line), fleet number and departure time"]},"x":{"it":"Prima di inserire il disco si scrive ciò che si sa alla partenza: chi guida, da dove parte, la data (riga sopra), la targa e i chilometri alla partenza. I dati di arrivo si scrivono dopo.","en":"Before inserting the sheet you write what is known at the start: who is driving, where from, the date (upper line), the registration number and the odometer at the start. The arrival data are written afterwards."},"src":"ref83"},
{"c":"C","art":"Art. 16 cpv. 3 / OLR 1 art. 14a","it":{"q":"Quali iscrizioni si fanno dopo l'estrazione del disco, terminata l'ultima corsa della giornata?","a":["Luogo dell'estrazione, data (riga sotto), nuovo stato dei chilometri e totale percorso","Luogo dell'estrazione, data (riga sopra), numero di corse e incasso della giornata","Luogo di partenza, data (riga sotto), vecchio stato dei chilometri e ora dell'ultima corsa"]},"en":{"q":"Which entries are made after removing the sheet at the end of the last trip of the day?","a":["Place of removal, date (lower line), new odometer reading and total distance driven","Place of removal, date (upper line), number of trips and total fares of the day","Place of departure, date (lower line), old odometer reading and time of the last trip"]},"x":{"it":"Dopo aver tolto il disco lo si completa con i dati di fine giornata: dove è stato tolto, la data (riga sotto), i nuovi chilometri e il totale percorso. Corse e incassi non si scrivono sul disco.","en":"After removing the sheet you complete it with the end-of-day data: where it was removed, the date (lower line), the new odometer reading and the total distance. Trips and takings are not written on the sheet."},"src":"ref84"},
{"c":"C","art":"OLR 1 art. 14a cpv. 3","it":{"q":"Il tachigrafo smette di registrare correttamente durante la giornata. Cosa deve fare il conducente con i dati mancanti?","a":["Annotarli a mano sul disco oppure su un foglio speciale da accludere al disco","Annotarli a mano nel registro del datore di lavoro alla fine del mese","Farli stimare dal datore di lavoro e farli confermare per iscritto"]},"en":{"q":"The tachograph stops recording correctly during the day. What must the driver do with the missing data?","a":["Enter them by hand on the sheet or on a special sheet attached to it","Enter them by hand in the employer's register at the end of the month","Have the employer estimate them and confirm them in writing"]},"x":{"it":"Se il tachigrafo non registra bene, i tempi mancanti li scrivi tu a mano sul disco, oppure su un foglio a parte che resta allegato al disco. Non si aspetta fine mese e non si fanno stime.","en":"If the tachograph is not recording properly, you write the missing times by hand on the sheet yourself, or on a separate sheet that stays attached to it. You do not wait until the end of the month or use estimates."},"src":"ref85"},
{"c":"C","art":"Art. 16 cpv. 1","it":{"q":"Con il tachigrafo CH (disco legato al veicolo), quali dischi il conducente deve poter presentare a un controllo?","a":["Il disco del giorno e, se il giorno precedente era feriale, anche quello (o una copia)","Il disco del giorno e tutti i dischi dei 28 giorni precedenti, con la carta del conducente","Solo il disco del giorno; i dischi precedenti restano presso il datore di lavoro"]},"en":{"q":"With a CH tachograph (sheet tied to the vehicle), which sheets must the driver be able to present at a check?","a":["The current day's sheet and, if the previous day was a working day, that one too (or a copy)","The current day's sheet and all sheets of the previous 28 days, with the driver card","Only the current day's sheet; the earlier sheets stay with the employer"]},"x":{"it":"Con il tachigrafo CH basta il disco di oggi più quello di ieri (o una copia), se ieri era un giorno feriale. I 28 giorni e la carta del conducente riguardano il tachigrafo UE.","en":"With the CH tachograph today's sheet is enough, plus yesterday's (or a copy) if yesterday was a working day. The 28 days and the driver card concern the EU tachograph."},"src":"ref86"},
{"c":"C","art":"Art. 16 cpv. 4","it":{"q":"Cos'è il blocchetto settimanale (per l'odocronografo settimanale)?","a":["Un blocchetto di 5, 6 o 7 dischi che registra senza interruzione; ogni disco inizia alle 00:00","Un unico grande disco con sette anelli concentrici, uno per ogni giorno della settimana","Una scheda di memoria digitale che il datore di lavoro legge ogni lunedì"]},"en":{"q":"What is the weekly booklet used with a 7-day tachograph?","a":["A booklet of 5, 6 or 7 sheets that records without interruption; each sheet starts at 00:00","A single large sheet with seven concentric rings, one for each day of the week","A digital memory card that the employer reads out every Monday"]},"x":{"it":"Il blocchetto settimanale è un pacchetto di 5, 6 o 7 dischi messi uno sopra l'altro: l'apparecchio passa da solo da un disco al successivo e ogni disco inizia a mezzanotte.","en":"The weekly booklet is a pack of 5, 6 or 7 sheets stacked on top of each other: the device moves on from one sheet to the next by itself and each sheet starts at midnight."},"src":"ref87"},
{"c":"C","art":"Art. 16 cpv. 5","it":{"q":"Come si riconosce il disco diagrammale speciale per l'odocronografo settimanale?","a":["Pausa di circa 30°, rotazione di 26 ore e scritta «1 disco giornaliero per apparato di 7 giorni»","Pausa di circa 90°, rotazione di 24 ore e scritta «disco settimanale per apparati giornalieri»","È grande il doppio di un disco giornaliero normale ed è stampato su carta arancione"]},"en":{"q":"How can you recognise the special daily sheet for a 7-day tachograph?","a":["A gap of about 30°, a 26-hour rotation and the marking \"1 daily sheet for 7-day device\"","A gap of about 90°, a 24-hour rotation and the marking \"weekly sheet for daily devices\"","It is twice as large as a normal daily sheet and is printed on orange paper"]},"x":{"it":"Il disco speciale si riconosce da tre segni: uno spazio vuoto di circa 30°, una rotazione di 26 ore invece di 24 e la scritta «1 disco giornaliero per apparato di 7 giorni».","en":"The special sheet has three tell-tale signs: an empty gap of about 30°, a 26-hour rotation instead of 24, and the marking “1 daily sheet for 7-day device”."},"src":"ref88"},
{"c":"C","art":"Simboli del tachigrafo","it":{"q":"Nel libretto di lavoro e nelle registrazioni del tachigrafo, il simbolo del volante indica...","a":["Il tempo di guida","Ogni altro tempo di lavoro","Le pause e il tempo di riposo"]},"en":{"q":"In the work record book and on tachograph records, the steering-wheel symbol stands for...","a":["Driving time","All other working time","Breaks and rest time"]},"x":{"it":"Il volante è il simbolo della guida. Gli altri lavori (martelli incrociati), la disponibilità (quadrato barrato) e le pause hanno ciascuno un simbolo diverso.","en":"The steering wheel is the symbol for driving. Other work (crossed hammers), availability (crossed square) and breaks each have a different symbol."},"src":"ref89"},
{"c":"C","art":"Simboli del tachigrafo","it":{"q":"Il simbolo del quadrato barrato nelle registrazioni del tachigrafo indica...","a":["La disponibilità: attesa, tempo in cabina come secondo autista, cuccetta durante la marcia","Il tempo di guida: autostrada, fuori dai centri abitati e con passeggeri a bordo","Gli altri lavori: carico e scarico, pulizia, manutenzione e rifornimento"]},"en":{"q":"The crossed-square symbol on tachograph records stands for...","a":["Availability: waiting, time in the cab as second driver, bunk while the vehicle is moving","Driving time: motorways, outside built-up areas and with passengers on board","Other work: loading and unloading, cleaning, maintenance and refuelling"]},"x":{"it":"Il quadrato barrato indica la disponibilità: non guidi e non lavori attivamente, ma sei pronto a farlo (attesa, secondo autista in cabina). La guida ha il volante e gli altri lavori i martelli incrociati.","en":"The crossed square stands for availability: you are not driving or actively working, but ready to (waiting, second driver in the cab). Driving has the steering wheel and other work the crossed hammers."},"src":"ref90"},
{"c":"C","art":"Art. 18 cpv. 5","it":{"q":"Come devono essere fatte le iscrizioni sul foglio giornaliero del libretto di lavoro?","a":["Subito a ogni cambiamento di attività, in modo continuo e precise al quarto d'ora","Una volta alla fine della giornata, con i tempi arrotondati all'ora piena","Solo per i periodi di guida; pause e altri lavori non devono essere iscritti"]},"en":{"q":"How must the entries on the daily sheet of the work record book be made?","a":["Immediately at every change of activity, continuously and accurate to the quarter hour","Once at the end of the working day, with times rounded to the full hour","Only for driving periods; breaks and other work need not be entered"]},"x":{"it":"Il foglio giornaliero sostituisce il tachigrafo, quindi va aggiornato subito a ogni cambio di attività (guida, lavoro, pausa), senza buchi e con precisione al quarto d'ora.","en":"The daily sheet stands in for the tachograph, so it must be updated straight away at every change of activity (driving, work, break), without gaps and accurate to the quarter-hour."},"src":"ref91"},
{"c":"C","art":"Art. 18 cpv. 2","it":{"q":"Cosa deve iscrivere ogni giorno un conducente DIPENDENTE nel foglio settimanale?","a":["Riposo precedente e ora d'inizio, la targa prima di ogni corsa e l'ora di fine lavoro","Ore lavorate e straordinari, la targa prima di ogni corsa e la firma a fine giornata","Incassi e mance, i chilometri prima di ogni corsa e l'ora di fine lavoro"]},"en":{"q":"What must an EMPLOYED driver enter in the weekly sheet each day?","a":["Previous rest and start time, the registration number before each trip and the end time","Hours worked and overtime, the registration number before each trip and a signature","Fares and tips, the kilometres before each trip and the end time"]},"x":{"it":"Nel foglio settimanale il dipendente scrive ogni giorno il riposo fatto prima, l'ora di inizio, la targa prima di ogni corsa e l'ora di fine lavoro. Incassi, mance e firme non sono richiesti.","en":"In the weekly sheet the employee writes each day the rest taken beforehand, the start time, the registration number before each trip and the end time. Takings, tips and signatures are not required."},"src":"ref92"},
{"c":"V","art":"ONC (regola dei manuali)","it":{"q":"Quando è vietato il consumo di bevande alcoliche per il conducente?","a":["Durante tutto il tempo di lavoro e nelle 6 ore che precedono l'inizio del lavoro","Durante tutto il tempo di lavoro e nelle 2 ore che precedono l'inizio del lavoro","Solo mentre i passeggeri vengono effettivamente trasportati nel veicolo"]},"en":{"q":"When is the driver not allowed to drink alcohol?","a":["During the whole working time and within the 6 hours before the start of work","During the whole working time and within the 2 hours before the start of work","Only while passengers are actually being transported in the vehicle"]},"x":{"it":"All'esame la risposta attesa è: niente alcol durante il lavoro e nelle 6 ore prima di iniziare. Oggi la legge vieta inoltre di guidare con 0,10 per mille o più nel trasporto professionale di persone.","en":"The answer expected in the exam is: no alcohol during work and in the 6 hours before starting. Today the law also bans driving with 0.10 per mille or more in professional passenger transport."},"src":"ref93"},
{"c":"T","art":"Art. 3 cpv. 1bis","it":{"q":"Quando le corse sono considerate \"regolari\" (trasporto professionale)?","a":["Quando vengono effettuate almeno due volte a intervalli di meno di 16 giorni","Quando vengono effettuate almeno una volta a intervalli di 16 giorni","Quando vengono effettuate in ogni giorno lavorativo della settimana"]},"en":{"q":"When do trips count as \"regular\" (professional transport)?","a":["When they are made at least twice at intervals of less than 16 days","When they are made at least once in every period of 16 days","When they are made on every single working day of the week"]},"x":{"it":"Le corse sono «regolari» se si ripetono: almeno due corse con meno di 16 giorni tra l'una e l'altra. Una sola corsa, o corse a 16 giorni o più di distanza, non bastano.","en":"Trips are “regular” if they are repeated: at least two trips with less than 16 days between them. A single trip, or trips 16 or more days apart, is not enough."},"src":"ref94"},
{"c":"T","art":"Art. 3 cpv. 1bis","it":{"q":"Quando il \"successo economico\" di una corsa è considerato dato?","a":["Quando il prezzo della corsa supera i costi del veicolo e le spese del conducente","Quando per la corsa viene effettuato un qualsiasi pagamento, anche simbolico","Quando il prezzo della corsa copre esattamente i costi del carburante"]},"en":{"q":"When is a trip considered to bring an economic profit?","a":["When the fare exceeds the vehicle costs and the driver's expenses","When any payment at all is made for the trip, even a symbolic one","When the fare covers exactly the fuel costs of the trip"]},"x":{"it":"C'è successo economico quando il prezzo della corsa è più alto dei costi del veicolo e delle spese del conducente, cioè quando resta un guadagno. Coprire soltanto i costi non basta.","en":"There is economic success when the fare is higher than the vehicle costs and the driver's expenses, in other words when a profit is left. Merely covering the costs is not enough."},"src":"ref95"},
{"c":"P","art":"Art. 4 cpv. 1","it":{"q":"Per quali corse NON si applica l'OLR 2?","a":["Ambulanze, veicoli fino a 30 km/h, trasporti di disabili, scolari e operai","Trasferimenti aeroportuali, veicoli fino a 45 km/h, navette d'albergo e corse prenotate","Corse notturne, veicoli fino a 30 km/h, corse di domenica e corse fuori cantone"]},"en":{"q":"To which trips does the OLR 2 NOT apply?","a":["Ambulances, vehicles up to 30 km/h, transport of disabled persons, schoolchildren and workers","Airport transfers, vehicles up to 45 km/h, hotel shuttles and trips ordered in advance","Night trips, vehicles up to 30 km/h, Sunday trips and trips outside the canton"]},"x":{"it":"Le eccezioni dell'OLR 2 sono: ambulanze, veicoli che non superano i 30 km/h e trasporti di disabili, scolari e operai. Corse notturne, prenotate o per l'aeroporto restano normali trasporti professionali.","en":"The exceptions to OLR 2 are: ambulances, vehicles that cannot exceed 30 km/h, and transport of disabled persons, schoolchildren and workers. Night trips, pre-booked trips and airport runs remain normal professional transport."},"src":"ref96"},
{"c":"O","art":"Art. 12 cpv. 3","it":{"q":"Se due mezze giornate libere vengono unite in un giorno libero, esso copre...","a":["L'intero periodo dalle 07:00 alle 18:00, con il riposo giornaliero subito prima o dopo","L'intero periodo dalle 06:00 alle 20:00, qualunque sia la posizione del riposo giornaliero","10 ore consecutive scelte dal dipendente, con il riposo giornaliero subito dopo"]},"en":{"q":"If two free half-days are combined into one free day, it covers...","a":["The whole period from 07:00 to 18:00, with the daily rest immediately before or after","The whole period from 06:00 to 20:00, wherever the daily rest is placed","Any 10 consecutive hours chosen by the employee, with the daily rest right after"]},"x":{"it":"Due mezze giornate insieme devono dare un vero giorno libero: tutta la fascia diurna dalle 07:00 alle 18:00, con il riposo giornaliero attaccato subito prima o subito dopo.","en":"Two half-days together must give a real day off: the whole daytime period from 07:00 to 18:00, with the daily rest attached immediately before or after."},"src":"ref97"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Quali limiti di orario valgono per il riposo di 24 ore che compensa una domenica lavorata?","a":["Deve iniziare non più tardi delle 06:00 e terminare non prima delle 20:00","Deve iniziare non più tardi delle 08:00 e terminare non prima delle 18:00","Deve iniziare esattamente a mezzanotte e terminare anch'esso a mezzanotte"]},"en":{"q":"Which time limits apply to the 24-hour rest that compensates a worked Sunday?","a":["It must begin no later than 06:00 and end no earlier than 20:00","It must begin no later than 08:00 and end no earlier than 18:00","It must begin exactly at midnight and also end exactly at midnight"]},"x":{"it":"Il riposo che compensa la domenica lavorata deve coprire tutta la giornata: inizia al più tardi alle 06:00 e non finisce prima delle 20:00.","en":"The rest that makes up for a worked Sunday must cover the whole day: it starts at 06:00 at the latest and does not end before 20:00."},"src":"ref98"},
{"c":"O","art":"Art. 11 + 9 + 12","it":{"q":"Un conducente dipendente prende insieme il giorno di riposo settimanale, il riposo giornaliero normale e la mezza giornata libera. Per quanto tempo deve restare lontano dal lavoro?","a":["40 ore (24 + 11 + 5)","38 ore (24 + 9 + 5)","35 ore (24 + 11)"]},"en":{"q":"An employed driver takes the weekly rest day, the normal daily rest and the free half-day together. How many hours off work does that make in total?","a":["40 hours (24 + 11 + 5)","38 hours (24 + 9 + 5)","35 hours (24 + 11)"]},"x":{"it":"Si sommano i tre riposi: 24 ore di giorno di riposo + 11 ore di riposo giornaliero normale + 5 ore di mezza giornata = 40 ore. 38 ore sarebbero con il riposo ridotto a 9 ore.","en":"You add the three rests: 24 hours for the rest day + 11 hours of normal daily rest + 5 hours for the half-day = 40 hours. 38 hours would be with the rest reduced to 9 hours."},"src":"ref99"},
{"c":"O","art":"Art. 5 cpv. 3","it":{"q":"Se il lavoro è organizzato a turni, i turni devono cambiare al più tardi dopo...","a":["6 settimane, salvo che il dipendente acconsenta espressamente a un'altra soluzione","2 settimane, salvo che l'autorità di esecuzione conceda un'eccezione","Non devono mai cambiare se il salario include un supplemento notturno"]},"en":{"q":"If the work is organised in shifts, when must employees change shift at the latest?","a":["After 6 weeks, unless the employee expressly agrees otherwise","After 2 weeks, unless the enforcement authority grants an exception","Never, if the wage includes a supplement for night work"]},"x":{"it":"Nessuno deve restare troppo a lungo nello stesso turno (per esempio sempre di notte): i turni cambiano al più tardi dopo 6 settimane, a meno che il dipendente accetti espressamente un'altra soluzione.","en":"Nobody should stay too long on the same shift (for example always nights): shifts change after 6 weeks at the latest, unless the employee expressly agrees to something else."},"src":"ref100"},
{"c":"O","art":"Art. 6 cpv. 3","it":{"q":"Come viene compensato il lavoro straordinario?","a":["Con tempo libero entro 3 mesi, oppure pagato con un supplemento del 25% (salvo accordo diverso)","Con tempo libero entro 1 settimana, oppure pagato con un supplemento del 50% (salvo accordo diverso)","Non viene compensato: lo straordinario è compreso nel salario normale (salvo accordo diverso)"]},"en":{"q":"How is overtime compensated?","a":["With free time within 3 months, or paid out with a 25% supplement (unless otherwise agreed)","With free time within 1 week, or paid out with a 50% supplement (unless otherwise agreed)","It is not compensated: overtime is included in the normal wage (unless otherwise agreed)"]},"x":{"it":"Lo straordinario va restituito: di regola con tempo libero della stessa durata entro 3 mesi, altrimenti pagato con il 25% in più. Non è mai semplicemente «compreso» nel salario normale.","en":"Overtime must be given back: as a rule as time off of the same length within 3 months, otherwise paid with a 25% supplement. It is never simply “included” in normal pay."},"src":"ref101"},
{"c":"C","art":"Tachigrafo","it":{"q":"Cosa registra fondamentalmente il tachigrafo?","a":["Velocità, tempo e percorso (distanza percorsa)","Tempo, tariffe applicate e percorsi effettuati","Distanza, numero di passeggeri e fermate"]},"en":{"q":"What does the tachograph fundamentally record?","a":["Speed, time and distance travelled","Time, the fares charged and the routes driven","Distance, the number of passengers and the stops"]},"x":{"it":"Il tachigrafo registra tre cose: la velocità, il tempo (guida, lavoro, pause) e la distanza percorsa. Tariffe e passeggeri non li registra: per le tariffe c'è il tassametro.","en":"The tachograph records three things: speed, time (driving, work, breaks) and distance travelled. It does not record fares or passengers: the taximeter is there for fares."},"src":"ref102"},
{"c":"C","art":"Art. 16 cpv. 2","it":{"q":"Con il tachigrafo CH, per quanto tempo un disco può restare nell'apparecchio e da quanti conducenti può essere usato?","a":["Al massimo 24 ore, e può essere usato da due conducenti (posizioni 1 e 2)","Al massimo una settimana, e può essere usato da un numero qualsiasi di conducenti","Al massimo 12 ore, e può essere usato da tre conducenti al giorno"]},"en":{"q":"With a CH tachograph, how long may a sheet stay in the device and how many drivers may use it?","a":["At most 24 hours, and it may be used by two drivers (positions 1 and 2)","At most one week, and it may be used by any number of drivers","At most 12 hours, and it may be used by three drivers per day"]},"x":{"it":"Un disco copre un giorno: può restare nel tachigrafo CH al massimo 24 ore, altrimenti le registrazioni si sovrappongono. Ha due posizioni, quindi serve per due conducenti (1 e 2).","en":"A sheet covers one day: it may stay in the CH tachograph for at most 24 hours, otherwise the recordings overlap. It has two positions, so it serves two drivers (1 and 2)."},"src":"ref103"},
{"c":"C","art":"Art. 17-18","it":{"q":"Se i fogli di registrazione del tachigrafo sono usati in modo VINCOLATO AL VEICOLO (un foglio per veicolo), cosa vale per il tassista?","a":["Deve comunque tenere un libretto di lavoro e compilare i fogli settimanali","Ha bisogno del libretto di lavoro solo se guida per due datori di lavoro diversi","Sostituisce il libretto di lavoro con le ricevute giornaliere firmate dai clienti"]},"en":{"q":"If the record sheets are tied to the vehicle (one sheet per vehicle), what applies to the taxi driver?","a":["They must still keep a work record book and fill in the weekly sheets","They need a work record book only if they drive for two different employers","They may replace the work record book with the customers' signed receipts"]},"x":{"it":"Quando il foglio appartiene al veicolo e non al conducente, non basta a provare i tempi della singola persona. Perciò il tassista tiene comunque il libretto di lavoro e compila i fogli settimanali.","en":"When the sheet belongs to the vehicle and not to the driver, it is not enough to prove one person's times. So the taxi driver still keeps a work record book and fills in the weekly sheets."},"src":"ref104"},
{"c":"O","art":"Art. 5 + 6","it":{"q":"Un conducente DIPENDENTE in un'azienda di taxi ha già lavorato 50 ore questa settimana. Compreso lo straordinario ordinario consentito, quante ore può ancora lavorare al massimo?","a":["7 ore (53 ore + 4 ore di straordinario = 57 ore)","3 ore (solo fino alle 53 ore normali)","9 ore (53 ore + 6 ore di straordinario = 59 ore)"]},"en":{"q":"An EMPLOYED driver in a taxi business has already worked 50 hours this week. Including the permitted normal overtime, how many more hours may they work at most?","a":["7 hours (53 h + 4 h overtime = 57 h)","3 hours (only up to the normal 53 h)","9 hours (53 h + 6 h overtime = 59 h)"]},"x":{"it":"In un'azienda di taxi il massimo è 53 ore, più 4 ore di straordinario normale = 57 ore. 57 − 50 già lavorate = 7 ore. Le 2 ore in più (59) valgono solo in periodi eccezionali.","en":"In a taxi business the maximum is 53 hours, plus 4 hours of normal overtime = 57 hours. 57 − 50 already worked = 7 hours. The 2 extra hours (59) apply only in exceptional periods."},"src":"ref105"},
{"c":"O","art":"Art. 5","it":{"q":"Un conducente DIPENDENTE in un'azienda di taxi ha già lavorato 50 ore questa settimana. SENZA straordinario, quante ore può ancora lavorare?","a":["3 ore (fino al massimo normale di 53 ore)","9 ore (fino a un limite assoluto di 59 ore)","0 ore (il massimo settimanale è raggiunto)"]},"en":{"q":"An EMPLOYED driver in a taxi business has already worked 50 hours this week. WITHOUT overtime, how many more hours may they work?","a":["3 hours (up to the normal maximum of 53 h)","9 hours (up to a 59-hour absolute limit)","0 hours (the weekly maximum is reached)"]},"x":{"it":"Senza straordinario conta solo il massimo normale di un'azienda di taxi, cioè 53 ore. 53 − 50 già lavorate = 3 ore.","en":"Without overtime only the normal maximum for a taxi business counts, which is 53 hours. 53 − 50 already worked = 3 hours."},"src":"ref106"},
{"c":"O","art":"Art. 5 + 6","it":{"q":"Un conducente dipendente AL DI FUORI di un'azienda di taxi ha già lavorato 50 ore questa settimana. Compreso lo straordinario ordinario, quante ore può ancora lavorare?","a":["2 ore (48 ore + 4 ore di straordinario = 52 ore)","7 ore (53 ore + 4 ore di straordinario = 57 ore)","9 ore (fino a un limite assoluto di 59 ore)"]},"en":{"q":"An employed driver OUTSIDE a taxi business has already worked 50 hours this week. Including normal overtime, how many more hours may they work?","a":["2 hours (48 h + 4 h overtime = 52 h)","7 hours (53 h + 4 h overtime = 57 h)","9 hours (up to a 59-hour absolute limit)"]},"x":{"it":"Fuori dalle aziende di taxi il massimo è 48 ore, più 4 ore di straordinario normale = 52 ore. 52 − 50 già lavorate = 2 ore. Le 53 ore valgono solo nelle aziende di taxi.","en":"Outside taxi businesses the maximum is 48 hours, plus 4 hours of normal overtime = 52 hours. 52 − 50 already worked = 2 hours. The 53 hours apply only in taxi businesses."},"src":"ref107"},
{"c":"O","art":"Art. 5 + 6","it":{"q":"Un conducente dipendente AL DI FUORI di un'azienda di taxi ha già lavorato 45 ore questa settimana. Compreso lo straordinario ordinario consentito, quante ore può ancora lavorare al massimo?","a":["7 ore (48 ore + 4 ore di straordinario = 52 ore)","9 ore (48 ore + 6 ore di straordinario = 54 ore)","12 ore (fino al limite taxi di 57 ore)"]},"en":{"q":"An employed driver OUTSIDE a taxi business has already worked 45 hours this week. Including the permitted normal overtime, how many more hours may they work at most?","a":["7 hours (48 h + 4 h overtime = 52 h)","9 hours (48 h + 6 h overtime = 54 h)","12 hours (up to the taxi limit of 57 h)"]},"x":{"it":"Fuori dalle aziende di taxi: 48 ore + 4 ore di straordinario normale = 52 ore. 52 − 45 già lavorate = 7 ore. Il limite di 57 ore vale solo nelle aziende di taxi.","en":"Outside taxi businesses: 48 hours + 4 hours of normal overtime = 52 hours. 52 − 45 already worked = 7 hours. The 57-hour limit applies only in taxi businesses."},"src":"ref108"},
{"c":"O","art":"Art. 5","it":{"q":"Un conducente dipendente AL DI FUORI di un'azienda di taxi ha già lavorato 45 ore questa settimana. SENZA straordinario, quante ore può ancora lavorare?","a":["3 ore (fino al massimo normale di 48 ore)","8 ore (fino al massimo taxi di 53 ore)","0 ore (il massimo settimanale è raggiunto)"]},"en":{"q":"An employed driver OUTSIDE a taxi business has already worked 45 hours this week. WITHOUT overtime, how many more hours may they work?","a":["3 hours (up to the normal maximum of 48 h)","8 hours (up to the taxi maximum of 53 h)","0 hours (the weekly maximum is reached)"]},"x":{"it":"Fuori dalle aziende di taxi il massimo normale è 48 ore, e senza straordinario non si va oltre. 48 − 45 già lavorate = 3 ore.","en":"Outside taxi businesses the normal maximum is 48 hours, and without overtime you cannot go beyond it. 48 − 45 already worked = 3 hours."},"src":"ref109"},
{"c":"T","art":"Art. 1","it":{"q":"Cosa regola l'OLR 2 (ARV 2)?","a":["Tempo di lavoro, di guida e di riposo dei conducenti, i controlli e i doveri dei datori di lavoro","Solo il tempo di guida dei conducenti e l'equipaggiamento tecnico dei veicoli","Le tariffe delle corse, i percorsi e i diritti di posteggio delle aziende di taxi"]},"en":{"q":"What does the OLR 2 regulate?","a":["Working, driving and rest time of the drivers, the checks and the duties of employers","Only the driving time of the drivers and the technical equipment of the vehicles","The fares, the routes and the parking rights of the taxi businesses"]},"x":{"it":"L'OLR 2 regola tre tempi dei conducenti (lavoro, guida e riposo), come vengono controllati e che cosa deve fare il datore di lavoro. Tariffe, percorsi e posteggi non sono materia dell'OLR 2.","en":"OLR 2 regulates three kinds of time for drivers (work, driving and rest), how they are checked and what the employer must do. Fares, routes and ranks are not covered by OLR 2."},"src":"ref110"},
{"c":"P","art":"Art. 3 cpv. 1","it":{"q":"Quali veicoli rientrano nell'OLR 2 quando sono usati per il trasporto professionale di persone?","a":["Veicoli leggeri, autovetture pesanti, minibus fino a 16 posti, veicoli piccoli e a tre ruote","Tutti i veicoli a motore fino a 7,5 tonnellate, compresi furgoni e piccoli autocarri","Solo gli autobus del servizio di linea con più di 16 posti oltre al conducente"]},"en":{"q":"Which vehicles fall under the OLR 2 when used for professional passenger transport?","a":["Light vehicles, heavy passenger cars, minibuses up to 16 seats, small and three-wheeled vehicles","All motor vehicles up to 7.5 tonnes, including delivery vans and small lorries","Only buses in scheduled service with more than 16 seats besides the driver's seat"]},"x":{"it":"L'OLR 2 copre i veicoli «piccoli» per il trasporto professionale di persone: veicoli leggeri, autovetture pesanti e minibus fino a 16 posti oltre al conducente. Autobus più grandi e trasporto merci rientrano nell'OLR 1.","en":"OLR 2 covers the “small” vehicles used for professional passenger transport: light vehicles, heavy passenger cars and minibuses with up to 16 seats besides the driver. Larger buses and goods transport fall under OLR 1."},"src":"ref111"},
{"c":"T","art":"Art. 2 cpv. 2","it":{"q":"Quali tre ruoli distingue l'OLR 2?","a":["Conducente indipendente, conducente dipendente (lavoratore) e datore di lavoro","Proprietario del veicolo, locatario del veicolo e locatore del veicolo","Conducente apprendista, conducente con licenza e responsabile della flotta"]},"en":{"q":"Which three roles does the OLR 2 distinguish?","a":["Self-employed driver, employed driver (employee) and employer","Vehicle owner, vehicle tenant and vehicle lessor","Apprentice driver, licensed driver and fleet manager"]},"x":{"it":"L'OLR 2 distingue chi guida per conto proprio (indipendente), chi guida per un altro (lavoratore) e chi può dare ordini al conducente (datore di lavoro). Le regole cambiano a seconda del ruolo.","en":"OLR 2 distinguishes those who drive for themselves (self-employed), those who drive for someone else (employee) and those who can give the driver orders (employer). The rules differ according to the role."},"src":"ref112"},
{"c":"T","art":"Art. 2 cpv. 2 lett. b","it":{"q":"Chi è considerato «conducente indipendente» secondo l'OLR 2?","a":["Chi non è al servizio di un datore di lavoro, non è subordinato e decide da sé sull'uso del veicolo","Chi è al servizio di un datore di lavoro ma decide da sé sull'uso del veicolo e sugli orari","Chi guida un veicolo di sua proprietà, anche se lavora alle dipendenze di un'azienda di taxi"]},"en":{"q":"Who is considered a “self-employed driver” under the OLR 2?","a":["Someone who is not in an employer's service or subordinate and decides on the use of the vehicle","Someone in an employer's service who nevertheless decides on the use of the vehicle and the hours","Someone who drives their own vehicle, even if they are employed by a taxi business"]},"x":{"it":"Indipendente è chi non ha un capo: non lavora per un datore di lavoro, non riceve ordini e decide da solo come usare il veicolo. Essere proprietario dell'auto non basta, se si lavora alle dipendenze di un'azienda.","en":"Self-employed means having no boss: you do not work for an employer, take no orders and decide for yourself how the vehicle is used. Owning the car is not enough if you work as an employee of a business."},"src":"add1"},
{"c":"T","art":"Art. 2 cpv. 2 lett. b","it":{"q":"Il coniuge o il figlio del proprietario dell'azienda che guida il taxi è considerato...","a":["Conducente indipendente, anche se lavora nell'azienda di famiglia","Lavoratore dipendente, come qualsiasi altro conducente dell'azienda","Conducente a titolo accessorio, con le regole dei lavoratori"]},"en":{"q":"The spouse or child of the business owner who drives the taxi is considered...","a":["A self-employed driver, even if they work in the family business","An employee, like any other driver of the business","A driver with a second job, subject to the rules for employees"]},"x":{"it":"I familiari stretti del titolare (coniuge, figli, genitori) che guidano nell'azienda di famiglia sono trattati come conducenti indipendenti, non come dipendenti.","en":"Close family members of the owner (spouse, children, parents) who drive in the family business are treated as self-employed drivers, not as employees."},"src":"add2"},
{"c":"T","art":"Art. 2 cpv. 2 lett. c-d","it":{"q":"Chi è il «datore di lavoro» ai sensi dell'OLR 2?","a":["Chi, come proprietario dell'azienda o superiore, ha facoltà di impartire ordini al conducente","Chi, come proprietario del veicolo, lo mette a disposizione del conducente senza dare ordini","Chi, come titolare della licenza di circolazione, paga le spese e le assicurazioni del veicolo"]},"en":{"q":"Who is the “employer” within the meaning of the OLR 2?","a":["Whoever, as business owner or superior, has the authority to give orders to the driver","Whoever, as vehicle owner, makes it available to the driver without giving orders","Whoever, as holder of the registration document, pays the vehicle's costs and insurance"]},"x":{"it":"Datore di lavoro è chi può dare ordini al conducente, come proprietario dell'azienda o come superiore. Possedere il veicolo o pagarne le spese non rende datore di lavoro.","en":"The employer is whoever can give the driver orders, as owner of the business or as a superior. Owning the vehicle or paying its costs does not make someone the employer."},"src":"add3"},
{"c":"T","art":"Art. 2 cpv. 2 lett. e","it":{"q":"Un tassista dipendente lavora due giorni alla settimana anche per un altro datore di lavoro. Questo tempo conta come durata del lavoro?","a":["Sì, la durata del lavoro comprende anche l'attività lucrativa presso un altro datore di lavoro","No, conta solo il tempo di lavoro svolto nell'azienda di taxi che tiene il registro","Solo se anche l'altra attività è un trasporto professionale di persone"]},"en":{"q":"An employed taxi driver also works two days a week for another employer. Does this time count as working time?","a":["Yes, working time also includes gainful activity for another employer","No, only the working time in the taxi company that keeps the register counts","Only if the other activity is also professional passenger transport"]},"x":{"it":"Le ore si sommano: nel tempo di lavoro rientra anche il lavoro retribuito svolto presso un altro datore di lavoro, di qualunque tipo sia. Altrimenti i limiti settimanali si potrebbero aggirare con due impieghi.","en":"The hours add up: working time also includes paid work for another employer, whatever kind of work it is. Otherwise the weekly limits could be dodged with two jobs."},"src":"add4"},
{"c":"T","art":"Art. 2 cpv. 2 lett. h","it":{"q":"Chi è l'«autorità di esecuzione» dell'OLR 2?","a":["L'autorità cantonale competente per i controlli sulla strada e nelle aziende","L'Ufficio federale delle strade (USTRA), che effettua direttamente i controlli","La polizia comunale del luogo in cui l'azienda di taxi ha la sua sede"]},"en":{"q":"Who is the “enforcement authority” of the OLR 2?","a":["The cantonal authority competent for checks on the road and in businesses","The Federal Roads Office, which carries out the checks on the road directly","The municipal police of the place where the taxi business is based"]},"x":{"it":"L'autorità di esecuzione è cantonale: ogni Cantone designa chi fa i controlli su strada e nelle aziende. L'USTRA ha solo la sovrintendenza generale e non fa i controlli.","en":"The enforcement authority is cantonal: each canton appoints who carries out the checks on the road and in businesses. The Federal Roads Office only has general oversight and does not do the checks."},"src":"add5"},
{"c":"T","art":"Art. 3 cpv. 1ter","it":{"q":"Il trasporto di persone con veicoli noleggiati con autista è considerato trasporto professionale di persone?","a":["Sì, è equiparato al trasporto professionale di persone","No, è un contratto di noleggio e non rientra nell'OLR 2","Solo se la distanza percorsa supera i 50 chilometri"]},"en":{"q":"Is passenger transport with chauffeur-driven hire vehicles considered professional passenger transport?","a":["Yes, it is treated as professional passenger transport","No, it is a hire contract and does not fall under the OLR 2","Only if the distance driven exceeds 50 kilometres"]},"x":{"it":"Noleggiare un veicolo insieme all'autista equivale, in pratica, a far trasportare persone a pagamento. Per questo è trattato come trasporto professionale di persone e vale l'OLR 2.","en":"Hiring a vehicle together with a driver amounts in practice to paying to have people carried. That is why it is treated as professional passenger transport and OLR 2 applies."},"src":"add6"},
{"c":"P","art":"Art. 3 cpv. 4","it":{"q":"In che misura l'OLR 2 si applica al datore di lavoro?","a":["Soltanto nella misura in cui gli impone esplicitamente degli obblighi","Nella stessa misura in cui si applica al conducente dipendente","Non si applica: per il datore di lavoro vale solo l'OLR 1"]},"en":{"q":"To what extent does the OLR 2 apply to the employer?","a":["Only insofar as it explicitly imposes duties on them","To the same extent as it applies to the employed driver","It does not apply: only the OLR 1 applies to the employer"]},"x":{"it":"L'OLR 2 è scritta per i conducenti. Al datore di lavoro si applica solo dove gli impone espressamente un obbligo, per esempio tenere il registro o organizzare il lavoro in modo corretto.","en":"OLR 2 is written for drivers. It applies to the employer only where it expressly gives them a duty, for example keeping the register or planning the work properly."},"src":"add7"},
{"c":"P","art":"Art. 3 cpv. 2","it":{"q":"Guidi all'estero un minibus immatricolato in Svizzera con più di 8 posti oltre al conducente. Quale ordinanza devi rispettare?","a":["L'OLR 1","L'OLR 2","Nessuna: all'estero valgono solo le regole locali"]},"en":{"q":"You are driving abroad in a Swiss-registered minibus with more than 8 seats besides the driver's. Which ordinance must you observe?","a":["The OLR 1","The OLR 2","None: abroad only local rules apply"]},"x":{"it":"All'estero l'OLR 2 vale solo fino a 8 posti oltre al conducente. Un minibus con più di 8 posti, quando va all'estero, deve rispettare l'OLR 1.","en":"Abroad, OLR 2 applies only up to 8 seats besides the driver. A minibus with more than 8 seats must comply with OLR 1 when it goes abroad."},"src":"add8"},
{"c":"P","art":"Art. 3 cpv. 3","it":{"q":"Un conducente con un veicolo immatricolato all'estero circola in Svizzera. Quali disposizioni dell'OLR 2 deve osservare?","a":["Gli articoli 7–11: durata della guida, pause, riposo quotidiano e settimanale","Tutta l'ordinanza, compreso l'obbligo di tenere il libretto di lavoro","Nessuna: ai veicoli esteri si applicano solo le regole del loro Paese"]},"en":{"q":"A driver with a foreign-registered vehicle drives in Switzerland. Which OLR 2 provisions must they observe?","a":["Articles 7–11: driving time, breaks, daily and weekly rest","The whole ordinance, including the duty to keep the work record book","None: foreign vehicles are subject only to their own country's rules"]},"x":{"it":"Chi viene dall'estero deve rispettare in Svizzera solo le regole essenziali per la sicurezza: tempo di guida, pause e riposo giornaliero e settimanale. Il libretto di lavoro svizzero non gli è richiesto.","en":"A driver from abroad must observe in Switzerland only the rules essential for safety: driving time, breaks, and daily and weekly rest. The Swiss work record book is not required of them."},"src":"add9"},
{"c":"P","art":"Art. 3 cpv. 1","it":{"q":"L'OLR 2 vale anche quando il tassista percorre una corsa a vuoto durante il servizio?","a":["Sì, la corsa a vuoto fa parte dell'attività professionale","No, senza passeggeri a bordo non è un trasporto di persone","Solo se la corsa a vuoto supera i 50 chilometri"]},"en":{"q":"Does the OLR 2 also apply when the taxi driver drives without passengers while on duty?","a":["Yes, an empty run is part of the professional activity","No, without passengers on board it is not passenger transport","Only if the empty run is longer than 50 kilometres"]},"x":{"it":"Anche senza passeggeri stai lavorando e stai guidando: la corsa a vuoto fa parte del servizio e conta come tempo di guida e di lavoro.","en":"Even without passengers you are working and driving: an empty run is part of the job and counts as driving time and working time."},"src":"add10"},
{"c":"P","art":"Art. 4 cpv. 3 / Art. 15 cpv. 2","it":{"q":"Fai una corsa privata con il taxi. Sei soggetto all'OLR 2?","a":["No, ma il tachigrafo deve restare in funzione in posizione «Pausa»","No, e il tachigrafo può essere spento fino alla prossima corsa professionale","Sì, integralmente, come durante qualsiasi corsa professionale"]},"en":{"q":"You make a private trip with the taxi. Are you subject to the OLR 2?","a":["No, but the tachograph must keep running in the “break” position","No, and the tachograph may be switched off until the next professional trip","Yes, in full, as during any professional trip"]},"x":{"it":"In una corsa privata i limiti di tempo dell'OLR 2 non valgono. Il tachigrafo però non si spegne: resta acceso sulla posizione «Pausa», così si vede che la corsa era privata.","en":"On a private trip the OLR 2 time limits do not apply. But the tachograph is not switched off: it stays on in the “Break” position, which shows that the trip was private."},"src":"add11"},
{"c":"P","art":"Art. 4 cpv. 4","it":{"q":"Se l'OLR 2 si applica soltanto a una parte dell'attività di un conducente, i limiti di tempo valgono per...","a":["L'insieme dell'attività professionale, e i mezzi di controllo vanno usati per tutto","Soltanto la parte soggetta all'OLR 2, e i mezzi di controllo solo per quella parte","Soltanto la parte soggetta all'OLR 2, senza alcun mezzo di controllo"]},"en":{"q":"If the OLR 2 applies only to part of a driver's activity, the time limits apply to...","a":["The whole professional activity, and the control documents must be used for all of it","Only the part subject to the OLR 2, and the control documents only for that part","Only the part subject to the OLR 2, without any control documents"]},"x":{"it":"Non si può dividere l'attività in una parte «con regole» e una «senza»: se anche solo una parte del lavoro rientra nell'OLR 2, i limiti e i mezzi di controllo valgono per tutta l'attività professionale.","en":"You cannot split the activity into a part “with rules” and a part “without”: if even part of the work falls under OLR 2, the limits and the control records apply to the whole professional activity."},"src":"add12"},
{"c":"P","art":"Art. 25 cpv. 1","it":{"q":"I Cantoni possono emanare prescrizioni diverse dall'OLR 2 per i tassisti?","a":["Sì, per i tassisti che lavorano nelle agglomerazioni urbane","Sì, per tutti i conducenti professionali del Cantone","No, l'OLR 2 è federale e i Cantoni non possono derogarvi"]},"en":{"q":"May the cantons issue rules for taxi drivers that differ from the OLR 2?","a":["Yes, for taxi drivers who work in urban agglomerations","Yes, for all professional drivers in the canton","No, the OLR 2 is federal and the cantons cannot depart from it"]},"x":{"it":"L'OLR 2 permette ai Cantoni di fissare regole diverse solo per i tassisti delle agglomerazioni urbane (e di delegare questo compito ai Comuni). Non vale per tutti i conducenti professionali del Cantone.","en":"OLR 2 lets cantons set different rules only for taxi drivers in urban agglomerations (and delegate this to municipalities). It does not extend to all professional drivers in the canton."},"src":"add13"},
{"c":"P","art":"Art. 25 cpv. 4","it":{"q":"Cosa possono prescrivere i Cantoni ai tassisti al posto del libretto di lavoro?","a":["Carte di lavoro contenenti le indicazioni principali del libretto di lavoro","Rapporti del tassametro contenenti le indicazioni principali del libretto di lavoro","Nulla: il libretto di lavoro federale è obbligatorio in tutti i Cantoni"]},"en":{"q":"What may the cantons prescribe for taxi drivers instead of the work record book?","a":["Work cards containing the main information of the work record book","Taximeter reports containing the main information of the work record book","Nothing: the federal work record book is mandatory in all cantons"]},"x":{"it":"Al posto del libretto di lavoro i Cantoni possono prescrivere ai tassisti delle carte di lavoro, che riportano le indicazioni principali del libretto. I rapporti del tassametro non lo sostituiscono.","en":"Instead of the work record book, cantons may require taxi drivers to use work cards that contain its main information. Taximeter reports do not replace it."},"src":"add14"},
{"c":"P","art":"Art. 27","it":{"q":"Un datore di lavoro impiega un conducente a titolo accessorio (ad es. uno studente). Di cosa deve accertarsi?","a":["Che l'attività principale e quella accessoria insieme non superino i limiti dell'OLR 2","Che soltanto l'attività accessoria nella sua azienda rispetti i limiti dell'OLR 2","Che il conducente tenga un secondo libretto di lavoro per l'attività accessoria"]},"en":{"q":"An employer takes on a driver who works for them as a second job (e.g. a student). What must the employer make sure of?","a":["That the main job and the second job together stay within the OLR 2 limits","That only the second job in their own business stays within the OLR 2 limits","That the driver keeps a second work record book for the second job"]},"x":{"it":"I limiti valgono per la persona, non per il singolo impiego. Il datore di lavoro deve quindi verificare che attività principale e attività accessoria, sommate, restino dentro i limiti dell'OLR 2.","en":"The limits apply to the person, not to each job. The employer must therefore check that the main job and the second job, added together, stay within the OLR 2 limits."},"src":"add15"},
{"c":"O","art":"Art. 5","it":{"q":"Qual è la durata massima giornaliera del lavoro di un tassista secondo l'OLR 2?","a":["Non è regolata dall'OLR 2, che fissa solo il limite settimanale","È fissata a 10 ore al giorno, come la durata di guida più un'ora","È fissata a 15 ore al giorno, pause e tempo di attesa compresi"]},"en":{"q":"What is the maximum daily working time of a taxi driver under the OLR 2?","a":["It is not regulated by the OLR 2, which sets only the weekly limit","It is set at 10 hours a day, i.e. the driving time plus one hour","It is set at 15 hours a day, breaks and waiting time included"]},"x":{"it":"L'OLR 2 fissa solo un massimo settimanale di lavoro (48 o 53 ore), non un massimo giornaliero. La giornata è limitata solo indirettamente, dalle 11 ore di riposo e dalle 9 ore di guida.","en":"OLR 2 sets only a weekly maximum for work (48 or 53 hours), not a daily one. The day is limited only indirectly, by the 11 hours of rest and the 9 hours of driving."},"src":"add16"},
{"c":"O","art":"Art. 6 cpv. 2","it":{"q":"Un lavoratore effettua in una settimana più di 4 ore di straordinario. Cosa deve fare il datore di lavoro?","a":["Annunciarlo all'autorità in un rapporto trimestrale, entro 14 giorni dalla fine del trimestre","Annunciarlo all'autorità in un rapporto mensile, entro 30 giorni dalla fine del mese","Chiedere un permesso scritto all'autorità prima di far effettuare le ore"]},"en":{"q":"An employee works more than 4 hours of overtime in one week. What must the employer do?","a":["Report it to the authority in a quarterly report, within 14 days of the end of the quarter","Report it to the authority in a monthly report, within 30 days of the end of the month","Ask the authority for written permission before the hours are worked"]},"x":{"it":"Più di 4 ore di straordinario in una settimana sono un'eccezione che l'autorità vuole conoscere: il datore di lavoro la segnala in un rapporto trimestrale, entro 14 giorni dalla fine del trimestre. Non serve un permesso prima.","en":"More than 4 hours of overtime in a week is an exception the authority wants to know about: the employer reports it in a quarterly report, within 14 days of the end of the quarter. No permit is needed beforehand."},"src":"add17"},
{"c":"O","art":"Art. 6 cpv. 1","it":{"q":"Nei periodi di intensa attività straordinaria, di quante ore in totale può essere prolungata la settimana lavorativa?","a":["6 ore: 4 ore di straordinario ordinario più 2 ore supplementari","4 ore: lo straordinario ordinario non può essere aumentato","8 ore: 4 ore di straordinario ordinario più 4 ore supplementari"]},"en":{"q":"During periods of exceptionally intense activity, by how many hours in total may the working week be extended?","a":["6 hours: 4 hours of ordinary overtime plus 2 extra hours","4 hours: ordinary overtime cannot be increased","8 hours: 4 hours of ordinary overtime plus 4 extra hours"]},"x":{"it":"Alle 4 ore di straordinario normale si possono aggiungere 2 ore nei periodi di attività eccezionale: in totale 6 ore a settimana, non di più.","en":"On top of the 4 hours of normal overtime, 2 hours may be added in exceptionally busy periods: 6 hours a week in total, no more."},"src":"add18"},
{"c":"O","art":"Art. 8 cpv. 1-2","it":{"q":"Cosa è vietato al lavoratore durante una pausa?","a":["Guidare un veicolo e svolgere qualsiasi attività professionale","Lasciare il veicolo e allontanarsi dal posteggio dei taxi","Spegnere il tachigrafo e riposare all'interno del veicolo"]},"en":{"q":"What is forbidden for the employee during a break?","a":["Driving a vehicle and carrying out any professional activity","Leaving the vehicle and moving away from the taxi rank","Switching off the tachograph and resting inside the vehicle"]},"x":{"it":"Una pausa è tale solo se non lavori affatto: niente guida e nessun'altra attività professionale. Lasciare il veicolo o riposarci dentro invece è permesso.","en":"A break is only a break if you do no work at all: no driving and no other professional activity. Leaving the vehicle or resting inside it, on the other hand, is allowed."},"src":"add19"},
{"c":"O","art":"Art. 9 cpv. 2","it":{"q":"Un conducente riposa 8 ore di notte e 3 ore nel pomeriggio. Il riposo quotidiano suddiviso è valido?","a":["No: in totale sono 11 ore, ma un riposo suddiviso deve raggiungere almeno 12 ore","Sì: una parte dura almeno 8 ore e nessuna parte è inferiore a un'ora","Sì: il totale supera le 9 ore ammesse per il riposo ridotto"]},"en":{"q":"A driver rests 8 hours at night and 3 hours in the afternoon. Is the split daily rest valid?","a":["No: the total is 11 hours, but a split rest must reach at least 12 hours","Yes: one part lasts at least 8 hours and no part is shorter than one hour","Yes: the total exceeds the 9 hours allowed for the reduced rest"]},"x":{"it":"8 + 3 = 11 ore, ma quando il riposo è suddiviso il totale deve essere di almeno 12 ore. Le altre due condizioni (una parte di 8 ore, nessuna sotto 1 ora) qui sono rispettate, ma non bastano.","en":"8 + 3 = 11 hours, but when the rest is split the total must be at least 12 hours. The other two conditions (one part of 8 hours, none under 1 hour) are met here, but that is not enough."},"src":"add20"},
{"c":"O","art":"Art. 9 cpv. 3","it":{"q":"Durante il riposo quotidiano il conducente può svolgere un'altra attività professionale, se la settimana lavorativa resta sotto il massimo?","a":["No, durante il riposo quotidiano non si può esercitare alcuna attività professionale","Sì, purché la durata massima della settimana lavorativa non venga superata","Sì, purché l'attività sia svolta per un altro datore di lavoro"]},"en":{"q":"May the driver carry out another professional activity during the daily rest, if the working week stays below the maximum?","a":["No, no professional activity may be carried out during the daily rest","Yes, provided the maximum weekly working time is not exceeded","Yes, provided the activity is carried out for another employer"]},"x":{"it":"Riposo vuol dire non lavorare del tutto. Durante il riposo quotidiano non è ammessa nessuna attività professionale, nemmeno per un altro datore di lavoro e anche se nella settimana restano ore libere.","en":"Rest means not working at all. No professional activity is allowed during the daily rest, not even for another employer and even if hours are still left in the week."},"src":"add21"},
{"c":"O","art":"Art. 11 cpv. 1","it":{"q":"Quando deve cadere, di regola, il giorno di riposo settimanale di un lavoratore?","a":["Di domenica o in un giorno festivo, e il lavoratore deve poterlo trascorrere a domicilio","Di sabato o di domenica, a scelta del datore di lavoro, anche lontano dal domicilio","In qualsiasi giorno della settimana, a scelta del lavoratore, anche lontano dal domicilio"]},"en":{"q":"When must an employee's weekly rest day normally fall?","a":["On a Sunday or public holiday, and the employee must be able to spend it at home","On a Saturday or Sunday, at the employer's choice, even away from home","On any day of the week, at the employee's choice, even away from home"]},"x":{"it":"Di regola il giorno di riposo cade di domenica o in un giorno festivo, e il lavoratore deve poterlo passare a casa. Non lo scelgono liberamente né il datore di lavoro né il lavoratore.","en":"As a rule the rest day falls on a Sunday or public holiday, and the employee must be able to spend it at home. Neither the employer nor the employee is free to pick it."},"src":"add22"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Quanti giorni di riposo coincidenti con una domenica o un giorno festivo deve accordare ogni anno il datore di lavoro a chi lavora la domenica?","a":["Almeno 20","Almeno 12","Almeno 18"]},"en":{"q":"How many rest days falling on a Sunday or public holiday must the employer grant each year to someone who works on Sundays?","a":["At least 20","At least 12","At least 18"]},"x":{"it":"Chi lavora spesso di domenica deve comunque avere almeno 20 domeniche o giorni festivi liberi all'anno. Non confondere con 18 (ore che devono cadere di domenica) e 12 (giorni massimi tra due riposi).","en":"Someone who often works on Sundays must still get at least 20 Sundays or public holidays off per year. Do not confuse this with 18 (hours that must fall on the Sunday) or 12 (maximum days between two rest days)."},"src":"add23"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Un lavoratore deve lavorare di domenica. Quando recupera il giorno di riposo settimanale?","a":["In uno dei 6 giorni feriali che precedono o seguono immediatamente la domenica lavorativa","Soltanto in uno dei 6 giorni feriali che seguono la domenica lavorativa","Soltanto in uno dei 6 giorni feriali che precedono la domenica lavorativa"]},"en":{"q":"An employee has to work on a Sunday. When do they take the weekly rest day instead?","a":["On one of the 6 weekdays just before or just after the Sunday worked","Only on one of the 6 weekdays just after the Sunday worked","Only on one of the 6 weekdays just before the Sunday worked"]},"x":{"it":"Il giorno di riposo sostitutivo può essere dato sia prima sia dopo: in uno dei 6 giorni feriali che precedono o che seguono direttamente la domenica lavorata.","en":"The replacement rest day may be given either before or after: on one of the 6 working days directly before or directly after the worked Sunday."},"src":"add24"},
{"c":"O","art":"Art. 11 cpv. 2","it":{"q":"Tra due giorni di riposo, quanti giorni lavorativi possono trascorrere al massimo per un lavoratore?","a":["12","14","18"]},"en":{"q":"Between two rest days, how many working days may pass at most for an employee?","a":["12","14","18"]},"x":{"it":"Anche spostando i giorni di riposo, tra un giorno di riposo e il successivo non possono esserci più di 12 giorni di lavoro. 18 sono le ore che devono cadere di domenica, non giorni.","en":"Even when rest days are moved, there may be no more than 12 working days between one rest day and the next. 18 is the number of hours that must fall on the Sunday, not days."},"src":"add25"},
{"c":"O","art":"Art. 11 cpv. 5","it":{"q":"Durante il giorno di riposo settimanale è ammessa un'attività professionale?","a":["No, nessuna attività professionale","Sì, al massimo 4 ore di attività professionale","Sì, se svolta per un altro datore di lavoro"]},"en":{"q":"Is professional activity allowed during the weekly rest day?","a":["No, no professional activity at all","Yes, at most 4 hours of professional activity","Yes, if carried out for another employer"]},"x":{"it":"Il giorno di riposo settimanale è completamente libero: nessuna attività professionale, nemmeno per poche ore e nemmeno per un altro datore di lavoro.","en":"The weekly rest day is completely free: no professional activity, not even for a few hours and not even for another employer."},"src":"add26"},
{"c":"O","art":"Art. 12 cpv. 2","it":{"q":"Quante semigiornate libere settimanali possono essere ritirate in blocco, d'accordo con il datore di lavoro?","a":["Al massimo 4, risultanti da quattro settimane consecutive, nello stesso periodo","Al massimo 2, risultanti da due settimane consecutive, nello stesso periodo","Tutte quelle non ancora ritirate nell'anno civile, in qualsiasi momento"]},"en":{"q":"How many weekly free half-days may be taken together, by agreement with the employer?","a":["At most 4, from four consecutive weeks, within those four weeks","At most 2, from two consecutive weeks, within those two weeks","All those not yet taken in the calendar year, at any time"]},"x":{"it":"Le semigiornate libere si possono accumulare, ma solo quelle di 4 settimane consecutive, e vanno prese insieme d'accordo con il datore di lavoro. Non si possono mettere da parte per tutto l'anno.","en":"Free half-days may be saved up, but only those of 4 consecutive weeks, and they are taken together by agreement with the employer. They cannot be saved up for the whole year."},"src":"add27"},
{"c":"O","art":"Art. 12 cpv. 3 / Art. 9","it":{"q":"Due semigiornate libere vengono ritirate assieme e il riposo quotidiano è ridotto. Quante ore libere consecutive risultano come minimo?","a":["20 ore (11 ore dalle 07:00 alle 18:00 + 9 ore di riposo ridotto)","18 ore (11 ore dalle 07:00 alle 18:00 + 7 ore di riposo ridotto)","24 ore (11 ore dalle 07:00 alle 18:00 + 13 ore di riposo normale)"]},"en":{"q":"Two free half-days are taken together and the daily rest is reduced. How many consecutive hours off does this give at least?","a":["20 hours (11 hours from 07:00 to 18:00 + 9 hours of reduced rest)","18 hours (11 hours from 07:00 to 18:00 + 7 hours of reduced rest)","24 hours (11 hours from 07:00 to 18:00 + 13 hours of normal rest)"]},"x":{"it":"Due semigiornate insieme coprono dalle 07:00 alle 18:00, cioè 11 ore. A queste si attacca il riposo quotidiano, qui ridotto a 9 ore: 11 + 9 = 20 ore libere di seguito.","en":"Two half-days together cover 07:00 to 18:00, which is 11 hours. The daily rest, here reduced to 9 hours, is attached to them: 11 + 9 = 20 consecutive hours off."},"src":"add28"},
{"c":"O","art":"Art. 11 + 9 + 12","it":{"q":"Un lavoratore prende insieme il giorno di riposo settimanale, una semigiornata libera e il riposo quotidiano RIDOTTO. Quante ore deve restare lontano dal lavoro?","a":["38 ore (24 + 5 + 9)","40 ore (24 + 5 + 11)","33 ore (24 + 9)"]},"en":{"q":"An employee takes the weekly rest day, a free half-day and the REDUCED daily rest together. How many hours off work does that make in total?","a":["38 hours (24 + 5 + 9)","40 hours (24 + 5 + 11)","33 hours (24 + 9)"]},"x":{"it":"Si sommano: 24 ore di giorno di riposo + 5 ore di semigiornata + 9 ore di riposo ridotto = 38 ore. Con il riposo normale di 11 ore sarebbero 40.","en":"You add them up: 24 hours for the rest day + 5 hours for the half-day + 9 hours of reduced rest = 38 hours. With the normal 11-hour rest it would be 40."},"src":"add29"},
{"c":"O","art":"Art. 22 cpv. 1","it":{"q":"Il datore di lavoro ti assegna dei turni che ti portano fuori dai limiti dell'OLR 2. Cosa devi fare?","a":["Informarlo tempestivamente che non puoi rispettare le disposizioni sui tempi","Eseguire i turni: la responsabilità per le violazioni è soltanto del datore di lavoro","Eseguire i turni: la responsabilità per le violazioni è soltanto tua"]},"en":{"q":"Your employer assigns you shifts that take you beyond the OLR 2 limits. What must you do?","a":["Inform them in good time that you cannot comply with the time rules","Work the shifts: the responsibility for the violations lies with the employer alone","Work the shifts: the responsibility for the violations lies with you alone"]},"x":{"it":"Il conducente deve avvisare in tempo il datore di lavoro se i turni non permettono di rispettare le regole. Tacere non protegge nessuno: in caso di violazione sono punibili entrambi.","en":"The driver must tell the employer in good time if the shifts make it impossible to keep to the rules. Keeping quiet protects no one: if the rules are broken, both can be punished."},"src":"add30"},
{"c":"O","art":"Art. 28 cpv. 1","it":{"q":"Con quale pena è punito chi viola le disposizioni sulla durata del lavoro, della guida e del riposo?","a":["Con la multa, per ogni violazione","Con l'arresto o con la multa","Con la revoca automatica della licenza"]},"en":{"q":"What is the penalty for violating the working, driving and rest-time rules?","a":["A fine, for every violation","Detention or a fine","Automatic licence withdrawal"]},"x":{"it":"Le violazioni dei tempi di lavoro, guida e riposo sono punite con la multa. L'arresto non è più previsto e la licenza non viene revocata automaticamente.","en":"Breaches of working, driving and rest times are punished with a fine. Detention is no longer provided for, and the licence is not withdrawn automatically."},"src":"add31"},
{"c":"C","art":"Art. 16a","it":{"q":"Il taxi è equipaggiato con un tachigrafo UE (analogico o digitale). Quali regole sul tachigrafo e sui dischi si applicano?","a":["Quelle dell'OLR 1, al posto degli articoli dell'OLR 2 su tachigrafo, dischi e libretto","Quelle dell'OLR 2, articolo 16, al posto delle regole dell'OLR 1 sui dischi personali","Nessuna: con un tachigrafo UE il conducente è dispensato dai mezzi di controllo"]},"en":{"q":"The taxi is fitted with an EU tachograph (analogue or digital). Which rules on the tachograph and sheets apply?","a":["Those of the OLR 1, instead of the OLR 2 articles on tachograph, sheets and work record book","Those of the OLR 2, Article 16, instead of the OLR 1 rules on personal sheets","None: with an EU tachograph the driver is exempt from the control documents"]},"x":{"it":"Il tachigrafo UE è lo stesso apparecchio usato su autocarri e autobus. Perciò per l'apparecchio, i dischi e la carta del conducente valgono le regole dell'OLR 1 al posto di quelle dell'OLR 2.","en":"The EU tachograph is the same device used in lorries and buses. So for the device, the sheets and the driver card the OLR 1 rules apply in place of the OLR 2 ones."},"src":"add32"},
{"c":"C","art":"Art. 16 cpv. 2 / OLR 1 art. 14a","it":{"q":"Qual è la differenza tra il disco del tachigrafo CH e quello del tachigrafo UE?","a":["Il disco CH è legato al veicolo; il disco UE è personale del conducente","Il disco CH è personale del conducente; il disco UE è legato al veicolo","Nessuna: entrambi sono legati al veicolo e usabili da più conducenti"]},"en":{"q":"What is the difference between the sheet of a CH tachograph and that of an EU tachograph?","a":["The CH sheet is tied to the vehicle; the EU sheet is personal to the driver","The CH sheet is personal to the driver; the EU sheet is tied to the vehicle","None: both are tied to the vehicle and usable by several drivers"]},"x":{"it":"È la differenza di base: il disco CH resta nel veicolo e può servire a due conducenti; il disco UE appartiene al conducente, che lo porta con sé quando cambia veicolo.","en":"This is the basic difference: the CH sheet stays in the vehicle and can serve two drivers; the EU sheet belongs to the driver, who takes it along when changing vehicle."},"src":"add33"},
{"c":"C","art":"Art. 16 cpv. 2-3","it":{"q":"Con un tachigrafo CH, cosa si fa al cambio di conducente durante la giornata?","a":["Si gira il selettore da conducente «1» a conducente «2» e si completano i nomi sul disco","Si toglie il disco e il nuovo conducente ne inserisce uno nuovo a suo nome","Non si fa nulla: il cambio di conducente viene registrato automaticamente"]},"en":{"q":"With a CH tachograph, what is done at a change of driver during the day?","a":["The selector is turned from driver “1” to driver “2” and the names are completed on the sheet","The sheet is removed and the new driver inserts a new one in their own name","Nothing: the change of driver is recorded automatically"]},"x":{"it":"Con il tachigrafo CH il disco resta nel veicolo. Al cambio di conducente si gira solo il selettore da «1» a «2» e si completa il disco con il nome del secondo conducente.","en":"With the CH tachograph the sheet stays in the vehicle. At a change of driver you just turn the selector from “1” to “2” and add the second driver's name to the sheet."},"src":"add34"},
{"c":"C","art":"Art. 16 cpv. 6","it":{"q":"Con un tachigrafo CH, un terzo conducente guida lo stesso veicolo nello stesso giorno. Cosa deve fare?","a":["Scrivere il proprio nome accanto a quello del conducente 1 o 2 e compilare il foglio quotidiano","Inserire un nuovo disco a proprio nome e compilare soltanto il foglio settimanale","Non scrivere nulla sul disco e compilare soltanto il foglio settimanale"]},"en":{"q":"With a CH tachograph, a third driver drives the same vehicle on the same day. What must they do?","a":["Write their name next to that of driver 1 or 2 and fill in the daily sheet","Insert a new sheet in their own name and fill in only the weekly sheet","Write nothing on the sheet and fill in only the weekly sheet"]},"x":{"it":"Il disco CH ha solo due posizioni. Il terzo conducente scrive quindi il suo nome accanto a quello del conducente 1 o 2 e registra i propri tempi a mano nel foglio quotidiano del libretto.","en":"The CH sheet has only two positions. So the third driver writes their name next to that of driver 1 or 2 and records their own times by hand in the daily sheet of the work record book."},"src":"add35"},
{"c":"C","art":"Art. 16 cpv. 2","it":{"q":"In un'azienda con lavoro a turni, più di due conducenti usano lo stesso veicolo al giorno. Possono usare un disco individuale?","a":["Sì, con un permesso dell'autorità d'esecuzione valido un anno, con copia all'USTRA","Sì, senza permesso, purché ogni conducente scriva il proprio nome sul disco","No, il disco resta sempre uno solo per veicolo e per giorno"]},"en":{"q":"In a business with shift work, more than two drivers use the same vehicle per day. May each of them use their own sheet?","a":["Yes, with a one-year permit from the enforcement authority, copied to the Federal Roads Office","Yes, without a permit, if each driver writes their name and the time of the change on the sheet","No, there is always only one sheet per vehicle per day, however many drivers use it"]},"x":{"it":"Il disco individuale con il tachigrafo CH è un'eccezione, quindi serve un permesso dell'autorità d'esecuzione. Il permesso vale un anno e una copia va all'USTRA.","en":"An individual sheet with the CH tachograph is an exception, so a permit from the enforcement authority is needed. The permit is valid for one year and a copy goes to the Federal Roads Office."},"src":"add36"},
{"c":"C","art":"Art. 16 cpv. 7","it":{"q":"Sono ammesse iscrizioni facoltative sul disco del tachigrafo?","a":["Sì, purché non rendano difficile la lettura del disco","Sì, purché siano scritte in rosso sul retro del disco","No, sul disco sono ammesse solo le iscrizioni obbligatorie"]},"en":{"q":"Are optional entries allowed on the tachograph sheet?","a":["Yes, provided they do not make the sheet difficult to read","Yes, provided they are written in red on the back of the sheet","No, only the mandatory entries are allowed on the sheet"]},"x":{"it":"Si possono aggiungere annotazioni facoltative a una sola condizione: il disco deve restare ben leggibile per chi lo controlla. Il colore o il lato non c'entrano.","en":"Optional notes may be added on one condition only: the sheet must remain easy to read for whoever checks it. Colour or side has nothing to do with it."},"src":"add38"},
